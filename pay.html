<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LMCHAN — 원본 구매</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo_mask.png">
<link rel="apple-touch-icon" href="logo_mask.png">
<style>
  @font-face{
    font-family:'LMCHan';
    src:url('fonts/LMCHan.woff2') format('woff2'), url('LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'), url('LMCHan.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --paper:#ffffff; --ink:#141414;
    --ink-60:rgba(20,20,20,.6); --ink-35:rgba(20,20,20,.35);
    --ink-16:rgba(20,20,20,.14); --ink-08:rgba(20,20,20,.07);
    --kakao:#FEE500; --kakao-ink:#191600;
    --toss:#0064FF; --toss-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111113; --ink:#ececeb;
      --ink-60:rgba(236,236,235,.62); --ink-35:rgba(236,236,235,.35);
      --ink-16:rgba(236,236,235,.16); --ink-08:rgba(236,236,235,.08);
    }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    min-height:100%; background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;
  }
  body{ padding:32px 20px 80px; display:flex; flex-direction:column; align-items:center; }
  .wrap{ width:100%; max-width:460px; }
  .brand{
    font-family:'LMCHan', Georgia, serif; font-size:24px; letter-spacing:.12em;
    text-align:center; margin-bottom:6px; -webkit-text-stroke:.3px currentColor;
  }
  .sub{
    font-size:10px; color:var(--ink-35); letter-spacing:.06em; text-align:center;
    line-height:1.9; margin-bottom:30px;
  }
  .photo{
    width:100%; border-radius:3px; overflow:hidden; background:var(--ink-08);
    margin-bottom:22px; line-height:0;
  }
  .photo img{ width:100%; height:auto; display:block; }
  .title{ font-size:16px; letter-spacing:.03em; text-align:center; margin-bottom:6px; }
  .desc{ font-size:11px; color:var(--ink-35); letter-spacing:.04em; text-align:center; line-height:1.8; margin-bottom:16px; }
  .price{
    font-size:22px; text-align:center; font-variant-numeric:tabular-nums;
    letter-spacing:.02em; margin-bottom:22px;
  }
  /* 송금 버튼 */
  .btn{
    display:block; width:100%; padding:15px; border:none; border-radius:4px;
    text-align:center; font-size:15px; letter-spacing:.03em; text-decoration:none;
    cursor:pointer; margin-bottom:10px; transition:opacity .2s ease;
  }
  .btn:hover{ opacity:.88; }
  .btn.kakao{ background:var(--kakao); color:var(--kakao-ink); }
  .btn.toss{ background:var(--toss); color:var(--toss-ink); }
  .btn[hidden]{ display:none; }
  /* 송금 QR */
  .qr-box{ display:flex; flex-direction:column; align-items:center; margin-bottom:4px; }
  .qr-box img{
    width:100%; max-width:100%; height:auto; display:block;
    background:#fff; padding:16px; border-radius:8px; border:1px solid var(--ink-16);
  }
  .qr-cap{ font-size:11px; color:var(--ink-35); letter-spacing:.05em; margin-top:12px; }
  .steps{
    border:1px solid var(--ink-16); border-radius:4px; padding:16px 18px;
    margin-top:22px; font-size:11px; color:var(--ink-60); line-height:2; letter-spacing:.02em;
  }
  .steps b{ color:var(--ink); font-weight:600; }
  .steps .em{ color:var(--ink); }
  .foot{
    font-size:10px; color:var(--ink-35); text-align:center;
    letter-spacing:.04em; line-height:1.9; margin-top:22px;
  }
  .foot a{ color:var(--ink-60); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">LMCHAN</div>
    <div class="sub">
      사진 원본 구매 · Original purchase<br>写真オリジナルの購入
    </div>

    <div class="photo"><img id="photo" alt=""></div>
    <div class="title" id="title">—</div>
    <div class="desc" id="desc"></div>
    <div class="price" id="price"></div>

    <div class="qr-box">
      <img id="qr" alt="송금 QR 코드">
      <div class="qr-cap" id="qr-cap">카카오페이 · 토스로 스캔해 송금</div>
    </div>

    <div class="steps">
      <b>진행 순서</b><br>
      1. QR을 스캔해 표시된 금액을 송금해요.<br>
      2. 송금할 때 <span class="em">메모(내용)에 이메일 주소</span>를 적어주세요.<br>
      3. 확인 후 그 이메일로 원본 파일을 보내드려요.<br>
      <span style="color:var(--ink-35)">메모를 못 남기셨다면 아래 메일로 알려주세요.</span>
    </div>

    <div class="foot">
      문의 · Contact <a id="contact" href="#">—</a>
    </div>
  </div>

<script>
(function(){
  'use strict';

  // ==================== 설정 (여기만 바꾸면 됩니다) ====================
  var CONFIG = {
    // ▶ 송금 QR 이미지. R2 파일명(예: 'pay-qr.png')이나 전체 URL을 넣으세요.
    //    파일명만 넣으면 아래 R2_BASE 에서 불러오고, http로 시작하면 그 주소를 그대로 씁니다.
    QR_IMAGE: 'pay-qr.png',

    // 판매할 사진
    R2_BASE:    'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev',
    PHOTO_FILE: '2F9A6950.jpeg',       // R2 파일명. 전체 URL을 넣어도 됩니다.
    TITLE:      'STILLS · 2F9A6950',   // 상품명
    DESC:       '원본 파일 (고해상도)\nHigh-resolution original',
    PRICE:      30000,                 // 표시 가격(원)

    CONTACT:    'hanalmchan@gmail.com'
  };
  // ===================================================================

  // 갤러리에서 넘어온 사진 정보(?file=…&title=…&price=…)로 덮어쓴다.
  var qp = new URLSearchParams(location.search);
  if (qp.get('file'))  CONFIG.PHOTO_FILE = qp.get('file');
  if (qp.get('title')) CONFIG.TITLE = qp.get('title');
  if (qp.get('price')) CONFIG.PRICE = Number(qp.get('price')) || CONFIG.PRICE;

  var $ = function(id){ return document.getElementById(id); };
  // R2 파일명이면 R2_BASE 를 붙이고, http로 시작하면 그대로 쓴다.
  function assetUrl(f){
    return /^https?:/.test(f) ? f : (CONFIG.R2_BASE + '/' + encodeURIComponent(f));
  }
  function photoUrl(){ return assetUrl(CONFIG.PHOTO_FILE); }
  $('photo').src = photoUrl();
  $('title').textContent = CONFIG.TITLE;
  $('desc').innerHTML = String(CONFIG.DESC).replace(/\n/g,'<br>');
  $('price').textContent = '₩' + Number(CONFIG.PRICE).toLocaleString('ko-KR');
  var qr = $('qr');
  qr.src = assetUrl(CONFIG.QR_IMAGE);
  qr.onerror = function(){
    $('qr-cap').textContent = 'QR 이미지를 불러오지 못했습니다 (' + CONFIG.QR_IMAGE + ').';
  };
  $('contact').textContent = CONFIG.CONTACT;
  $('contact').href = 'mailto:' + CONFIG.CONTACT;
})();
</script>
</body>
</html>
