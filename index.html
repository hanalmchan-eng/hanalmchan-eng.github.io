<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LMCHAN — WATERMARKS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  @font-face{
    font-family:'LMCHan';
    /* 폰트 파일을 어디에 두셨든 찾도록 후보 경로를 순서대로 시도한다.
       앞에서 하나라도 성공하면 나머지는 무시된다. */
    src:url('fonts/LMCHan.woff2') format('woff2'),
        url('LMCHan.woff2') format('woff2'),
        url('font/LMCHan.woff2') format('woff2'),
        url('assets/LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'),
        url('LMCHan.otf') format('opentype'),
        url('font/LMCHan.otf') format('opentype'),
        url('assets/LMCHan.otf') format('opentype'),
        url('fonts/LMCHan-Regular.otf') format('opentype'),
        url('LMCHan-Regular.otf') format('opentype');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --paper:#ffffff;
    --ink:#141414;
    --ink-60:rgba(20,20,20,.6);
    --ink-35:rgba(20,20,20,.35);
    --ink-16:rgba(20,20,20,.14);
    --ink-08:rgba(20,20,20,.07);
    --cell:300px;        /* 로고 한 칸의 고정 너비 — 창 크기와 무관 */
    --gap:12px;          /* 로고 사이 고정 간격 — 창 크기와 무관 */
    --grid-max:1360px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111113;
      --ink:#ececeb;
      --ink-60:rgba(236,236,235,.62);
      --ink-35:rgba(236,236,235,.35);
      --ink-16:rgba(236,236,235,.16);
      --ink-08:rgba(236,236,235,.08);
    }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    min-height:100%;
    background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease, color .3s ease;
  }
  body{
    padding:20px 24px 96px;
    display:flex; flex-direction:column; align-items:center;
  }
  /* 좌상단 섹션 표시. 지금 보고 있는 쪽이 진하게 표시된다. */
  /* 각 섹션은 자기 라벨을 데리고 다닌다.
     라벨은 그 섹션이 화면에 있는 동안 위쪽에 붙어 따라오다가,
     섹션이 끝나면 함께 밀려 올라가 사라진다 (position:sticky). */
  section{
    width:100%;
    display:flex; flex-direction:column; align-items:center;
  }
  .section-label{
    position:sticky; top:20px; z-index:600;
    align-self:flex-start;
    font-family:'LMCHan', Georgia, serif;
    font-size:26px; letter-spacing:.12em; white-space:nowrap;
    color:var(--ink);
    -webkit-text-stroke:0.4px currentColor;
    margin-bottom:44px;
  }
  #models-section{ margin-bottom:96px; }
  /* 본문 속 'LMCHAN' 만 로고 폰트로.
     LMCHan 폰트에는 소문자 글리프가 없으므로 반드시 대문자로 쓸 것. */
  .lm{
    font-family:'LMCHan', Georgia, serif;
    /* LMCHan 은 좁고 길어서 같은 크기로 두면 옆 본문보다 작아 보인다 — 1.2배로 보정 */
    font-size:1.2em; letter-spacing:.06em;
    color:var(--ink-60);
    /* 진짜 볼드 자형이 없으므로 외곽선을 덧그려 굵기만 올린다 */
    -webkit-text-stroke:0.3px currentColor;
  }
  .byline{
    font-size:17px; color:var(--ink-60); letter-spacing:.04em;
    text-align:center; margin-bottom:12px;
  }
  .hint-text{
    font-size:10.8px; color:var(--ink-35); letter-spacing:.04em; line-height:2;
    text-align:center;
  }
  /* 칸 너비와 간격은 고정. 창이 좁아지면 크기가 줄어드는 대신 열 수만 4 → 2 → 1 로 바뀐다.
     남는 공간은 justify-content:center 로 양옆에 균등 분배되어 항상 가운데 정렬된다. */
  #grid{
    display:grid;
    grid-template-columns:repeat(4, var(--cell));
    justify-content:center;
    gap:var(--gap);
    width:100%;
    margin-top:56px;
  }
  /* 2열·1열에서는 칸을 고정하지 않고 창 너비에 맞춰 늘린다.
     열 사이 간격은 4열일 때(12px)의 1.5배인 18px. */
  @media (max-width:1289px){
    #grid{ grid-template-columns:repeat(2, 1fr); gap:18px; }
  }
  @media (max-width:669px){
    #grid{ grid-template-columns:1fr; gap:18px; }
  }
  .icon{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-decoration:none; color:inherit;
    padding:10px 2px; border-radius:8px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .28s cubic-bezier(.22,1,.36,1), background-color .28s ease;
  }
  .icon:hover, .icon:focus-visible{ transform:translateY(-4px); background:var(--ink-08); }
  .icon:focus-visible{ outline:1px solid var(--ink-35); outline-offset:2px; }
  .mark{
    position:relative; overflow:hidden;
    width:100%; height:150px;
    display:flex; align-items:center; justify-content:center;
  }
  .mark img, .mark canvas{
    position:absolute; top:0; left:0; max-width:none; display:block;
    opacity:0; transition:opacity .5s ease;
  }
  .mark img.is-ready, .mark canvas.is-ready{ opacity:1; }
  .mark-fallback{
    font-family:'LMCHan', Georgia, serif;
    font-size:15px; letter-spacing:.03em;
    color:var(--ink); white-space:nowrap;
  }
  .mark.has-photo .mark-fallback{ display:none; }
  .cap{
    font-size:9.5px; letter-spacing:.06em; color:var(--ink-35);
    font-variant-numeric:tabular-nums;
  }
  #empty{ font-size:11px; color:var(--ink-35); margin-top:40px; }

  /* ── 지도 ── */
  /* 지도 폭 = 로고 4열 격자의 폭 */
  #map-section{
    width:100%; max-width:calc(var(--cell) * 4 + var(--gap) * 3);
    margin-top:96px;
  }
  #map-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px;
  }
  #map-title{
    font-family:'LMCHan', Georgia, serif;
    font-size:26px; letter-spacing:.12em;
    color:var(--ink);
  }
  #map-note{ font-size:10px; color:var(--ink-35); letter-spacing:.04em; }
  /* 지도는 항상 같은 지리적 범위를 보여준다.
     안쪽(.map-inner)은 픽셀 크기가 고정이고, 창이 좁아지면 통째로 축소만 된다. */
  .map-wrap{
    position:relative; width:100%; overflow:hidden;
    border:1px solid var(--ink-16); border-radius:2px;
    background:var(--paper);
    margin-bottom:40px;
  }
  .map-wrap:last-child{ margin-bottom:0; }
  .map-inner{
    transform-origin:0 0;
    background:var(--paper);
    z-index:0;
  }
  /* 지도 오른쪽 위의 촬영 날짜 — 지도 묶음의 제목 역할 */
  .map-date{
    position:absolute; top:16px; right:18px; z-index:500;
    font-family:'LMCHan', Georgia, serif;
    font-size:30px; letter-spacing:.1em;
    color:var(--ink);
    -webkit-text-stroke:0.4px currentColor;
    pointer-events:none;
  }
  @media (max-width:669px){
    .map-date{ font-size:22px; top:10px; right:12px; }
  }
  #map-empty{
    font-size:11px; color:var(--ink-35); text-align:center;
    padding:40px 0;
  }
  /* Leaflet 기본 UI를 사이트 톤에 맞춰 정리 */
  .leaflet-container{ background:var(--paper); font-family:Helvetica, Arial, sans-serif; }
  .leaflet-control-attribution{
    background:rgba(255,255,255,.7) !important;
    font-size:9px !important; color:var(--ink-35) !important;
  }
  @media (prefers-color-scheme: dark){
    .leaflet-control-attribution{ background:rgba(0,0,0,.5) !important; }
  }
  .leaflet-control-attribution a{ color:var(--ink-35) !important; }
  .leaflet-bar a{
    background:var(--paper) !important; color:var(--ink) !important;
    border-bottom-color:var(--ink-16) !important;
  }
  .leaflet-bar{ border:1px solid var(--ink-16) !important; box-shadow:none !important; }
  /* 사진 마커 */
  .photo-pin{ background:none !important; border:none !important; }
  .photo-pin span{
    display:block; width:12px; height:12px; border-radius:50%;
    background:var(--ink); border:2px solid var(--paper);
    box-shadow:0 0 0 1px var(--ink-16);
    transition:transform .2s ease;
  }
  .photo-pin:hover span{ transform:scale(1.45); }
  /* 마커 미리보기 툴팁 */
  .leaflet-tooltip.pin-tip{
    background:var(--paper); color:var(--ink);
    border:1px solid var(--ink-16); border-radius:2px;
    box-shadow:0 6px 20px -8px rgba(0,0,0,.35);
    padding:5px;
  }
  .leaflet-tooltip.pin-tip::before{ display:none; }
  .leaflet-tooltip.pin-tip img,
  .leaflet-tooltip.pin-tip video{
    display:block; width:150px; height:auto; max-height:190px;
    object-fit:cover;
  }
  .pin-tip-cap{
    font-size:9.5px; letter-spacing:.04em; line-height:1.5;
    color:var(--ink-60); text-align:center;
    padding:6px 3px 2px; max-width:150px;
    word-break:keep-all;
  }
  .pin-tip-cap:empty{ display:none; }
  /* 영상 정지화면: 아직 못 받았을 때도 자리를 지키도록 최소 크기를 준다 */
  .leaflet-tooltip.pin-tip img.pin-poster{
    min-width:150px; min-height:84px;
    background:var(--ink-08);
  }

  /* 마커를 눌렀을 때 뜨는 사진 창 */
  #lightbox{
    position:fixed; inset:0; z-index:900;
    display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    background:rgba(0,0,0,.88);
    padding:32px; cursor:zoom-out;
  }
  #lightbox.show{ display:flex; }
  #lightbox img, #lightbox video{
    max-width:100%; max-height:82vh;
    object-fit:contain; display:block;
  }
  #lightbox img[hidden], #lightbox video[hidden]{ display:none; }
  /* 영상 재생 컨트롤을 누를 때 창이 닫히지 않도록 */
  #lightbox video{ cursor:default; }
  #lightbox-cap{
    font-size:11px; letter-spacing:.06em; color:rgba(255,255,255,.7);
    text-align:center;
  }

  @media (max-width:669px){
    body{ padding:16px 18px 72px; }
    .section-label{ font-size:20px; margin-bottom:32px; }
    #map{ height:52vh; }
    #map-head{ flex-direction:column; gap:4px; }
  }
  @media (prefers-reduced-motion:reduce){
    .icon{ transition:none; }
    .icon:hover{ transform:none; }
  }
</style>
</head>
<body>
  <section id="models-section">
    <div class="section-label">MODELS, WATERMARKS</div>
    <div class="byline">photos by <span class="lm">HAN A-LEUM</span></div>
    <div class="hint-text">
      <span class="lm">LMCHAN</span> 워터마크를 눌러 해당 사진으로<br>
      Tap an <span class="lm">LMCHAN</span> watermark to open that photo
    </div>

    <div id="grid" role="list"></div>
    <div id="empty" hidden>불러올 사진이 없습니다.</div>
  </section>

  <section id="map-section" hidden>
    <div class="section-label">ELSES, MAPS</div>
    <div id="map-head">
      <span id="map-note">마커에 커서를 올리면 미리보기 · 눌러서 크게 보기</span>
    </div>
    <div id="maps"></div>
    <div id="map-empty" hidden>좌표가 등록된 사진이 아직 없습니다.</div>
  </section>

  <div id="lightbox">
    <img id="lightbox-img" alt="">
    <video id="lightbox-video" controls loop playsinline hidden></video>
    <div id="lightbox-cap"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  'use strict';
  // ====== 설정 ======
  var GALLERY_URL = 'hanalmchan.html';
  var R2_BASE     = 'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev';
  var POSTS_JSON  = 'posts.json';    // 워터마크 갤러리용 (위 격자)
  var PLACES_JSON = 'places.json';   // 지도용 — 워터마크 없는 별도 사진 목록
  var ELSES_URL   = 'elses.html';    // 영상 전용 창

  // ── 지도 타일 ──
  // 브이월드(국토교통부 공간정보 오픈플랫폼) 인증키를 넣으면 한국 지역이
  // 훨씬 자세하게 나온다. 비워두면 OSM/CARTO 타일을 쓴다.
  //   발급: https://www.vworld.kr  →  오픈API → 인증키 발급
  //   신청 시 '활용 API'에서 반드시 [WMTS/TMS] 를 체크할 것.
  //   레이어: 'gray'(회색) | 'Base'(일반) | 'midnight'(야간) | 'Satellite'(위성)
  var VWORLD_KEY   = '';
  var VWORLD_LAYER = 'gray';
  var VWORLD_LAYER_DARK = 'midnight';
  var LOGO_W_RATIO  = 0.0936;      // 로고 너비 / 사진 너비
  var LOGO_HW_RATIO = 801 / 1429;  // 로고 높이 / 로고 너비
  // 로고 박스에서 잘라낼 여백 비율.
  // 음수를 넣으면 반대로 그만큼 더 넓게 보여준다 (위아래로 여유를 주고 싶을 때).
  var CROP_TOP = -0.08, CROP_BOTTOM = -0.08, CROP_SIDE = -0.05;
  // 로고는 칸 너비를 꽉 채우도록 그린다. MARK_H 는 지나치게 커지지 않게 막는 상한.
  var MARK_H = 420, MARK_MAX_W = 300;
  var MAP_FALLBACK = [37.5665, 126.9780]; // 좌표가 하나도 없을 때 지도 중심
  // 갤러리 링크 앵커: 확장자를 뗀 파일명 (hanalmchan.html 쪽 indexFromHash와 짝을 이룸)
  function anchorFor(post, index){
    if (post.file) return String(post.file).replace(/\.[^.]+$/, '');
    return 'i=' + index;
  }
  function hrefFor(post, index){
    return GALLERY_URL + '#' + encodeURIComponent(anchorFor(post, index));
  }
  // ==================

  var grid  = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var mapSection = document.getElementById('map-section');
  var mapEmpty   = document.getElementById('map-empty');
  var mapsWrap   = document.getElementById('maps');

  function buildImageUrl(filename){ return R2_BASE + '/' + encodeURIComponent(filename); }
  function srcOf(post){
    if (post.thumb) return /^https?:/.test(post.thumb) ? post.thumb : buildImageUrl(post.thumb);
    if (post.file)  return buildImageUrl(post.file);
    return post.url || '';
  }
  function captionOf(post, index){
    var d = post.date || post.taken || '';
    if (d){
      var m = String(d).match(/(\d{4})\D?(\d{2})\D?(\d{2})/);
      if (m) return m[1].slice(2) + '.' + m[2] + '.' + m[3];
      return String(d).slice(0, 10);
    }
    return String(index + 1).padStart(2, '0');
  }
  // 동영상 여부 (지도 항목은 사진·영상 둘 다 올 수 있다)
  function isVideo(post){
    var n = String(post.file || post.url || '').toLowerCase();
    return /\.(mp4|mov|m4v|webm)(\?|$)/.test(n);
  }
  function labelOf(post, index){
    return post.place || post.caption || captionOf(post, index);
  }

  // ---- 로고 크기 맞추기 ----
  // 칸 너비를 꽉 채우되 MARK_H 를 넘지 않게 한다.
  // 2열·1열에서는 칸 자체가 창 크기를 따라가므로 로고도 같이 커진다.
  var fitted = [];
  function fitMark(e){
    var icon = e.mark.parentElement;
    if (!icon) return;
    // .icon 의 좌우 패딩(2px씩)을 뺀 실제 사용 가능 폭
    var availW = (icon.clientWidth - 4) || MARK_MAX_W;
    var boxW = availW, boxH = boxW / e.aspect;
    if (boxH > MARK_H){ boxH = MARK_H; boxW = boxH * e.aspect; }
    e.mark.style.width  = boxW + 'px';
    e.mark.style.height = boxH + 'px';
    if (e.mode === 'crop'){
      // 원본 이미지를 CSS 로 밀어서 로고 부분만 보이게 하는 방식 (CORS 없이도 동작)
      var dispW = boxW / e.fw, dispH = boxH / e.fh;
      e.el.style.width  = dispW + 'px';
      e.el.style.height = dispH + 'px';
      e.el.style.left   = (-e.fx * dispW) + 'px';
      e.el.style.top    = (-e.fy * dispH) + 'px';
    } else {
      // 이미 잘라놓은 캔버스·이미지는 칸을 그대로 채운다
      e.el.style.width  = '100%';
      e.el.style.height = '100%';
      e.el.style.left = '0'; e.el.style.top = '0';
    }
  }
  var fitTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(fitTimer);
    fitTimer = setTimeout(function(){ fitted.forEach(fitMark); }, 100);
  });

  // ---- 원본을 한 장씩만 다루기 ----
  // 원본 사진은 4000×6000 급이라 한 장을 펼치는 데만 메모리가 100MB 가까이 든다.
  // 7장을 한꺼번에 열면 아이폰 사파리의 메모리 한계를 넘겨 버벅이거나 죽는다.
  // 그래서 (1) 한 번에 한 장씩 순서대로 받고, (2) 로고 부분만 작은 캔버스에 옮겨 그린 뒤,
  // (3) 원본은 곧바로 놓아준다. 화면에 남는 건 작은 캔버스뿐이다.
  var queue = [], busy = false;
  function enqueue(task){ queue.push(task); pump(); }
  function pump(){
    if (busy || !queue.length) return;
    busy = true;
    queue.shift()(function(){
      busy = false;
      setTimeout(pump, 0);   // 다음 장 전에 한 박자 쉬어 메모리 회수를 돕는다
    });
  }

  // ---- 아이콘 (사진에 합성된 로고를 크롭해서 사용) ----
  function makeIcon(post, index){
    var a = document.createElement('a');
    a.className = 'icon';
    a.setAttribute('role', 'listitem');
    a.href = hrefFor(post, index);
    a.setAttribute('aria-label', labelOf(post, index) + ' — 사진 열기');

    var mark = document.createElement('span');
    mark.className = 'mark';
    var fb = document.createElement('span');
    fb.className = 'mark-fallback';
    fb.textContent = 'LMCHAN';   // 소문자는 LMCHan 폰트에 글리프가 없다
    mark.appendChild(fb);

    var cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = captionOf(post, index);

    a.appendChild(mark); a.appendChild(cap);

    // posts.json 에 미리 잘라둔 로고 이미지(logo)가 있으면 그걸 그대로 쓴다.
    // 원본을 통째로 받아 크롭하지 않으므로 훨씬 가볍다 — 특히 아이폰에서.
    if (post.logo){
      enqueue(function(done){
        var limg = new Image();
        limg.decoding = 'async'; limg.alt = '';
        limg.onload = function(){
          if (limg.naturalWidth && limg.naturalHeight){
            var entry = { mark:mark, el:limg, mode:'canvas',
                          aspect: limg.naturalWidth / limg.naturalHeight };
            fitted.push(entry); fitMark(entry);
            limg.classList.add('is-ready');
            mark.classList.add('has-photo');
          }
          done();
        };
        limg.onerror = done;
        limg.src = /^https?:/.test(post.logo) ? post.logo : buildImageUrl(post.logo);
        mark.appendChild(limg);
      });
      return a;
    }

    var src = srcOf(post);
    if (src && typeof post.logoX === 'number' && typeof post.logoY === 'number'){
      enqueue(function(done){
        // 로고 영역을 사진 픽셀 기준으로 계산한다
        function region(iw, ih){
          var refW = post.width  || iw;
          var refH = post.height || ih;
          // 로고 크기는 사진의 '짧은 변'을 기준으로 잡힌다.
          // (너비 기준으로 잡으면 가로로 긴 사진에서만 크롭 박스가 과하게 커진다)
          var logoW = Math.min(refW, refH) * LOGO_W_RATIO;
          var logoH = logoW * LOGO_HW_RATIO;
          var sx = post.logoX + logoW * CROP_SIDE;
          var sy = post.logoY + logoH * CROP_TOP;
          var sw = logoW * (1 - CROP_SIDE * 2);
          var sh = logoH * (1 - CROP_TOP - CROP_BOTTOM);
          var kx = iw / refW, ky = ih / refH;   // 좌표계가 다를 경우 환산
          sx *= kx; sy *= ky; sw *= kx; sh *= ky;
          if (sx < 0){ sw += sx; sx = 0; }
          if (sy < 0){ sh += sy; sy = 0; }
          if (sx + sw > iw) sw = iw - sx;
          if (sy + sh > ih) sh = ih - sy;
          return (sw > 0 && sh > 0) ? { x:sx, y:sy, w:sw, h:sh } : null;
        }

        // CORS 가 열려 있으면 캔버스로 옮겨 그려 원본을 즉시 놓아준다(가벼움).
        // 열려 있지 않으면 CORS 없이 다시 받아 CSS 로 잘라 보여준다(무겁지만 확실히 보임).
        function attempt(useCors){
          var img = new Image();
          img.decoding = 'async';
          if (useCors) img.crossOrigin = 'anonymous';
          img.onload = function(){
            var iw = img.naturalWidth, ih = img.naturalHeight;
            var r = (iw && ih) ? region(iw, ih) : null;
            if (!r){ done(); return; }

            if (useCors){
              var dpr = Math.min(window.devicePixelRatio || 1, 2);
              var cw = Math.min(Math.round(MARK_MAX_W * dpr), Math.round(r.w));
              var ch = Math.max(1, Math.round(cw * (r.h / r.w)));
              var cv = document.createElement('canvas');
              cv.width = cw; cv.height = ch;
              try {
                cv.getContext('2d').drawImage(img, r.x, r.y, r.w, r.h, 0, 0, cw, ch);
              } catch (err){
                // 캔버스가 오염되어 그릴 수 없음 → CSS 방식으로 재시도
                img.onload = img.onerror = null;
                attempt(false);
                return;
              }
              var e1 = { mark:mark, el:cv, mode:'canvas', aspect: r.w / r.h };
              mark.appendChild(cv);
              fitted.push(e1); fitMark(e1);
              cv.classList.add('is-ready');
              mark.classList.add('has-photo');
              // 원본은 여기서 놓아준다 — 아이폰 메모리를 지키는 핵심
              img.onload = img.onerror = null;
              img.src = '';
              done();
            } else {
              var e2 = { mark:mark, el:img, mode:'crop',
                         fx:r.x / iw, fy:r.y / ih, fw:r.w / iw, fh:r.h / ih,
                         aspect: r.w / r.h };
              mark.appendChild(img);
              fitted.push(e2); fitMark(e2);
              img.classList.add('is-ready');
              mark.classList.add('has-photo');
              done();
            }
          };
          img.onerror = function(){
            img.onload = img.onerror = null;
            if (useCors) attempt(false);   // CORS 미설정으로 실패한 경우
            else done();
          };
          img.src = src;
        }
        attempt(true);
      });
    }
    return a;
  }

  // ---- 좌표 해석 ----
  // 아래 표기를 모두 같은 것으로 받아들인다 (전부 십진수 도):
  //   "lat": 37.86240, "lng": 127.17190
  //   "coord": "북 37.86240°, 동 127.17190°"
  //   "coord": "37.86240, 127.17190"
  //   "coord": "N 37.8624, E 127.1719"   /  남·서·S·W 는 음수로 처리
  // 도분초(37°51'44"N)는 지원하지 않는다 — 십진수로 바꿔서 넣을 것.
  function parseCoordString(s){
    if (typeof s !== 'string') return null;
    var re = /([북남동서NSEWnsew])?\s*(-?\d+(?:\.\d+)?)\s*°?/g;
    var lat = null, lng = null, loose = [], m;
    while ((m = re.exec(s)) !== null){
      var tag = (m[1] || '').toUpperCase();
      var v = parseFloat(m[2]);
      if (!isFinite(v)) continue;
      if (tag === '북' || tag === 'N')      lat = v;
      else if (tag === '남' || tag === 'S') lat = -v;
      else if (tag === '동' || tag === 'E') lng = v;
      else if (tag === '서' || tag === 'W') lng = -v;
      else loose.push(v);                 // 방위 표시가 없으면 '위도, 경도' 순으로 간주
    }
    if (lat === null && loose.length) lat = loose.shift();
    if (lng === null && loose.length) lng = loose.shift();
    if (lat === null || lng === null) return null;
    return { lat: lat, lng: lng };
  }
  function readCoords(p){
    var lat = p.lat, lng = p.lng;
    if (typeof lat === 'string') { var a = parseCoordString(lat); lat = a ? a.lat : null; }
    if (typeof lng === 'string') { var b = parseCoordString(lng); lng = b ? (b.lng !== null ? b.lng : b.lat) : null; }
    if (typeof lat !== 'number' || typeof lng !== 'number'){
      var c = parseCoordString(p.coord || p.coords || p.latlng || '');
      if (!c) return null;
      lat = c.lat; lng = c.lng;
    }
    if (!isFinite(lat) || !isFinite(lng)) return null;
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    return { lat: lat, lng: lng };
  }

  // ---- 사진 안의 EXIF GPS 직접 읽기 ----
  // 사진 앞부분(EXIF가 들어있는 구간)만 Range 요청으로 받아서 GPS 태그를 파싱한다.
  // 원본 전체를 받지 않으므로 가볍고, 실패하면 조용히 null을 돌려준다.
  var EXIF_BYTES = 262144; // 256KB — EXIF는 파일 맨 앞에 있으므로 이 정도면 충분

  function typeSize(t){
    return ({1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8})[t] || 1;
  }
  function readRationalTriplet(dv, o, le){
    var out = [];
    for (var i = 0; i < 3; i++){
      var num = dv.getUint32(o + i * 8, le);
      var den = dv.getUint32(o + i * 8 + 4, le);
      if (!den) return null;
      out.push(num / den);
    }
    return out[0] + out[1] / 60 + out[2] / 3600;
  }
  function readTiffGps(dv, tiff){
    var le = dv.getUint16(tiff) === 0x4949;
    function g16(o){ return dv.getUint16(o, le); }
    function g32(o){ return dv.getUint32(o, le); }
    if (g16(tiff + 2) !== 42) return null;

    var ifd0 = tiff + g32(tiff + 4);
    var n = g16(ifd0), gpsOff = 0;
    for (var i = 0; i < n; i++){
      var e = ifd0 + 2 + i * 12;
      if (g16(e) === 0x8825){ gpsOff = tiff + g32(e + 8); break; }
    }
    if (!gpsOff) return null;

    var m = g16(gpsOff);
    var latRef = 'N', lngRef = 'E', lat = null, lng = null;
    for (var j = 0; j < m; j++){
      var e2 = gpsOff + 2 + j * 12;
      var tag = g16(e2), type = g16(e2 + 2), cnt = g32(e2 + 4);
      var vo = (cnt * typeSize(type) > 4) ? (tiff + g32(e2 + 8)) : (e2 + 8);
      if (tag === 1)      latRef = String.fromCharCode(dv.getUint8(vo));
      else if (tag === 3) lngRef = String.fromCharCode(dv.getUint8(vo));
      else if (tag === 2) lat = readRationalTriplet(dv, vo, le);
      else if (tag === 4) lng = readRationalTriplet(dv, vo, le);
    }
    if (lat === null || lng === null) return null;
    if (latRef === 'S') lat = -lat;
    if (lngRef === 'W') lng = -lng;
    if (!isFinite(lat) || !isFinite(lng)) return null;
    return { lat: lat, lng: lng };
  }
  function parseExifGps(buf){
    try {
      var dv = new DataView(buf);
      if (dv.byteLength < 8 || dv.getUint16(0) !== 0xFFD8) return null;
      var off = 2;
      while (off + 4 <= dv.byteLength){
        var marker = dv.getUint16(off);
        if ((marker & 0xFF00) !== 0xFF00) return null;
        if (marker === 0xFFDA) return null;           // 이미지 데이터 시작 — EXIF 없음
        var size = dv.getUint16(off + 2);
        if (marker === 0xFFE1 && off + 10 <= dv.byteLength){
          if (dv.getUint32(off + 4) === 0x45786966)   // "Exif"
            return readTiffGps(dv, off + 10);
        }
        off += 2 + size;
      }
    } catch (err){ /* 잘린 버퍼 등 — 조용히 포기 */ }
    return null;
  }
  function fetchExifGps(url){
    return fetch(url, { headers: { 'Range': 'bytes=0-' + (EXIF_BYTES - 1) } })
      .then(function(r){ return r.ok ? r.arrayBuffer() : null; })
      .then(function(buf){ return buf ? parseExifGps(buf) : null; })
      .catch(function(){ return null; });   // CORS 미설정·네트워크 실패 등
  }

  // 수동 좌표가 있으면 그것을 쓰고, 없으면 사진의 EXIF에서 읽는다.
  function resolveCoords(post){
    var manual = readCoords(post);
    if (manual) return Promise.resolve(manual);
    var src = post.file ? buildImageUrl(post.file) : (post.url || '');
    if (!src) return Promise.resolve(null);
    return fetchExifGps(src);
  }

  // ---- 마커를 눌렀을 때 뜨는 사진 창 ----
  function openLightbox(post, index){
    var box = document.getElementById('lightbox');
    var img = document.getElementById('lightbox-img');
    var vid = document.getElementById('lightbox-video');
    var cap = document.getElementById('lightbox-cap');
    // 영상은 원본(file)을, 사진은 썸네일이 아닌 원본을 크게 보여준다
    var full = post.file ? buildImageUrl(post.file) : (post.url || '');
    if (isVideo(post)){
      img.hidden = true; img.src = '';
      vid.hidden = false; vid.src = full;
      vid.play().catch(function(){});
    } else {
      vid.hidden = true; vid.removeAttribute('src'); vid.load();
      img.hidden = false; img.src = full;
      img.alt = labelOf(post, index);
    }
    cap.textContent = [post.place, post.caption].filter(Boolean).join(' · ');
    box.classList.add('show');
  }
  function closeLightbox(){
    var box = document.getElementById('lightbox');
    box.classList.remove('show');
    document.getElementById('lightbox-img').src = '';
    var vid = document.getElementById('lightbox-video');
    vid.pause(); vid.removeAttribute('src'); vid.load();
  }
  document.getElementById('lightbox').addEventListener('click', function(e){
    // 영상 컨트롤(재생·볼륨)을 누른 경우에는 닫지 않는다
    if (e.target && e.target.id === 'lightbox-video') return;
    closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.key === 'Esc') closeLightbox();
  });

  // ---- 지도 ----
  // 지도 한 장의 고정 크기. 폭은 로고 4열 격자와 같다 (300*4 + 12*3).
  // 창이 좁아지면 이 크기를 유지한 채 통째로 축소된다.
  var MAP_W = 1236, MAP_H = 772;
  var mapScalers = [];

  // 촬영 날짜를 YYYY-MM-DD 로 뽑는다. 없으면 'undated'.
  function dateKeyOf(post){
    var d = post.date || post.taken || post.createdAt || '';
    var m = String(d).match(/(\d{4})\D?(\d{2})\D?(\d{2})/);
    return m ? (m[1] + '-' + m[2] + '-' + m[3]) : 'undated';
  }

  var pin = L.divIcon ? L.divIcon({
    className: 'photo-pin',
    html: '<span></span>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  }) : null;

  // 넓은 화면: 1236×772 를 유지한 채 통째로 축소 → 보이는 범위가 항상 같다.
  // 좁은 화면(휴대폰): 축소하면 얇은 띠가 되어버리므로, 화면 폭에 맞춰
  //                   세로로 넉넉한 비율로 다시 그린다.
  var NARROW = 900;
  function mapMetrics(){
    var avail = mapSection.clientWidth || MAP_W;
    if (window.innerWidth <= NARROW){
      var w = Math.round(avail);
      var h = Math.round(Math.min(w * 1.3, window.innerHeight * 0.68));
      return { w: w, h: h, scale: 1, narrow: true };
    }
    return { w: MAP_W, h: MAP_H, scale: Math.min(1, avail / MAP_W), narrow: false };
  }
  function frameMap(o, m){
    if (!o.map) return;
    o.map.invalidateSize(false);
    var pad = m.narrow ? [34, 34] : [70, 70];
    if (o.single){
      o.map.setView(o.single, 14);
    } else if (o.bounds){
      o.map.fitBounds(o.bounds, { padding: pad, maxZoom: 16 });
    }
  }
  function scaleMaps(){
    var m = mapMetrics();
    if (!m.w) return;
    mapScalers.forEach(function(o){
      o.inner.style.width  = m.w + 'px';
      o.inner.style.height = m.h + 'px';
      o.inner.style.transform = 'scale(' + m.scale + ')';
      o.wrap.style.height = (m.h * m.scale) + 'px';
      frameMap(o, m);
    });
  }
  var scaleTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(scaleTimer);
    scaleTimer = setTimeout(scaleMaps, 100);
  });

  // ---- 좌표 → 주소 (역지오코딩) ----
  // places.json 에 "address" 를 직접 적어두면 그것을 그대로 쓰고,
  // 없으면 OpenStreetMap Nominatim 으로 한 번 조회한 뒤 브라우저에 저장해 재사용한다.
  // Nominatim 은 초당 1회 이하로 쓰라는 이용 규칙이 있어 순서대로 천천히 요청한다.
  var addrQueue = [], addrBusy = false;
  function addrPump(){
    if (addrBusy || !addrQueue.length) return;
    addrBusy = true;
    var job = addrQueue.shift();
    job(function(){
      setTimeout(function(){ addrBusy = false; addrPump(); }, 1100);
    });
  }
  function addrCacheGet(key){
    try { return localStorage.getItem('lmchan:road2:' + key); } catch (err){ return null; }
  }
  function addrCacheSet(key, v){
    try { localStorage.setItem('lmchan:road2:' + key, v); } catch (err){}
  }
  function formatAddress(j){
    if (!j) return '';
    var a = j.address || {};
    // 도로명 + 건물번호만 (예: "일주동로 14").
    // 시·군·구·리 같은 행정구역 이름은 넣지 않는다.
    if (!a.road) return '';
    return a.house_number ? (a.road + ' ' + a.house_number) : a.road;
  }
  function resolveAddress(post, lat, lng, cb){
    if (post.address){ cb(post.address); return; }          // 직접 적어둔 경우 우선
    var key = lat.toFixed(5) + ',' + lng.toFixed(5);
    var hit = addrCacheGet(key);
    if (hit){ cb(hit); return; }
    addrQueue.push(function(done){
      function finish(text){
        if (text){ addrCacheSet(key, text); cb(text); }
        done();
      }
      var url = 'https://nominatim.openstreetmap.org/reverse' +
                '?format=jsonv2&zoom=18&accept-language=ko' +
                '&lat=' + lat + '&lon=' + lng;
      fetch(url, { headers: { 'Accept': 'application/json' } })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          var text = formatAddress(j);
          if (text){ finish(text); return; }
          // 그 지점에 도로명이 없으면 주변에서 가장 가까운 이름 있는 길을 찾는다
          nearestRoad(lat, lng, finish);
        })
        .catch(function(){ nearestRoad(lat, lng, finish); });
    });
    addrPump();
  }

  // Overpass 로 반경을 넓혀가며 이름이 있는 도로를 찾는다
  function nearestRoad(lat, lng, cb){
    var radii = [150, 400, 1200], i = 0;
    function step(){
      if (i >= radii.length){ cb(''); return; }
      var r = radii[i++];
      var q = '[out:json][timeout:20];way(around:' + r + ',' + lat + ',' + lng +
              ')["highway"]["name"];out center 40;';
      fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(q)
      })
        .then(function(res){ return res.ok ? res.json() : null; })
        .then(function(j){
          var best = '', bestD = Infinity;
          var els = (j && j.elements) || [];
          var kx = Math.cos(lat * Math.PI / 180);
          els.forEach(function(el){
            var c = el.center || el;
            var name = el.tags && el.tags.name;
            if (!name || typeof c.lat !== 'number') return;
            var dy = c.lat - lat, dx = (c.lon - lng) * kx;
            var d = dy * dy + dx * dx;
            if (d < bestD){ bestD = d; best = name; }
          });
          if (best) cb(best); else step();
        })
        .catch(function(){ step(); });
    }
    step();
  }

  function addMarker(map, item){
      var p = item.post;
      var ll = [item.lat, item.lng];
      var m = L.marker(ll, { icon: pin, title: labelOf(p, item.index) }).addTo(map);
      // 커서를 올리면 축소본 미리보기.
      // 영상은 썸네일 파일을 따로 만들 필요 없이, 브라우저가 영상 앞부분만 조각으로
      // 받아 0.5초 지점 한 프레임을 정지화면처럼 보여준다(preload="metadata" + #t=0.5).
      // 커서를 잠깐 스치는 정도로는 재생하지 않고, 0.45초 이상 머무르면 그때 재생을 시작한다.
      var tip = document.createElement('div');
      var media;
      if (isVideo(p) && !p.thumb){
        // 영상은 재생하지 않는다. 첫 프레임 한 장만 뽑아 정지화면으로 쓰고,
        // 그 결과를 브라우저에 저장해두어 다음부터는 영상을 아예 받지 않는다.
        media = document.createElement('img');
        media.alt = '';
        media.className = 'pin-poster';

        var key = 'lmchan:poster:' + (p.file || p.url || '');
        var cached = null;
        try { cached = localStorage.getItem(key); } catch (err){}

        if (cached){
          media.src = cached;
        } else {
          var grabbed = false;
          m.on('mouseover', function(){
            if (grabbed) return;
            grabbed = true;
            var v = document.createElement('video');
            v.preload = 'metadata';
            v.muted = true; v.playsInline = true;
            v.crossOrigin = 'anonymous';
            v.addEventListener('loadeddata', function(){
              try {
                var vw = v.videoWidth, vh = v.videoHeight;
                if (vw && vh){
                  var cw = 320, ch = Math.max(1, Math.round(cw * vh / vw));
                  var cv = document.createElement('canvas');
                  cv.width = cw; cv.height = ch;
                  cv.getContext('2d').drawImage(v, 0, 0, cw, ch);
                  var url = cv.toDataURL('image/jpeg', 0.72);
                  media.src = url;
                  try { localStorage.setItem(key, url); } catch (err){}
                }
              } catch (err){
                // CORS 미설정 등으로 프레임을 못 뽑은 경우 — 조용히 포기
              }
              v.removeAttribute('src'); v.load();   // 영상 즉시 해제
            }, { once:true });
            v.addEventListener('error', function(){
              v.removeAttribute('src');
            }, { once:true });
            v.src = srcOf(p) + '#t=0.5';
            v.load();
          });
        }
      } else {
        media = document.createElement('img');
        media.src = srcOf(p);   // thumb 가 있으면 srcOf 가 그걸 쓴다
        media.alt = '';
      }
      tip.appendChild(media);

      // 미리보기 아래에 그 위치의 주소
      var tcap = document.createElement('div');
      tcap.className = 'pin-tip-cap';
      tip.appendChild(tcap);
      resolveAddress(p, item.lat, item.lng, function(text){
        tcap.textContent = text;
      });

      m.bindTooltip(tip, {
        className:'pin-tip', direction:'top', offset:[0,-12], opacity:1
      });
      // 영상은 별도 창(elses.html)에서, 사진은 그 자리에서 크게
      m.on('click', function(){
        if (isVideo(p)){
          window.open(ELSES_URL + '?f=' + encodeURIComponent(p.file || ''),
                      '_blank', 'noopener');
        } else {
          openLightbox(p, item.index);
        }
      });
  }

  function buildMaps(located){
    if (typeof L === 'undefined') return;      // Leaflet 로드 실패 시 조용히 건너뜀
    mapSection.hidden = false;

    if (!located.length){
      mapEmpty.hidden = false;
      return;
    }

    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var tileUrl, tileAttr;
    if (VWORLD_KEY){
      // 브이월드 WMTS — 주소에서 z / y / x 순서에 주의
      tileUrl = 'https://api.vworld.kr/req/wmts/1.0.0/' + VWORLD_KEY + '/' +
                (dark ? VWORLD_LAYER_DARK : VWORLD_LAYER) + '/{z}/{y}/{x}.png';
      tileAttr = '&copy; <a href="https://www.vworld.kr">VWorld</a>';
    } else {
      // *_nolabels = 지명·도로명 등 글자가 전혀 없는 판.
      // 글자를 다시 넣고 싶으면 nolabels → all 로 바꾸면 된다.
      tileUrl = dark
        ? 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png';
      tileAttr = '&copy; OpenStreetMap &copy; CARTO';
    }

    // 지도 한 장 = 하루. 같은 날 찍은 사진들을 한 지도에 모은다.
    var byDate = {}, order = [];
    located.forEach(function(item){
      var key = dateKeyOf(item.post);
      if (!byDate[key]){ byDate[key] = []; order.push(key); }
      byDate[key].push(item);
    });
    // 최근 날짜가 위로 (날짜 없는 묶음은 맨 뒤)
    order.sort(function(a, b){
      if (a === 'undated') return 1;
      if (b === 'undated') return -1;
      return a < b ? 1 : (a > b ? -1 : 0);
    });

    order.forEach(function(key){
      var items = byDate[key];

      var wrap  = document.createElement('div');
      var inner = document.createElement('div');
      wrap.className = 'map-wrap';
      inner.className = 'map-inner';
      var m0 = mapMetrics();
      inner.style.width  = m0.w + 'px';
      inner.style.height = m0.h + 'px';
      wrap.appendChild(inner);

      // 날짜는 지도 오른쪽 위에. 축소에 영향받지 않도록 지도 바깥 층에 둔다.
      var dateEl = document.createElement('div');
      dateEl.className = 'map-date';
      dateEl.textContent = (key === 'undated') ? '' : key.replace(/-/g, '.');
      wrap.appendChild(dateEl);
      mapsWrap.appendChild(wrap);

      var map = L.map(inner, {
        // 축척은 그날 사진들에 맞춰 정해지므로 날마다 다르다
        zoomControl:false, dragging:false, scrollWheelZoom:false,
        doubleClickZoom:false, touchZoom:false, boxZoom:false, keyboard:false
      });
      L.tileLayer(tileUrl, { maxZoom: 19, attribution: tileAttr }).addTo(map);

      var lls = [];
      items.forEach(function(o){
        addMarker(map, o);
        lls.push([o.lat, o.lng]);
      });

      // 그날 사진이 모두 들어가도록 범위를 맞춘다.
      // 실제 적용은 scaleMaps() 가 화면 크기를 보고 처리한다.
      mapScalers.push({
        wrap: wrap, inner: inner, map: map,
        single: (lls.length === 1) ? lls[0] : null,
        bounds: (lls.length > 1) ? L.latLngBounds(lls) : null
      });
    });

    scaleMaps();
  }

  // ---- 로드 ----
  fetch(POSTS_JSON + '?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(posts){
      posts = (posts || []).filter(function(p){ return p && (p.file || p.url); });
      if (!posts.length){ empty.hidden = false; return; }
      var frag = document.createDocumentFragment();
      posts.forEach(function(p, i){ frag.appendChild(makeIcon(p, i)); });
      grid.appendChild(frag);
    })
    .catch(function(){ empty.hidden = false; });

  // ---- 지도: places.json (워터마크 갤러리와는 별개의 사진 목록) ----
  // places.json 은 날짜가 상위 단위다.
  //   [ { "date": "2026-07-19", "items": [ {file, coord}, {file, coord}, ... ] }, ... ]
  // 한 날짜 아래에 사진·영상을 여러 개, 각각 다른 좌표로 넣을 수 있다.
  // (예전처럼 항목마다 date 를 적은 평평한 배열도 그대로 인식한다)
  function flattenPlaces(raw){
    var out = [];
    (raw || []).forEach(function(entry){
      if (!entry) return;
      var list = entry.items || entry.photos;
      if (Array.isArray(list)){
        list.forEach(function(it){
          if (!it) return;
          var o = (typeof it === 'string') ? { file: it } : it;
          if (!o.date) o.date = entry.date;      // 날짜는 상위에서 물려받는다
          if (o.file || o.url) out.push(o);
        });
      } else if (entry.file || entry.url){
        out.push(entry);
      }
    });
    return out;
  }

  fetch(PLACES_JSON + '?v=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(raw){
      var places = flattenPlaces(raw);
      // 좌표: places.json의 수동값 우선, 없으면 사진 EXIF에서 읽어온다
      return Promise.all(places.map(resolveCoords)).then(function(coords){
        var located = [];
        coords.forEach(function(c, i){
          if (c) located.push({ post: places[i], index: i, lat: c.lat, lng: c.lng });
        });
        buildMaps(located);
      });
    })
    .catch(function(){ buildMaps([]); });
})();
</script>
