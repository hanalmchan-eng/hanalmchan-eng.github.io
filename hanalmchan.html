<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hanalmchan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<style>
  @font-face{
    font-family:'LMCHan';
    src:url('fonts/LMCHan.woff2') format('woff2'),
        url('LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'),
        url('LMCHan.otf') format('opentype');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    color: #111111;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  #canvas.dragging { cursor: grabbing; }
  #plane {
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 1px;
    will-change: transform;
    transform: translate3d(0, 0, 0) scale(0.2688);
    transform-origin: 0 0;
  }
  #hint {
    position: fixed;
    left: 20px;
    z-index: 100;
    pointer-events: none;
    mix-blend-mode: difference;
    transition: opacity 0.5s;
  }
  #hint.hidden { opacity: 0; }
  #hint-text {
    font-size: 10px;
    color: #ffffff;
    letter-spacing: 0.04em;
    line-height: 1.6;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  #hint-text.fade { opacity: 0 !important; }
  #nav {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    font-size: 12px; mix-blend-mode: difference; color: #ffffff;
  }
  #nav a { color: inherit; text-decoration: none; margin-left: 12px; }
  #nav a:hover { color: #888888; }
  #back-link, #order-link, #behind-link {
    position: fixed; z-index: 100;
    font-family: 'LMCHan', Georgia, serif;
    font-size: 22px; letter-spacing: 0.14em;
    color: #ffffff;
    -webkit-text-stroke: 0.7px currentColor;
    text-decoration: none;
    padding: 5px 10px;
    mix-blend-mode: difference;
    transition: opacity 0.3s ease;
  }
  #back-link { bottom: 20px; left: 20px; opacity: 0.9; }
  #order-link { bottom: 20px; right: 20px; opacity: 0.9; }
  #back-link:hover, #order-link:hover { opacity: 1; }
  /* 비하인드 영상 버튼: 그 사진에 영상이 있을 때만 오른쪽 위에 나타남 */
  #behind-link {
    top: 20px; right: 20px;
    text-transform: lowercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    text-transform: lowercase;
  }
  #behind-link.visible { opacity: 0.75; pointer-events: auto; }
  #behind-link.visible:hover { opacity: 1; }
  #behind-link.active { opacity: 1; }
  .post { position: absolute; top: 0; left: 0; }
  .post img.photo {
    display: block;
    max-height: none;
    max-width: none;
    -webkit-user-drag: none;
    -khtml-user-drag: none;
    -moz-user-drag: none;
    -o-user-drag: none;
    user-drag: none;
    pointer-events: none;
  }
  .post img.photo-before {
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 2;
  }
  .post.show-before img.photo-before { opacity: 1; }
  /* 비하인드 영상: "unseen" 버튼을 누르면 사진 위에 한 겹 더 뜬다.
     width/height/left/top은 실제 픽셀 값으로 JS가 계산해 넣는다(아래
     onMediaReady 참고) — 부모(.plane)의 확대/이동 transform 하나만 적용받고,
     영상 자신은 별도 transform을 쓰지 않는다. 드래그 중 부모 transform이
     계속 바뀌는 상황에서, 자식 영상에 또 다른 transform까지 겹쳐 있으면
     일부 모바일 브라우저가 재생 중인 영상을 리페인트 도중 멈추거나
     깜빡이게 만드는 문제가 있어 이렇게 우회한다. */
  .post video.photo-behind {
    position: absolute;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 3;
    pointer-events: none;
  }
  .post.show-behind video.photo-behind { opacity: 1; }
  .post-photo a, .post-photoset a {
    display: block;
    cursor: inherit;
    pointer-events: none;
  }
  .photo-wrap {
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .post-text, .post-quote, .post-link {
    width: 625px;
    padding: 20px;
  }
  .caption {
    margin-top: 10px; font-size: 12px; color: #111111;
    max-width: 625px;
    padding: 10px; background: rgba(255,255,255,0.9);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 300; font-size: 12px; color: #888; letter-spacing: 0.1em;
    text-align: center; line-height: 2;
    animation: blink 1.2s ease-in-out infinite;
  }
  #info-popup {
    position: fixed; inset: 0; z-index: 400;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; transition: opacity 0.25s ease;
    padding: 24px;
  }
  #info-popup.show { display: flex; opacity: 1; }
  #info-card {
    position: relative;
    max-width: 420px; width: 100%;
    background: transparent;
    color: #ffffff;
    border-radius: 20px;
    border: none;
    padding: 30px 28px;
    box-shadow: 0 12px 50px rgba(0,0,0,0.30);
    font-size: 13px; line-height: 1.7;
    transform: translateY(8px); transition: transform 0.25s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  #info-card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 20px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    -webkit-mask:
      linear-gradient(#000 0 0),
      url('logo_mask.png') no-repeat right 22px bottom 20px / 45px 42px;
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0),
      url('logo_mask.png') no-repeat right 22px bottom 20px / 45px 42px;
    mask-composite: exclude;
    z-index: -1;
  }
  #info-popup.show #info-card { transform: translateY(0); }
  #info-card .info-lead { margin-bottom: 14px; color: #ffffff; }
  #info-card .info-lead:last-of-type { margin-bottom: 0; }
  #info-card .info-price { border-top: 1px solid rgba(255,255,255,0.22); margin-top: 18px; padding-top: 16px; }
  #info-card .info-price-row { display: flex; align-items: baseline; gap: 12px; margin: 8px 0; }
  #info-card .info-price-label { flex: 0 0 auto; font-weight: 600; color: #ffffff; min-width: 36px; }
  #info-card .info-price-val { color: rgba(255,255,255,0.92); letter-spacing: 0.02em; }
  #info-card .info-price-val em { font-style: normal; color: rgba(255,255,255,0.6); font-size: 11px; }
</style>
</head>
<body>
<div id="hint"><div id="hint-text"></div></div>
<div id="nav"></div>
<a id="back-link" href="index.html?from=ig">AWAY</a>
<a id="order-link" href="pay.html">yours</a>
<a id="behind-link" href="#" role="button">unseen</a>
<div id="loading">불러오는 중...<br>loading...<br>読み込み中...</div>
<div id="canvas">
  <div id="plane"></div>
</div>
<div id="logo-hit" style="position:fixed; z-index:90; display:none; cursor:pointer;"></div>
<div id="info-popup">
  <div id="info-card">
    <p class="info-lead">아름다움 한 아름. 인연이 닿아 현 삶의 단계의 모습을 기록으로 남기게 되어 영광입니다.</p>
    <p class="info-lead">사진 제공은 업로드 허용을 조건으로 하며, 보정본 1장, 그리고 전체 압축본을 기본으로 제공해 드립니다.</p>
    <div class="info-price">
      <div class="info-price-row">
        <span class="info-price-label">원본</span>
        <span class="info-price-val">10장 당 5만원 <em>(전체 15만원)</em></span>
      </div>
      <div class="info-price-row">
        <span class="info-price-label">보정</span>
        <span class="info-price-val">장당 2만원 <em>(인쇄·포스터용 고해상도 장당 3만원)</em></span>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  'use strict';
  var R2_BASE = 'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev';
  var PAY_URL = 'pay.html';
  var ORDER_PRICE = 30000;
  var gap = 4;
  var planeScale = 0.2688;
  var curImgW = 0, curImgH = 0;
  var HEADER_X = 20;
  var HEADER_Y = 20;
  var HOLD_DELAY = 3000;     // 이 시간 이상 누르면 원본(before) 표시
  var BEHIND_AREA_RATIO = 0.77; // 비하인드 영상이 보이는 "면적"을 사진 면적의 77%로
  var viewMode = 'zoom';
  var fitScale = 0.2688;
  var zoomScale = 0.2688;
  if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = [r, r, r, r];
      r = r || [0, 0, 0, 0];
      this.moveTo(x + r[0], y);
      this.lineTo(x + w - r[1], y);
      this.arcTo(x + w, y, x + w, y + r[1], r[1]);
      this.lineTo(x + w, y + h - r[2]);
      this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
      this.lineTo(x + r[3], y + h);
      this.arcTo(x, y + h, x, y + h - r[3], r[3]);
      this.lineTo(x, y + r[0]);
      this.arcTo(x, y, x + r[0], y, r[0]);
      return this;
    };
  }
  var canvas   = document.getElementById('canvas');
  var plane    = document.getElementById('plane');
  var hint     = document.getElementById('hint');
  var hintText = document.getElementById('hint-text');
  var loadingEl = document.getElementById('loading');
  var logoHit  = document.getElementById('logo-hit');
  var orderLink = document.getElementById('order-link');
  var behindLink = document.getElementById('behind-link');
  function stem(name){ return String(name || '').replace(/\.[^.]+$/, ''); }
  function updateOrderLink(post) {
    if (!orderLink || !post) return;
    var params = new URLSearchParams();
    if (post.file) params.set('file', post.file);
    params.set('title', post.caption || stem(post.file) || 'LMCHAN');
    params.set('price', String(post.price || ORDER_PRICE));
    orderLink.href = PAY_URL + '?' + params.toString();
  }
  var LOGO_W_RATIO = 0.0936;
  var LOGO_HW_RATIO = 801 / 1429;
  var HIT_PAD = 1.6;
  function positionHint() {
    if (!hint) return;
    if (viewMode === 'zoom' && curImgW) {
      var logoW = curImgW * LOGO_W_RATIO * planeScale;
      var logoH = logoW * LOGO_HW_RATIO;
      hint.style.top = (HEADER_Y + logoH + 8) + 'px';
    } else {
      hint.style.top = HEADER_Y + 'px';
    }
  }
  window.addEventListener('resize', positionHint);
  var hintHidden = false;
  var hideTimer = null;
  function hideHint() {
    if (hintHidden || !hint) return;
    hintHidden = true;
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
      if (hint) hint.classList.add('hidden');
    }, 6000);
  }
  setTimeout(hideHint, 99000);
  function showHintAgain(autoHideMs) {
    if (!hint) return;
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    hint.classList.remove('hidden');
    hintHidden = false;
    var ms = (typeof autoHideMs === 'number') ? autoHideMs : 4000;
    hideTimer = setTimeout(function() {
      if (hint) hint.classList.add('hidden');
      hintHidden = true;
    }, ms);
  }
  function showLoading() {
    if (!loadingEl || !document.body.contains(loadingEl)) {
      loadingEl = document.createElement('div');
      loadingEl.id = 'loading';
      loadingEl.innerHTML = '불러오는 중...<br>loading...<br>読み込み中...';
      document.body.appendChild(loadingEl);
    }
  }
  var tx = 0, ty = 50;
  var bounds = { minX: 0, minY: 0, maxX: 0, maxY: 0 };
  var ZOOM_K = 1.05;
  var BASE_DPR = window.devicePixelRatio || 1;
  function computeScales(imgW, imgH) {
    if (!imgW || !imgH) return;
    curImgW = imgW; curImgH = imgH;
    zoomScale = ZOOM_K / BASE_DPR;
    fitScale = window.innerWidth / imgW;
  }
  function setHintText(mode) {
    if (!hintText) return;
    if (mode === 'zoom') {
      hintText.innerHTML =
        '끌어서 둘러보기 · 로고를 클릭하여 다음 · 두 번 클릭 또는 축소 제스처로 전체<br>' +
        'Drag to explore · Click logo for next · Double-click or pinch out for full<br>' +
        'ドラッグで探索 · ロゴをクリックで次へ · ダブルクリックまたはピンチで全体表示';
    } else {
      hintText.innerHTML =
        '로고를 눌러 다음 · 두 번 클릭 또는 확대 제스처로 자세히<br>' +
        'Tap logo for next · Double-click or pinch in to zoom<br>' +
        'ロゴをタップで次へ · ダブルクリックまたはピンチで拡大';
    }
  }
  function applyMode() {
    if (viewMode === 'zoom') {
      planeScale = zoomScale;
      setHintText('zoom');
      setTimeout(positionHint, 50);
    } else {
      planeScale = fitScale;
      setHintText('fit');
      setTimeout(positionHint, 50);
    }
  }
  function updateBounds() {
    var posts = document.querySelectorAll('#plane .post');
    if (posts.length === 0) return;
    var maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      var pw = p.offsetWidth * planeScale;
      var ph = p.offsetHeight * planeScale;
      if (pw > maxX) maxX = pw;
      if (ph > maxY) maxY = ph;
    }
    var W = window.innerWidth, H = window.innerHeight;
    if (maxX >= W) { bounds.maxX = 0; bounds.minX = -(maxX - W); }
    else { var cx = (W - maxX) / 2; bounds.maxX = cx; bounds.minX = cx; }
    if (maxY >= H) {
      bounds.maxY = 0; bounds.minY = -(maxY - H);
    } else if (viewMode === 'fit') {
      bounds.maxY = 0; bounds.minY = 0;
    } else {
      var cy = (H - maxY) / 2; bounds.maxY = cy; bounds.minY = cy;
    }
  }
  function clampPosition() {
    if (tx > bounds.maxX) tx = bounds.maxX;
    if (tx < bounds.minX) tx = bounds.minX;
    if (ty > bounds.maxY) ty = bounds.maxY;
    if (ty < bounds.minY) ty = bounds.minY;
  }
  function updateTransform() {
    clampPosition();
    plane.style.transform = 'translate3d(' + tx + 'px, ' + ty + 'px, 0) scale(' + planeScale + ')';
    updateLogoHit();
  }
  function updateLogoHit() {
    if (!logoHit) return;
    if (!currentPost ||
        typeof currentPost.logoX !== 'number' || typeof currentPost.logoY !== 'number') {
      logoHit.style.display = 'none';
      return;
    }
    var lw = curImgW * LOGO_W_RATIO;
    var lh = lw * LOGO_HW_RATIO;
    var sx = tx + currentPost.logoX * planeScale;
    var sy = ty + currentPost.logoY * planeScale;
    var sw = lw * planeScale;
    var sh = lh * planeScale;
    var padW = sw * (HIT_PAD - 1) / 2;
    var padH = sh * (HIT_PAD - 1) / 2;
    logoHit.style.display = 'block';
    logoHit.style.left = (sx - padW) + 'px';
    logoHit.style.top = (sy - padH) + 'px';
    logoHit.style.width = (sw * HIT_PAD) + 'px';
    logoHit.style.height = (sh * HIT_PAD) + 'px';
  }
  function layoutPosts() {
    var posts = document.querySelectorAll('#plane .post');
    if (posts.length === 0) return;
    var x = 0;
    for (var i = 0; i < posts.length; i++) {
      var post = posts[i];
      var w = post.offsetWidth;
      var h = post.offsetHeight;
      if (w === 0 || h === 0) continue;
      post.style.left = x + 'px';
      post.style.top = '0px';
      x += w + gap;
    }
    updateBounds();
  }
  function buildImageUrl(filename) {
    return R2_BASE + '/' + encodeURIComponent(filename);
  }
  var currentPost = null;
  function alignToLogo(post) {
    if (post) currentPost = post;
    var p = currentPost;
    if (!p) return;
    var lx = p.logoX, ly = p.logoY;
    if (typeof lx !== 'number' || typeof ly !== 'number') return;
    tx = HEADER_X - lx * planeScale;
    ty = HEADER_Y - ly * planeScale;
    updateTransform();
  }
  var allPosts = [];
  var currentIndex = 0;
  var currentPostEl = null;
  var hasBefore = false;
  var hasBehind = false;        // 이 사진에 비하인드 영상이 있는지
  var behindVideoEl = null;     // 현재 포스트의 비하인드 <video> 엘리먼트 참조
  var nextQueue = [];
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function refillQueue(excludeIndex){
    var idxs = [];
    for (var i = 0; i < allPosts.length; i++){
      if (i !== excludeIndex) idxs.push(i);
    }
    nextQueue = shuffle(idxs);
  }
  function indexFromHash(posts) {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (!h) return 0;
    var m = h.match(/^i=(\d+)$/);
    if (m) {
      var n = parseInt(m[1], 10);
      return (n >= 0 && n < posts.length) ? n : 0;
    }
    var key = h.toLowerCase();
    for (var i = 0; i < posts.length; i++) {
      var f = String(posts[i].file || '').toLowerCase();
      if (f === key || f.replace(/\.[^.]+$/, '') === key) return i;
    }
    return 0;
  }
  function renderPosts(posts) {
    posts = (posts || []).filter(function(p) {
      if (!p) return false;
      if (p.file) return true;
      if (p.url && p.url.indexOf('undefined') === -1) return true;
      return false;
    });
    if (posts.length === 0) {
      if (loadingEl) loadingEl.textContent = '아직 업로드된 사진이 없어요.';
      return;
    }
    allPosts = posts;
    currentIndex = 0;
    showPost(indexFromHash(posts));
    window.addEventListener('hashchange', function() {
      showPost(indexFromHash(allPosts));
    });
  }
  function positionForMode() {
    if (viewMode === 'zoom') {
      alignToLogo(null);
    } else {
      var W = window.innerWidth;
      tx = (W - curImgW * planeScale) / 2;
      ty = 0;
      updateTransform();
    }
  }
  function showPost(index) {
    if (allPosts.length === 0) return;
    currentIndex = (index % allPosts.length + allPosts.length) % allPosts.length;
    var post = allPosts[currentIndex];
    currentPost = post;
    updateOrderLink(post);
    if (post.file && window.history && history.replaceState) {
      try {
        history.replaceState(null, '',
          '#' + encodeURIComponent(post.file.replace(/\.[^.]+$/, '')));
      } catch (err) { }
    }
    plane.innerHTML = '';
    currentPostEl = null;
    hasBefore = false;
    hasBehind = false;
    behindVideoEl = null;
    if (behindLink) { behindLink.classList.remove('visible', 'active'); }
    viewMode = 'zoom';
    showLoading();
    var div = document.createElement('div');
    div.className = 'post post-photo';
    var img = document.createElement('img');
    img.className = 'photo';
    img.src = post.file ? buildImageUrl(post.file) : post.url;
    img.alt = post.caption || '';
    img.draggable = false;
    img.addEventListener('load', function() {
      var w = img.naturalWidth, h = img.naturalHeight;
      img.style.width = w + 'px';
      img.style.height = h + 'px';
      if (beforeImg) {
        beforeImg.style.width = w + 'px';
        beforeImg.style.height = h + 'px';
      }
      computeScales(w, h);
      sizeBehindVideo();   // 이 시점에 사진 크기(curImgW/H)가 정해짐 — 영상 쪽도 준비됐다면 같이 계산
      applyMode();
      layoutPosts();
      positionForMode();
      showHintAgain(2000);
      if (loadingEl) loadingEl.remove();
    });
    img.addEventListener('error', function() {
      if (div.parentNode) div.parentNode.removeChild(div);
    });
    div.appendChild(img);
    var beforeImg = null;
    if (post.before) {
      beforeImg = document.createElement('img');
      beforeImg.className = 'photo photo-before';
      beforeImg.src = buildImageUrl(post.before);
      beforeImg.alt = '';
      beforeImg.draggable = false;
      div.appendChild(beforeImg);
      hasBefore = true;
    }
    // 비하인드 영상: 이 사진을 보는 순간부터(=지금) 미리 다운로드를 시작해 둔다.
    // 7초 이상 누르면 showBehind()가 이걸 그대로 재생만 시키므로 로딩 지연이 없다.
    if (post.behind) {
      behindVideoEl = document.createElement('video');
      behindVideoEl.className = 'photo photo-behind';
      behindVideoEl.muted = true;
      behindVideoEl.loop = true;               // 계속 무한 루프
      behindVideoEl.playsInline = true;
      behindVideoEl.setAttribute('playsinline', '');
      behindVideoEl.setAttribute('webkit-playsinline', '');
      behindVideoEl.disablePictureInPicture = true;
      behindVideoEl.preload = 'auto';          // 지금 바로 다운로드 시작
      behindVideoEl.draggable = false;
      behindVideoEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
      behindVideoEl.addEventListener('loadedmetadata', sizeBehindVideo); // 영상 쪽이 나중에 준비되는 경우 대비
      behindVideoEl.src = buildImageUrl(post.behind);
      div.appendChild(behindVideoEl);
      hasBehind = true;
      if (behindLink) behindLink.classList.add('visible');
    }
    if (post.caption) {
      var cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = post.caption;
      div.appendChild(cap);
    }
    plane.appendChild(div);
    currentPostEl = div;
    layoutPosts();
    setTimeout(function(){ layoutPosts(); positionForMode(); }, 500);
    setTimeout(function(){ layoutPosts(); positionForMode(); }, 1500);
  }
  function nextPost() {
    if (allPosts.length <= 1) { showPost(currentIndex + 1); return; }
    if (!nextQueue.length) refillQueue(currentIndex);
    var idx = nextQueue.shift();
    showPost(idx);
  }
  function enterZoom() {
    if (viewMode === 'zoom') return;
    viewMode = 'zoom';
    applyMode();
    layoutPosts();
    alignToLogo(currentPost);
    updateTransform();
    showHintAgain();
  }
  function enterFit() {
    if (viewMode === 'fit') return;
    viewMode = 'fit';
    applyMode();
    layoutPosts();
    positionForMode();
    showHintAgain();
  }
  function toggleMode() {
    if (viewMode === 'fit') enterZoom(); else enterFit();
  }
  function showBefore() {
    if (hasBefore && currentPostEl) currentPostEl.classList.add('show-before');
  }
  function hideBefore() {
    if (currentPostEl) currentPostEl.classList.remove('show-before');
  }
  // 비하인드 영상 박스 크기: 사진 비율이 아니라 영상 자신의 실제 비율로
  // 정한다(그래야 object-fit:cover가 잘라내는 부분 없이 전체가 보임).
  // 대신 화면에 "보이는 면적"은 사진 면적 × BEHIND_AREA_RATIO로 맞춘다.
  // 사진 크기(curImgW/H)와 영상 자체 크기(videoWidth/Height)가 둘 다
  // 준비돼야 계산할 수 있어서, 둘 중 늦게 끝나는 쪽에서 호출해도 안전하게
  // 다시 계산하도록 만들어 둔다.
  function sizeBehindVideo() {
    if (!behindVideoEl) return;
    var vidW = behindVideoEl.videoWidth, vidH = behindVideoEl.videoHeight;
    if (!vidW || !vidH || !curImgW || !curImgH) return; // 아직 둘 다 준비되지 않음
    var targetArea = curImgW * curImgH * BEHIND_AREA_RATIO;
    var ratio = vidW / vidH; // 영상 자신의 실제 가로/세로 비율
    var vw = Math.sqrt(targetArea * ratio);
    var vh = Math.sqrt(targetArea / ratio);
    behindVideoEl.style.width  = vw + 'px';
    behindVideoEl.style.height = vh + 'px';
    behindVideoEl.style.left = ((curImgW - vw) / 2) + 'px';
    behindVideoEl.style.top  = ((curImgH - vh) / 2) + 'px';
  }
  function showBehind() {
    if (!hasBehind || !currentPostEl) return;
    currentPostEl.classList.add('show-behind');
    if (behindLink) behindLink.classList.add('active');
    if (behindVideoEl) {
      try { behindVideoEl.currentTime = 0; } catch (err) {}
      var p = behindVideoEl.play();
      if (p && p.catch) p.catch(function(){ /* 자동재생 실패 시 조용히 무시 */ });
    }
  }
  function hideBehind() {
    if (currentPostEl) currentPostEl.classList.remove('show-behind');
    if (behindLink) behindLink.classList.remove('active');
    if (behindVideoEl) behindVideoEl.pause();
  }
  // "unseen" 버튼: 누르면 비하인드 영상을 켜고, 다시 누르면 끈다.
  // 3초/7초 길게 누르기와는 별개의, 확실하고 의도적인 접근 방법.
  function toggleBehindManual() {
    if (!hasBehind) return;
    if (currentPostEl && currentPostEl.classList.contains('show-behind')) {
      hideBehind();
    } else {
      showBehind();
    }
  }
  if (behindLink) {
    // 터치 기기에서는 touchend가 처리한 뒤 브라우저가 뒤이어 합성 click을
    // 또 보낼 수 있어서, 그대로 두면 "켜짐→꺼짐"이 한 번의 탭 안에서
    // 연속으로 일어나 버린다. 짧은 시간 동안 click을 무시해 중복을 막는다.
    var behindTouchHandled = false;
    behindLink.addEventListener('touchend', function(e){
      e.preventDefault(); e.stopPropagation();
      behindTouchHandled = true;
      toggleBehindManual();
      setTimeout(function(){ behindTouchHandled = false; }, 500);
    }, { passive: false });
    behindLink.addEventListener('click', function(e){
      e.preventDefault();
      if (behindTouchHandled) return;
      toggleBehindManual();
    });
  }
  fetch('posts.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(posts) { renderPosts(posts); })
    .catch(function() {
      if (loadingEl) loadingEl.textContent = '포스트를 불러올 수 없어요.';
    });
  var resizeTimer = null;
  window.addEventListener('resize', function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (curImgW && curImgH) {
        computeScales(curImgW, curImgH);
        applyMode();
        layoutPosts();
        positionForMode();
      }
    }, 100);
  });
  var infoPopup = document.getElementById('info-popup');
  var infoCard  = document.getElementById('info-card');
  var POPUP_HOLD = 2000;
  function openPopup() {
    if (!infoPopup) return;
    infoPopup.classList.add('show');
  }
  function closePopup() {
    if (!infoPopup) return;
    infoPopup.classList.remove('show');
  }
  function isPopupOpen() {
    return infoPopup && infoPopup.classList.contains('show');
  }
  if (infoPopup) {
    infoPopup.addEventListener('click', function(e){ e.preventDefault(); closePopup(); });
    infoPopup.addEventListener('touchend', function(e){ e.preventDefault(); closePopup(); }, { passive: false });
    infoPopup.addEventListener('touchmove', function(e){ e.preventDefault(); closePopup(); }, { passive: false });
    infoPopup.addEventListener('wheel', function(e){ e.preventDefault(); closePopup(); }, { passive: false });
  }
  document.addEventListener('keydown', function(e){
    if (isPopupOpen() && (e.key === 'Escape' || e.key === 'Esc')) { closePopup(); }
  });
  if (logoHit) {
    logoHit.style.cursor = 'pointer';
    var logoHoldTimer = null;
    var logoHeld = false;
    function logoPressStart(e) {
      logoHeld = false;
      if (logoHoldTimer) clearTimeout(logoHoldTimer);
      logoHoldTimer = setTimeout(function(){
        logoHeld = true;
        openPopup();
      }, POPUP_HOLD);
    }
    function logoPressEnd(e) {
      if (logoHoldTimer) { clearTimeout(logoHoldTimer); logoHoldTimer = null; }
      if (logoHeld) { e.preventDefault(); return; }
    }
    logoHit.addEventListener('mousedown', logoPressStart);
    logoHit.addEventListener('mouseup', logoPressEnd);
    logoHit.addEventListener('mouseleave', function(){ if (logoHoldTimer){ clearTimeout(logoHoldTimer); logoHoldTimer=null; } });
    logoHit.addEventListener('touchstart', function(e){ logoPressStart(e); }, { passive: true });
    logoHit.addEventListener('touchend', function(e){
      if (logoHoldTimer) { clearTimeout(logoHoldTimer); logoHoldTimer = null; }
      if (logoHeld) { e.preventDefault(); e.stopPropagation(); return; }
      e.preventDefault(); e.stopPropagation();
      nextPost();
    }, { passive: false });
    logoHit.addEventListener('click', function(e) {
      e.preventDefault();
      if (logoHeld) { logoHeld = false; return; }
      nextPost();
    });
  }
  function onWheel(e) {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); return; }
    e.preventDefault();
    hideHint();
    var dx = e.deltaX, dy = e.deltaY;
    if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
    else if (e.deltaMode === 2) { dx *= window.innerWidth; dy *= window.innerHeight; }
    if (e.shiftKey && dx === 0) { dx = dy; dy = 0; }
    tx -= dx; ty -= dy;
    updateTransform();
  }
  window.addEventListener('wheel', onWheel, { passive: false, capture: true });
  var isDragging = false, didMove = false;
  var dragStartX = 0, dragStartY = 0, dragStartTx = 0, dragStartTy = 0;
  var velX = 0, velY = 0, lastDragX = 0, lastDragY = 0;
  var VEL_SMOOTH = 0.3;
  var momentumRAF = null;
  var holdTimer = null;
  var holding = false;
  var holdCancelled = false;
  function clearHold() {
    holdCancelled = true;
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holding) {
      holding = false;
      hideBefore();
    }
  }
  function stopMomentum() {
    if (momentumRAF) { cancelAnimationFrame(momentumRAF); momentumRAF = null; }
  }
  function startDrag(clientX, clientY, target) {
    if (target && target.closest && target.closest('button, input, textarea, video, audio, iframe, a')) return false;
    stopMomentum();
    isDragging = true; didMove = false;
    dragStartX = clientX; dragStartY = clientY;
    dragStartTx = tx; dragStartTy = ty;
    lastDragX = clientX; lastDragY = clientY;
    velX = 0; velY = 0;
    canvas.classList.add('dragging');
    hideHint();
    if (hasBefore) {
      holdCancelled = false;
      if (holdTimer) clearTimeout(holdTimer);
      holdTimer = setTimeout(function() {
        if (isDragging && !holdCancelled && hasBefore) {
          holding = true;
          showBefore();
        }
      }, HOLD_DELAY);
    }
    return true;
  }
  var HOLD_CANCEL_DIST = 28;
  function moveDrag(clientX, clientY) {
    if (!isDragging) return;
    var dx = clientX - dragStartX, dy = clientY - dragStartY;
    var dist = Math.abs(dx) > Math.abs(dy) ? Math.abs(dx) : Math.abs(dy);
    if (holding) {
      if (dist > HOLD_CANCEL_DIST) {
        didMove = true;
        clearHold();
        dragStartX = clientX; dragStartY = clientY;
        dragStartTx = tx; dragStartTy = ty;
        lastDragX = clientX; lastDragY = clientY;
      }
      return;
    }
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      didMove = true;
      if (dist > HOLD_CANCEL_DIST) clearHold();
    }
    var instVelX = clientX - lastDragX, instVelY = clientY - lastDragY;
    velX = velX + (instVelX - velX) * VEL_SMOOTH;
    velY = velY + (instVelY - velY) * VEL_SMOOTH;
    lastDragX = clientX; lastDragY = clientY;
    tx = dragStartTx + dx; ty = dragStartTy + dy;
    updateTransform();
  }
  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    canvas.classList.remove('dragging');
    clearHold();
    if (Math.abs(velX) > 0.5 || Math.abs(velY) > 0.5) startMomentum();
  }
  function startMomentum() {
    var friction = 0.93;
    function step() {
      velX *= friction; velY *= friction;
      var targetX = tx + velX, targetY = ty + velY;
      tx = targetX; ty = targetY;
      updateTransform();
      if (tx !== targetX) velX = 0;
      if (ty !== targetY) velY = 0;
      if (Math.abs(velX) < 0.1 && Math.abs(velY) < 0.1) { momentumRAF = null; return; }
      momentumRAF = requestAnimationFrame(step);
    }
    momentumRAF = requestAnimationFrame(step);
  }
  canvas.addEventListener('mousedown', function(e) { if (startDrag(e.clientX, e.clientY, e.target)) e.preventDefault(); });
  canvas.addEventListener('dragstart', function(e) { if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO')) e.preventDefault(); });
  window.addEventListener('mousemove', function(e) { if (isDragging) { e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('mouseleave', endDrag);
  document.addEventListener('dblclick', function(e) {
    e.preventDefault();
    if (holding) {
      clearHold();
      enterFit();
      return;
    }
    toggleMode();
  });
  var lastTapTime = 0;
  var lastTapX = 0, lastTapY = 0;
  document.addEventListener('touchstart', function(e) {
    if (!e.touches || e.touches.length !== 1) { lastTapTime = 0; return; }
    var t = e.touches[0];
    var now = Date.now();
    var dt = now - lastTapTime;
    var dx = Math.abs(t.clientX - lastTapX);
    var dy = Math.abs(t.clientY - lastTapY);
    if (dt > 0 && dt < 350 && dx < 40 && dy < 40) {
      e.preventDefault();
      if (holding) {
        clearHold();
        enterFit();
      } else {
        toggleMode();
      }
      lastTapTime = 0;
    } else {
      lastTapTime = now;
      lastTapX = t.clientX; lastTapY = t.clientY;
    }
  }, { passive: false });
  var pinching = false;
  var pinchStartDist = 0;
  function touchDist(t1, t2) {
    var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      pinching = false;
      var t = e.touches[0]; startDrag(t.clientX, t.clientY, e.target);
    } else if (e.touches.length === 2) {
      e.preventDefault();
      endDrag();
      pinching = true;
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    if (pinching && e.touches.length === 2) {
      e.preventDefault();
      var d = touchDist(e.touches[0], e.touches[1]);
      var ratio = d / (pinchStartDist || d);
      if (ratio > 1.18) { enterZoom(); pinching = false; }
      else if (ratio < 0.85) { enterFit(); pinching = false; }
      return;
    }
    if (e.touches.length === 1 && isDragging) {
      e.preventDefault(); var t = e.touches[0]; moveDrag(t.clientX, t.clientY);
    } else if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    if (e.touches.length === 0) { pinching = false; }
    endDrag();
  });
  canvas.addEventListener('touchcancel', function(){ pinching = false; endDrag(); });
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
  document.addEventListener('gestureend', function(e) { e.preventDefault(); });
  document.addEventListener('wheel', function(e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) { e.preventDefault(); return; }
    var step = 100;
    if (e.key === 'ArrowLeft')  { tx += step; updateTransform(); hideHint(); }
    if (e.key === 'ArrowRight') { tx -= step; updateTransform(); hideHint(); }
    if (e.key === 'ArrowUp')    { ty += step; updateTransform(); hideHint(); }
    if (e.key === 'ArrowDown')  { ty -= step; updateTransform(); hideHint(); }
  });
  canvas.addEventListener('click', function(e) {
    if (didMove) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  updateTransform();
})();
</script>
</body>
</html>
