<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hanalmchan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<style>
  @font-face{
    font-family:'LMCHan';
    src:url('fonts/LMCHan.woff2') format('woff2'),
        url('LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'),
        url('LMCHan.otf') format('opentype');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    color: #111111;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  /* Safari 26의 상단 바·하단 바 색 판정 전용 "미끼" 요소.
     화면 맨 위/아래 가장자리에 살짝 걸치는 얇은 띠를 만들어 둔다 —
     Safari 26+는 화면 위/아래 가장자리(위 4px, 아래 3px 이내)에 걸친
     position:fixed 요소 중 폭이 충분히 넓고(가로 80%+, 세로 3px+)
     배경색이 있는 것을 찾아 그 색으로 브라우저 UI를 물들이는데,
     body나 #canvas가 항상 이 조건을 만족한다는 보장이 없어(사진이
     화면을 다 못 덮는 경우, 아이패드의 넓은 창 등) 아예 이 조건에
     딱 맞는 전용 요소를 별도로 둔다. 화면 가장자리 너머로 살짝 밀어
     두어 실제로는 거의 보이지 않는다.
     참고: https://jahir.dev/blog/safari-toolbar */
  #tint-top, #tint-bottom {
    position: fixed;
    left: 0;
    width: 100%;
    min-height: 12px;
    z-index: 999;
    pointer-events: none;
  }
  /* -8px만큼 화면 밖으로 밀어내고 높이를 12px로 주면, 실제로 화면
     안쪽에 걸리는 부분은 4px뿐이다(12 - 8 = 4). 이 4px이 Safari가
     "가장자리에 있다"고 인정하는 데 필요한 최소한이면서 동시에 실제
     화면에서 가장 얇게 보이는 값 — 다른 개발자가 실기기로 직접
     하나씩 줄여 가며 찾아낸 수치라 마음대로 더 줄이면 다시 안 먹힐
     수 있다. */
  #tint-top { top: -8px; }
  #tint-bottom { bottom: -8px; }
  #canvas.dragging { cursor: grabbing; }
  #plane {
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 1px;
    will-change: transform;
    transform: translate3d(0, 0, 0) scale(0.2688);
    transform-origin: 0 0;
  }
  #hint {
    position: fixed;
    left: 20px;
    z-index: 100;
    pointer-events: none;
    mix-blend-mode: difference;
    transition: opacity 0.5s;
  }
  #hint.hidden { opacity: 0; }
  #hint-text {
    font-size: 10px;
    color: #ffffff;
    letter-spacing: 0.04em;
    line-height: 1.6;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  #hint-text.fade { opacity: 0 !important; }
  #nav {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    font-size: 12px; mix-blend-mode: difference; color: #ffffff;
  }
  #nav a { color: inherit; text-decoration: none; margin-left: 12px; }
  #nav a:hover { color: #888888; }
  #back-link, #order-link, #behind-link, #raw-link {
    position: fixed; z-index: 100;
    font-family: 'LMCHan', Georgia, serif;
    font-size: 22px; letter-spacing: 0.14em;
    color: #ffffff;
    -webkit-text-stroke: 0.7px currentColor;
    text-decoration: none;
    padding: 5px 10px;
    mix-blend-mode: difference;
    transition: opacity 0.3s ease;
  }
  #back-link { bottom: 20px; left: 20px; opacity: 0.9; }
  #order-link { bottom: 20px; right: 20px; opacity: 0.9; }
  #back-link:hover, #order-link:hover { opacity: 1; }
  /* 비하인드 영상 버튼: 그 사진에 영상이 있을 때만 오른쪽 위에 나타남 */
  #behind-link {
    top: 20px; right: 20px;
    text-transform: lowercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    text-transform: lowercase;
  }
  #behind-link.visible { opacity: 0.75; pointer-events: auto; }
  #behind-link.visible:hover { opacity: 1; }
  #behind-link.active { opacity: 1; }
  /* 원본(보정 전) 버튼: 그 사진에 원본이 있을 때만 왼쪽 위에 나타난다.
     확대 모드에서 로고와 겹치더라도 그대로 둔다. */
  #raw-link {
    top: 20px; left: 20px;
    text-transform: lowercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #raw-link.visible { opacity: 0.75; pointer-events: auto; }
  #raw-link.visible:hover { opacity: 1; }
  #raw-link.active { opacity: 1; }
  /* 다운로드 진행바: "unseen" 글자 폭에 맞춘 얇고 긴 막대.
     위치와 폭은 JS가 behind-link의 실제 좌표에서 계산해 넣는다.
     밝은 사진 위에서도 흰 채움이 또렷하게 보이도록 mix-blend-mode 대신
     어두운 바탕 막대 + 흰 채움 + 옅은 그림자 방식을 쓴다. */
  #behind-progress {
    position: fixed; z-index: 100;
    pointer-events: none;
    display: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #behind-progress.visible { opacity: 1; }
  #behind-progress .bar {
    height: 1px;
    background: rgba(0,0,0,0.30);
    overflow: hidden;
  }
  #behind-progress .bar > i {
    display: block; height: 100%; width: 0%;
    background: #ffffff;
    transition: width 0.09s linear;
  }
  #behind-progress .txt {
    margin-top: 7px;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.45);
    opacity: 0.4;
    text-align: right;
    white-space: nowrap;
  }
  .post { position: absolute; top: 0; left: 0; }
  .post img.photo {
    display: block;
    max-height: none;
    max-width: none;
    -webkit-user-drag: none;
    -khtml-user-drag: none;
    -moz-user-drag: none;
    -o-user-drag: none;
    user-drag: none;
    pointer-events: none;
    transition: filter 0.18s ease;
  }
  /* 비하인드 영상이 떠 있는 동안 뒤에 깔린 사진(원본 photo, before는 제외)만
     채도·명도를 아주 살짝 낮춘다 — 영상 자체는 건드리지 않고, "지금 앞에
     보이는 건 사진이 아니라 영상"이라는 인상을 은은하게 준다. 값을 너무
     세게 주면 티가 나서 튀므로 8~5% 선의 미세한 차이만 둔다. */
  .post.show-behind img.photo:not(.photo-before) {
    filter: saturate(0.92) brightness(0.95);
  }
  /* 원본(보정 전) 사진. "raw"를 누르면 보정본을 겹치는 게 아니라
     그 자리를 그대로 대신한다 — 페이드 없이 즉시 갈아끼워야 두 장을
     같은 조건에서 비교할 수 있다. */
  .post img.photo-before {
    position: absolute;
    top: 0; left: 0;
    display: none;
    z-index: 2;
  }
  .post.show-before img.photo-before { display: block; }
  /* 원본이 떠 있는 동안 보정본은 아예 감춘다(겹쳐 비치지 않도록). */
  .post.show-before img.photo:not(.photo-before) { visibility: hidden; }
  /* 비하인드 영상: "unseen" 버튼을 누르면 사진 위에 한 겹 더 뜬다.
     width/height/left/top은 실제 픽셀 값으로 JS가 계산해 넣는다(아래
     onMediaReady 참고) — 부모(.plane)의 확대/이동 transform 하나만 적용받고,
     영상 자신은 별도 transform을 쓰지 않는다. 드래그 중 부모 transform이
     계속 바뀌는 상황에서, 자식 영상에 또 다른 transform까지 겹쳐 있으면
     일부 모바일 브라우저가 재생 중인 영상을 리페인트 도중 멈추거나
     깜빡이게 만드는 문제가 있어 이렇게 우회한다. */
  .post video.photo-behind {
    position: absolute;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 3;
    pointer-events: none;
    /* 액자 느낌: 로고에서 뽑은 색으로 된 두꺼운 매트(65px) + 은은한 그림자로 마무리. */
    box-shadow:
      0 0 0 65px var(--behind-frame-color, rgba(255,255,255,0.85)),
      0 10px 34px rgba(0,0,0,0.35);
  }
  .post.show-behind video.photo-behind { opacity: 1; }
  /* 재생이 끝나면 그대로 정지 화면으로 멈춰 있다가, "unseen"을 다시
     누르면 이 클래스가 붙으면서 1초에 걸쳐 빠르게 사라진다. */
  .post video.photo-behind.fast-fade { transition: opacity 1s ease; }
  .post-photo a, .post-photoset a {
    display: block;
    cursor: inherit;
    pointer-events: none;
  }
  .photo-wrap {
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .post-text, .post-quote, .post-link {
    width: 625px;
    padding: 20px;
  }
  .caption {
    margin-top: 10px; font-size: 12px; color: #111111;
    max-width: 625px;
    padding: 10px; background: rgba(255,255,255,0.9);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 300; font-size: 12px; color: #888; letter-spacing: 0.1em;
    text-align: center; line-height: 2;
    animation: blink 1.2s ease-in-out infinite;
  }
  #info-popup {
    position: fixed; inset: 0; z-index: 400;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; transition: opacity 0.25s ease;
    padding: 24px;
  }
  #info-popup.show { display: flex; opacity: 1; }
  #info-card {
    position: relative;
    max-width: 420px; width: 100%;
    background: transparent;
    color: #ffffff;
    border-radius: 20px;
    border: none;
    padding: 30px 28px;
    box-shadow: 0 12px 50px rgba(0,0,0,0.30);
    font-size: 13px; line-height: 1.7;
    transform: translateY(8px); transition: transform 0.25s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  #info-card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 20px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    -webkit-mask:
      linear-gradient(#000 0 0),
      url('logo_mask.png') no-repeat right 22px bottom 20px / 45px 42px;
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0),
      url('logo_mask.png') no-repeat right 22px bottom 20px / 45px 42px;
    mask-composite: exclude;
    z-index: -1;
  }
  #info-popup.show #info-card { transform: translateY(0); }
  #info-card .info-lead { margin-bottom: 14px; color: #ffffff; }
  #info-card .info-lead:last-of-type { margin-bottom: 0; }
  #info-card .info-price { border-top: 1px solid rgba(255,255,255,0.22); margin-top: 18px; padding-top: 16px; }
  #info-card .info-price-row { display: flex; align-items: baseline; gap: 12px; margin: 8px 0; }
  #info-card .info-price-label { flex: 0 0 auto; font-weight: 600; color: #ffffff; min-width: 36px; }
  #info-card .info-price-val { color: rgba(255,255,255,0.92); letter-spacing: 0.02em; }
  #info-card .info-price-val em { font-style: normal; color: rgba(255,255,255,0.6); font-size: 11px; }
</style>
<script>
(function() {
  'use strict';
  // posts.json의 색 값은 "#ff9af0" 뿐 아니라 "144 145 233"(공백)이나
  // "144,145,233"(쉼표)처럼 RGB 숫자 세 개로 적어도 되게 한다.
  // CSS는 숫자 나열을 그대로 못 읽으므로 rgb(...) 형태로 바꿔 준다.
  // 이미 #hex나 rgb()/hsl() 형태면 손대지 않고 그대로 돌려준다.
  function toCssColor(v) {
    if (typeof v !== 'string') return v;
    var s = v.trim();
    if (!s) return s;
    if (s.charAt(0) === '#' || /^(rgb|hsl)/i.test(s)) return s;
    var n = s.split(/[\s,]+/).map(Number).filter(function(x){ return isFinite(x); });
    if (n.length >= 3) return 'rgb(' + n[0] + ',' + n[1] + ',' + n[2] + ')';
    return s;
  }
  // ─── iOS 26 Safari 상단 바 색: "첫 로드"에 한해서만 맞춘다 ───────────
  // iOS 26의 Safari는 theme-color 메타 태그를 더 이상 읽지 않고, 대신
  // 첫 화면이 그려지는 그 순간의 <body> 배경색을 상단 바 색으로 그대로
  // 가져다 쓴다. 그 순간 이후 자바스크립트로 배경을 바꿔도 반영되지
  // 않으므로, 사진을 넘길 때마다 실시간으로 맞추는 것은 이 플랫폼에서는
  // 불가능하다 — 대신 주소(#해시)로 곧장 열린 "첫 사진" 한 장만큼은
  // 맞출 수 있다. 이걸 하려면 화면이 그려지기도 전에 색이 정해져 있어야
  // 하는데, 캔버스로 사진을 내려받아 재는 방식은 네트워크를 타는 만큼
  // 이미 "그려진 뒤"라 너무 늦다. 그래서 posts.json에 미리 적어 둔
  // "topColor" 값을 화면이 그려지기 전에 동기(sync) 방식으로 읽어 온다.
  // (posts.json 예시: { "file": "IMG_9317.jpg", "topColor": "#5a6640" })
  try {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, '')).split('?')[0].toLowerCase();
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'posts.json', false);  // false = 의도적인 동기 요청
    xhr.send(null);
    if (xhr.status >= 200 && xhr.status < 300) {
      var posts = JSON.parse(xhr.responseText) || [];
      var post = null;
      var im = h.match(/^i=(\d+)$/);
      if (im) {
        post = posts[parseInt(im[1], 10)];
      } else if (h) {
        for (var i = 0; i < posts.length; i++) {
          var f = String(posts[i].file || '').toLowerCase();
          if (f === h || f.replace(/\.[^.]+$/, '') === h) { post = posts[i]; break; }
        }
      }
      if (!post) post = posts[0];
      if (post && post.topColor) {
        // 뒤이어 나올 본문 <style>의 흰 배경보다 나중에, 반드시 이 값이
        // 이기도록 !important를 붙인다. body가 아직 파싱되기 전이므로
        // 여기서 그려 넣는 <style>이 첫 페인트 시점의 배경으로 인정된다.
        // html,body뿐 아니라 #canvas·#plane도 같은 색으로 미리 선언해 둔다.
        // 확대(zoom) 모드에서는 사진이 화면보다 훨씬 커서 body가 어차피
        // 안 보이는데도 상단 바가 검게 나오는 경우가 있었다 — Safari가
        // "화면 맨 위 언저리에 고정된 요소"를 고를 때 body가 아니라
        // #canvas(고정 위치, 화면 전체를 덮음)를 대신 참고했을 가능성이
        // 있고, #canvas엔 배경색이 없어(투명) 검정으로 보였을 수 있다.
        // 정확한 내부 판정 기준은 애플이 공개하지 않았으므로, 셋 다에
        // 같은 색을 걸어 두어 어느 쪽을 고르든 결과가 같게 만든다.
        // html,body,#canvas,#plane뿐 아니라 위에서 새로 만든 전용 미끼
        // 요소(#tint-top, #tint-bottom)에도 같은 색을 걸어 둔다. 이 둘은
        // Safari 26이 문서화한 조건(가장자리 4px/3px 이내, 폭 80%+,
        // 높이 3px+)에 정확히 맞춰 만들었으므로, body나 #canvas가 어떤
        // 이유로든 조건을 못 채우는 경우에도 이 요소들이 대신 채택된다.
        document.write('<style>html,body,#canvas,#plane,#tint-top,#tint-bottom{background:' +
                        toCssColor(post.topColor) + ' !important;}</style>');
      }
    }
  } catch (err) {
    /* posts.json을 못 읽었거나 topColor가 없으면 기본 흰 배경 그대로 둔다 */
  }
})();
</script>
</head>
<body>
<div id="tint-top"></div>
<div id="tint-bottom"></div>
<div id="hint"><div id="hint-text"></div></div>
<div id="nav"></div>
<a id="back-link" href="index.html?from=ig">AWAY</a>
<a id="order-link" href="pay.html">yours</a>
<a id="behind-link" href="#" role="button">unseen</a>
<a id="raw-link" href="#" role="button">raw</a>
<div id="behind-progress">
  <div class="bar"><i></i></div>
  <div class="txt">불러오는 중...<br>loading...<br>読み込み中...</div>
</div>
<div id="loading">불러오는 중...<br>loading...<br>読み込み中...</div>
<div id="canvas">
  <div id="plane"></div>
</div>
<div id="logo-hit" style="position:fixed; z-index:90; display:none; cursor:pointer;"></div>
<div id="info-popup">
  <div id="info-card">
    <p class="info-lead">아름다움 한 아름. 인연이 닿아 현 삶의 단계의 모습을 기록으로 남기게 되어 영광입니다.</p>
    <p class="info-lead">사진 제공은 업로드 허용을 조건으로 하며, 보정본 1장, 그리고 전체 압축본을 기본으로 제공해 드립니다.</p>
    <div class="info-price">
      <div class="info-price-row">
        <span class="info-price-label">원본</span>

      st.loaded = st.total;
      st.done = true;
      // 다운로드가 끝나는 즉시(= 사용자가 "unseen"을 누르기 전이라도)
      // video에 blob을 미리 물려 브라우저가 메타데이터를 먼저 해석해
      // 두게 한다. 이걸 재생 버튼을 누른 뒤로 미루면, 진행바가 100%를
      // 찍고도 그때부터 video.load()의 해석 시간이 새로 붙어 한 번 더
      // "로딩"처럼 느껴진다 — 다운로드가 끝난 시점에 미리 끝내 둔다.
      if (behindDL === st) attachBehindSource();
    }
  }
  // 진행률. Content-Length가 없으면 받은 양으로 어림잡아 보여 준다.
  function behindDownloadFraction() {
    if (!behindDL) return 0;
    if (behindDL.done) return 1;
    if (behindDL.total > 0) return Math.min(0.999, behindDL.loaded / behindDL.total);
    if (behindDL.loaded > 0) return Math.min(0.9, behindDL.loaded / (behindDL.loaded + 3000000));
    return 0;
  }
  // "다운로드가 끝남"과 "끊김 없이 재생할 준비가 됨"은 서로 다른 순간이다.
  // blob 전체가 메모리에 있어도 브라우저가 그걸 디코딩해 재생 가능한
  // readyState까지 만드는 데는 별도 시간이 걸릴 수 있어 둘 다 확인한다.
  // readyState 4 = HAVE_ENOUGH_DATA(끝까지 끊김 없이 재생 가능하다고 판단됨)
  function behindReady() {
    return !!(behindDL && behindDL.done &&
              behindVideoEl && behindVideoEl.readyState >= 4);
  }
  // 다 받아진 blob을 video에 물린다(이미 물려 있으면 아무 것도 하지 않음).
  function attachBehindSource() {
    if (!behindVideoEl || !behindDL) return;
    var wanted = behindDL.done && behindDL.blobUrl ? behindDL.blobUrl : behindDL.url;
    if (behindVideoEl.src !== wanted) {
      behindVideoEl.src = wanted;
      try { behindVideoEl.load(); } catch (err) {}
    }
  }
  function showBehindProgress() {
    if (!behindProgress) return;
    positionBehindProgress();
    behindProgress.style.display = 'block';
    requestAnimationFrame(function(){ behindProgress.classList.add('visible'); });
  }
  function hideBehindProgress() {
    if (!behindProgress) return;
    behindProgress.classList.remove('visible');
    setTimeout(function(){
      if (behindProgress && !behindProgress.classList.contains('visible')) {
        behindProgress.style.display = 'none';
      }
    }, 260);
  }
  function stopBufferWait() {
    waitingForBuffer = false;
    if (bufferPollTimer) { clearInterval(bufferPollTimer); bufferPollTimer = null; }
    hideBehindProgress();
  }
  function startBufferWait() {
    if (!behindVideoEl) return;
    waitingForBuffer = true;
    if (behindProgressFill) behindProgressFill.style.width = '0%';
    showBehindProgress();
    // 화면에 보이는 눈금(shown)은 실제 진행률(target)을 향해 따라간다.
    // 이미 다 받아진 상태라도 0에서부터 차오르는 모습이 보이도록 상한 속도를
    // 두어, 최소 0.5초 정도는 채워지는 과정이 눈에 남게 한다.
    var shown = 0;
    var STEP = 0.08; // 한 틱(40ms)에 최대 8% — 0→100%에 최소 0.5초
    function tick() {
      if (!behindVideoEl || !waitingForBuffer) { stopBufferWait(); return; }
      // fetch가 막힌 경우(CORS 등): 바이트 진행률을 알 수 없으니
      // readyState(디코딩 준비)만으로 재생 시점을 판단한다.
      if (behindDL && behindDL.failed) {
        attachBehindSource();
        var readyF = behindVideoEl.readyState >= 4;
        var targetF = readyF ? 1 : 0.97;
        if (shown < targetF) shown = Math.min(targetF, shown + STEP);
        if (behindProgressFill) behindProgressFill.style.width = (shown * 100).toFixed(1) + '%';
        if (shown >= 0.97 && readyF) {
          if (behindProgressFill) behindProgressFill.style.width = '100%';
          waitingForBuffer = false;
          if (bufferPollTimer) { clearInterval(bufferPollTimer); bufferPollTimer = null; }
          setTimeout(function(){ hideBehindProgress(); showBehind(); }, 150);
        }
        return;
      }
      // 바이트를 다 받았으면 즉시 blob을 video에 물려 디코딩을 시작해 둔다.
      if (behindDownloadFraction() >= 0.999) attachBehindSource();
      // "다운로드 완료"와 "끊김 없이 재생 가능"은 다른 순간이다 — 후자가
      // 확인되기(behindReady()) 전까지는 막대를 100%까지 채우지 않는다.
      var target = behindReady() ? 1 : Math.min(0.97, behindDownloadFraction());
      if (shown < target) shown = Math.min(target, shown + STEP);
      if (behindProgressFill) behindProgressFill.style.width = (shown * 100).toFixed(1) + '%';
      if (shown >= 0.97 && behindReady()) {
        if (behindProgressFill) behindProgressFill.style.width = '100%';
        waitingForBuffer = false;
        if (bufferPollTimer) { clearInterval(bufferPollTimer); bufferPollTimer = null; }
        // 다 찬 막대를 잠깐 보여 준 뒤 재생으로 넘어간다.
        setTimeout(function(){ hideBehindProgress(); showBehind(); }, 180);
      }
    }
    if (bufferPollTimer) clearInterval(bufferPollTimer);
    tick();
    bufferPollTimer = setInterval(tick, 40);
  }
  function showBehind() {
    if (!hasBehind || !currentPostEl) return;
    if (fastFadeTimer) { clearTimeout(fastFadeTimer); fastFadeTimer = null; }
    if (behindVideoEl) behindVideoEl.classList.remove('fast-fade');
    behindFrozen = false;
    behindFastFading = false;
    currentPostEl.classList.add('show-behind');
    if (behindLink) behindLink.classList.add('active');
    // 영상이 로고를 덮으므로 힌트를 로고 아래가 아닌 화면 위쪽으로 옮긴다.
    positionHint();
    if (behindVideoEl) {
      try { behindVideoEl.currentTime = 0; } catch (err) {}
      var p = behindVideoEl.play();
      if (p && p.catch) p.catch(function(){ /* 자동재생 실패 시 조용히 무시 */ });
    }
  }
  function hideBehind() {
    stopBufferWait();
    if (fastFadeTimer) { clearTimeout(fastFadeTimer); fastFadeTimer = null; }
    if (behindVideoEl) behindVideoEl.classList.remove('fast-fade');
    behindFrozen = false;
    behindFastFading = false;
    if (currentPostEl) currentPostEl.classList.remove('show-behind');
    if (behindLink) behindLink.classList.remove('active');
    // 영상이 꺼지면 로고가 다시 보이므로 힌트도 원래 자리로 돌아간다.
    positionHint();
    if (behindVideoEl) behindVideoEl.pause();
  }
  // 재생이 자연스럽게 끝났을 때: 사라지지 않고 마지막 프레임에 그대로
  // 멈춘다(브라우저가 알아서 그렇게 둔다 — 여기선 "대기 중" 표시만 켠다).
  // 이 상태는 오직 "unseen"을 다시 눌렀을 때만 풀리며, 그때
  // hideBehindFast()가 1초에 걸쳐 부드럽게 지운다. 화면을 드래그하거나
  // 아무 곳이나 클릭·탭해도 영상은 그대로 남아 있는다.
  function freezeBehind() {
    if (!hasBehind) return;
    behindFrozen = true;
  }
  function hideBehindFast() {
    if (!behindFrozen || behindFastFading) return;
    behindFrozen = false;
    behindFastFading = true;
    if (!currentPostEl || !behindVideoEl) { hideBehind(); return; }
    var v = behindVideoEl;
    v.classList.add('fast-fade');
    currentPostEl.classList.remove('show-behind');
    if (behindLink) behindLink.classList.remove('active');
    positionHint();
    if (fastFadeTimer) clearTimeout(fastFadeTimer);
    fastFadeTimer = setTimeout(function() {
      fastFadeTimer = null;
      behindFastFading = false;
      try { v.pause(); } catch (err) {}
      v.classList.remove('fast-fade');
    }, 1100);
  }
  // "unseen" 버튼: 누르면 (다 받아진 뒤) 재생하고, 다시 누르면 끈다.
  // 아직 받는 중이라면 진행바가 뜨고, 그 상태에서 다시 누르면 대기를 취소한다.
  // 재생이 끝나 멈춰 있는 상태(behindFrozen)에서 다시 누르면 1초에 걸쳐
  // 부드럽게 사라지고, 재생 도중에 누르면 예전처럼 즉시 꺼진다.
  function toggleBehindManual() {
    if (!hasBehind) return;
    if (waitingForBuffer) { stopBufferWait(); return; }
    if (currentPostEl && currentPostEl.classList.contains('show-behind')) {
      if (behindFrozen) hideBehindFast(); else hideBehind();
      return;
    }
    // 이미 다 받아져 있어도 진행바가 차오르는 과정을 짧게 보여 준다.
    startBufferWait();
  }
  if (behindLink) {
    // 터치 기기에서는 touchend가 처리한 뒤 브라우저가 뒤이어 합성 click을
    // 또 보낼 수 있어서, 그대로 두면 "켜짐→꺼짐"이 한 번의 탭 안에서
    // 연속으로 일어나 버린다. 짧은 시간 동안 click을 무시해 중복을 막는다.
    var behindTouchHandled = false;
    behindLink.addEventListener('touchend', function(e){
      e.preventDefault(); e.stopPropagation();
      behindTouchHandled = true;
      toggleBehindManual();
      setTimeout(function(){ behindTouchHandled = false; }, 500);
    }, { passive: false });
    behindLink.addEventListener('click', function(e){
      e.preventDefault();
      if (behindTouchHandled) return;
      toggleBehindManual();
    });
  }
  fetch('posts.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(posts) { renderPosts(posts); })
    .catch(function() {
      if (loadingEl) loadingEl.textContent = '포스트를 불러올 수 없어요.';
    });
  var resizeTimer = null;
  window.addEventListener('resize', function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (curImgW && curImgH) {
        computeScales(curImgW, curImgH);
        applyMode();
        layoutPosts();
        positionForMode();
      }
    }, 100);
  });
  var infoPopup = document.getElementById('info-popup');
  var infoCard  = document.getElementById('info-card');
  var POPUP_HOLD = 2000;
  function openPopup() {
    if (!infoPopup) return;
    infoPopup.classList.add('show');
  }
  function closePopup() {
    if (!infoPopup) return;
    infoPopup.classList.remove('show');
  }
  function isPopupOpen() {
    return infoPopup && infoPopup.classList.contains('show');
  }
  if (infoPopup) {
    infoPopup.addEventListener('click', function(e){ e.preventDefault(); closePopup(); });
    infoPopup.addEventListener('touchend', function(e){ e.preventDefault(); closePopup(); }, { passive: false });
    infoPopup.addEventListener('touchmove', function(e){ e.preventDefault(); closePopup(); }, { passive: false });
    infoPopup.addEventListener('wheel', function(e){ e.preventDefault(); closePopup(); }, { passive: false });
  }
  document.addEventListener('keydown', function(e){
    if (isPopupOpen() && (e.key === 'Escape' || e.key === 'Esc')) { closePopup(); }
  });
  if (logoHit) {
    logoHit.style.cursor = 'pointer';
    var logoHoldTimer = null;
    var logoHeld = false;
    function logoPressStart(e) {
      logoHeld = false;
      if (logoHoldTimer) clearTimeout(logoHoldTimer);
      logoHoldTimer = setTimeout(function(){
        logoHeld = true;
        openPopup();
      }, POPUP_HOLD);
    }
    function logoPressEnd(e) {
      if (logoHoldTimer) { clearTimeout(logoHoldTimer); logoHoldTimer = null; }
      if (logoHeld) { e.preventDefault(); return; }
    }
    // 비하인드 영상("unseen")이 떠 있는 동안에는 로고를 눌러도 다음 사진으로
    // 넘어가지 않게 막는다 — 영상을 보는 도중 실수로 넘어가는 것 방지.
    // 재생이 끝나 멈춰 있는 상태에서도 마찬가지로 아무 일도 하지 않는다.
    // 영상을 지우려면 "unseen"을 다시 눌러야 한다.
    // 판정은 위쪽의 공용 isBehindShowing()을 그대로 쓴다.
    logoHit.addEventListener('mousedown', logoPressStart);
    logoHit.addEventListener('mouseup', logoPressEnd);
    logoHit.addEventListener('mouseleave', function(){ if (logoHoldTimer){ clearTimeout(logoHoldTimer); logoHoldTimer=null; } });
    logoHit.addEventListener('touchstart', function(e){ logoPressStart(e); }, { passive: true });
    logoHit.addEventListener('touchend', function(e){
      if (logoHoldTimer) { clearTimeout(logoHoldTimer); logoHoldTimer = null; }
      if (logoHeld) { e.preventDefault(); e.stopPropagation(); return; }
      e.preventDefault(); e.stopPropagation();
      if (isBehindShowing()) return;
      nextPost();
    }, { passive: false });
    logoHit.addEventListener('click', function(e) {
      e.preventDefault();
      if (logoHeld) { logoHeld = false; return; }
      if (isBehindShowing()) return;
      nextPost();
    });
  }
  function onWheel(e) {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); return; }
    e.preventDefault();
    hideHint();
    var dx = e.deltaX, dy = e.deltaY;
    if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
    else if (e.deltaMode === 2) { dx *= window.innerWidth; dy *= window.innerHeight; }
    if (e.shiftKey && dx === 0) { dx = dy; dy = 0; }
    tx -= dx; ty -= dy;
    updateTransform();
  }
  window.addEventListener('wheel', onWheel, { passive: false, capture: true });
  var isDragging = false, didMove = false;
  var dragStartX = 0, dragStartY = 0, dragStartTx = 0, dragStartTy = 0;
  var velX = 0, velY = 0, lastDragX = 0, lastDragY = 0;
  var VEL_SMOOTH = 0.3;
  var momentumRAF = null;
  function stopMomentum() {
    if (momentumRAF) { cancelAnimationFrame(momentumRAF); momentumRAF = null; }
  }
  function startDrag(clientX, clientY, target) {
    // didMove는 "이번 누르기가 움직였는가"를 나타내므로, 아래 가드로
    // 드래그 자체를 시작 안 하는 경우(예: 정지된 video 위를 눌렀을 때)
    // 에도 새 누르기가 시작된 이상 항상 새로 초기화해야 한다.
    didMove = false;
    if (target && target.closest && target.closest('button, input, textarea, video, audio, iframe, a')) return false;
    stopMomentum();
    isDragging = true;
    dragStartX = clientX; dragStartY = clientY;
    dragStartTx = tx; dragStartTy = ty;
    lastDragX = clientX; lastDragY = clientY;
    velX = 0; velY = 0;
    canvas.classList.add('dragging');
    hideHint();
    return true;
  }
  function moveDrag(clientX, clientY) {
    if (!isDragging) return;
    var dx = clientX - dragStartX, dy = clientY - dragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didMove = true;
    var instVelX = clientX - lastDragX, instVelY = clientY - lastDragY;
    velX = velX + (instVelX - velX) * VEL_SMOOTH;
    velY = velY + (instVelY - velY) * VEL_SMOOTH;
    lastDragX = clientX; lastDragY = clientY;
    tx = dragStartTx + dx; ty = dragStartTy + dy;
    updateTransform();
  }
  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    canvas.classList.remove('dragging');
    if (Math.abs(velX) > 0.5 || Math.abs(velY) > 0.5) startMomentum();
  }
  function startMomentum() {
    var friction = 0.93;
    function step() {
      velX *= friction; velY *= friction;
      var targetX = tx + velX, targetY = ty + velY;
      tx = targetX; ty = targetY;
      updateTransform();
      if (tx !== targetX) velX = 0;
      if (ty !== targetY) velY = 0;
      if (Math.abs(velX) < 0.1 && Math.abs(velY) < 0.1) { momentumRAF = null; return; }
      momentumRAF = requestAnimationFrame(step);
    }
    momentumRAF = requestAnimationFrame(step);
  }
  canvas.addEventListener('mousedown', function(e) { if (startDrag(e.clientX, e.clientY, e.target)) e.preventDefault(); });
  canvas.addEventListener('dragstart', function(e) { if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO')) e.preventDefault(); });
  window.addEventListener('mousemove', function(e) { if (isDragging) { e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('mouseleave', endDrag);
  document.addEventListener('dblclick', function(e) {
    e.preventDefault();
    toggleMode(e.clientX, e.clientY);
  });
  var lastTapTime = 0;
  var lastTapX = 0, lastTapY = 0;
  document.addEventListener('touchstart', function(e) {
    if (!e.touches || e.touches.length !== 1) { lastTapTime = 0; return; }
    var t = e.touches[0];
    var now = Date.now();
    var dt = now - lastTapTime;
    var dx = Math.abs(t.clientX - lastTapX);
    var dy = Math.abs(t.clientY - lastTapY);
    if (dt > 0 && dt < 350 && dx < 40 && dy < 40) {
      e.preventDefault();
      toggleMode(t.clientX, t.clientY);
      lastTapTime = 0;
    } else {
      lastTapTime = now;
      lastTapX = t.clientX; lastTapY = t.clientY;
    }
  }, { passive: false });
  var pinching = false;
  var pinchStartDist = 0;
  function touchDist(t1, t2) {
    var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      pinching = false;
      var t = e.touches[0]; startDrag(t.clientX, t.clientY, e.target);
    } else if (e.touches.length === 2) {
      e.preventDefault();
      endDrag();
      pinching = true;
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    if (pinching && e.touches.length === 2) {
      e.preventDefault();
      var d = touchDist(e.touches[0], e.touches[1]);
      var ratio = d / (pinchStartDist || d);
      if (ratio > 1.18) {
        // 두 손가락의 중간 지점을 확대의 기준점으로 삼는다.
        var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        enterZoom(midX, midY);
        pinching = false;
      }
      else if (ratio < 0.85) { enterFit(); pinching = false; }
      return;
    }
    if (e.touches.length === 1 && isDragging) {
      e.preventDefault(); var t = e.touches[0]; moveDrag(t.clientX, t.clientY);
    } else if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    if (e.touches.length === 0) { pinching = false; }
    endDrag();
  });
  canvas.addEventListener('touchcancel', function(){ pinching = false; endDrag(); });
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
  document.addEventListener('gestureend', function(e) { e.preventDefault(); });
  document.addEventListener('wheel', function(e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) { e.preventDefault(); return; }
    var step = 100;
    if (e.key === 'ArrowLeft')  { tx += step; updateTransform(); hideHint(); }
    if (e.key === 'ArrowRight') { tx -= step; updateTransform(); hideHint(); }
    if (e.key === 'ArrowUp')    { ty += step; updateTransform(); hideHint(); }
    if (e.key === 'ArrowDown')  { ty -= step; updateTransform(); hideHint(); }
  });
  canvas.addEventListener('click', function(e) {
    // 드래그로 화면을 옮긴 직후의 클릭은 무시한다.
    // (영상이 멈춰 있어도 여기서는 아무 일도 하지 않는다 — 영상을 지우는 건
    //  오직 "unseen" 버튼뿐이다.)
    if (didMove) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  updateTransform();
})();
</script>
