<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hanalmchan — 서가</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

<style>
  :root{
    --paper:#ffffff;
    --ink:#111111;

    --spine:#141310;
    --shadow:rgba(15,13,10,.24);

    --shelf-y:64%;
    --book-left:66%;
    --spine-w:clamp(58px,8vw,92px);
    --spine-h:clamp(220px,40vh,360px);
    --tilt:7deg;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%; overflow:hidden;
    background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }

  #scene{ position:fixed; inset:0; overflow:hidden; }

  #shelf-line{
    position:absolute; left:0; right:0; top:var(--shelf-y); height:1px;
    background:rgba(17,17,17,.18); pointer-events:none;
  }

  .book-shadow{
    position:absolute; top:var(--shelf-y); left:var(--book-left);
    width:calc(var(--spine-w) * 2.1); height:16px;
    transform:translate(-50%,-50%);
    border-radius:50%; opacity:.5;
    background:radial-gradient(closest-side, var(--shadow), rgba(0,0,0,0) 72%);
    pointer-events:none; will-change:transform,opacity;
  }
  #scene:has(.book:hover) .book-shadow,
  #scene:has(.book:focus-visible) .book-shadow{
    transform:translate(-50%,-50%) scale(1.06,.82);
    opacity:.36;
  }

  .book{
    position:absolute; top:var(--shelf-y); left:var(--book-left);
    width:var(--spine-w); height:var(--spine-h);
    transform:translate(-50%,-100%) rotate(var(--tilt));
    transform-origin:bottom center;
    background:none; border:0; padding:0; -webkit-appearance:none; appearance:none;
    cursor:grab; touch-action:none; -webkit-tap-highlight-color:transparent;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    animation:idleSway 7s ease-in-out infinite;
  }
  .book:hover, .book:focus-visible{
    transform:translate(-50%, calc(-100% - 8px)) rotate(calc(var(--tilt) - 3deg));
  }
  .book:focus-visible{ outline:2px solid var(--ink); outline-offset:10px; }
  .book:hover, .book:focus-visible, .book.dragging, .book.settling, .book.opening{
    animation-play-state:paused;
  }
  .book.dragging{ transition:none; cursor:grabbing; }
  .book.settling{ transition:transform .55s cubic-bezier(.34,1.56,.64,1); }
  .book.opening{ transition:transform .55s cubic-bezier(.16,1,.3,1); }

  @keyframes idleSway{
    0%,100%{ transform:translate(-50%,-100%) rotate(var(--tilt)); }
    50%{ transform:translate(-50%,-100%) rotate(calc(var(--tilt) - .6deg)); }
  }

  .spine{
    position:relative; display:block; width:100%; height:100%;
    overflow:hidden;
    background:var(--spine);
    box-shadow:0 16px 28px -12px var(--shadow);
  }

  .spine-mark{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-90deg);
  }
  .spine-mark-photo{
    display:block; overflow:hidden; background-repeat:no-repeat;
    opacity:0; transition:opacity .6s ease;
  }
  .spine-mark-photo.is-ready{ opacity:1; }

  #hint{ position:fixed; left:20px; bottom:22px; z-index:50; mix-blend-mode:difference; pointer-events:none; transition:opacity .5s; }
  #hint-text{ font-size:10px; color:#fff; letter-spacing:.04em; line-height:1.6; white-space:nowrap; }

  #veil{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:200; transition:opacity .38s ease; }
  #veil.show{ opacity:1; }

  @media (prefers-reduced-motion:reduce){
    .book{ animation:none; }
    .book, .book.settling, .book.opening{ transition-duration:.15s; }
  }
</style>
</head>
<body>

  <div id="hint"><div id="hint-text"></div></div>

  <div id="scene">
    <div id="shelf-line"></div>
    <div class="book-shadow" aria-hidden="true"></div>

    <button class="book" id="book" type="button" aria-label="hanalmchan — 당겨서 열기">
      <span class="spine">
        <span class="spine-mark">
          <span class="spine-mark-photo" id="spine-mark-photo"></span>
        </span>
      </span>
    </button>
  </div>

  <div id="veil"></div>

<script>
(function(){
  'use strict';

  // ====== 설정: 실제 배포 시 이 값만 맞춰주면 됩니다 ======
  var NEXT_URL   = 'hanalmchan.html'; // 이 책을 열었을 때 이동할 갤러리 페이지
  var R2_BASE    = 'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev'; // 갤러리 페이지와 동일
  var POSTS_JSON = 'posts.json';
  var LOGO_W_RATIO  = 0.0936;      // 로고 너비 / 사진 너비 — 갤러리 페이지와 동일한 값
  var LOGO_HW_RATIO = 801 / 1429;  // 로고 높이 / 로고 너비
  // ===========================================================

  var book       = document.getElementById('book');
  var spineEl    = document.querySelector('.spine');
  var shadowEl   = document.querySelector('.book-shadow');
  var veil       = document.getElementById('veil');
  var hint       = document.getElementById('hint');
  var hintText   = document.getElementById('hint-text');
  var markEl     = document.getElementById('spine-mark-photo');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 책등 로고: posts.json에서 가장 최신(맨 위) 사진을 찾아, 그 안에 이미 합성된
  //      로고 반전 효과 부분만 좌표(logoX, logoY)와 비율로 계산해서 크롭해 보여줌.
  //      별도 로고 파일이 필요 없음 — 갤러리에 새 사진이 올라가면 책등도 그걸 따라감. ----
  function buildImageUrl(filename){
    return R2_BASE + '/' + encodeURIComponent(filename);
  }

  var loadedLogo = null; // { imgW, imgH, src, logoX, logoY } — 리사이즈 시 재사용

  function paintMark(){
    if (!loadedLogo || !markEl || !spineEl) return;
    // offsetWidth/Height는 상위(.book)의 rotate() 변형에 영향받지 않는 실제 스파인 크기
    var spineW = spineEl.offsetWidth || 80, spineH = spineEl.offsetHeight || 300;

    // 회전 후 로고가 책등 폭을 넘지 않도록, 스파인 크기에 맞춰 표시 너비를 계산
    var markW = Math.min((spineW * 0.62) / LOGO_HW_RATIO, spineH * 0.5);
    var logoW = loadedLogo.imgW * LOGO_W_RATIO;
    var scale = markW / logoW;

    markEl.style.width  = markW + 'px';
    markEl.style.height = (logoW * LOGO_HW_RATIO * scale) + 'px';
    markEl.style.backgroundImage    = 'url(' + loadedLogo.src + ')';
    markEl.style.backgroundSize     = (loadedLogo.imgW * scale) + 'px ' + (loadedLogo.imgH * scale) + 'px';
    markEl.style.backgroundPosition = (-loadedLogo.logoX * scale) + 'px ' + (-loadedLogo.logoY * scale) + 'px';
    markEl.classList.add('is-ready');
  }

  fetch(POSTS_JSON + '?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(posts){
      var latest = (posts || []).find(function(p){
        return p && (p.file || p.url) &&
          typeof p.logoX === 'number' && typeof p.logoY === 'number';
      });
      if (!latest || !markEl) return;

      var src = latest.file ? buildImageUrl(latest.file) : latest.url;
      var probe = new Image();
      probe.onload = function(){
        if (!probe.naturalWidth || !probe.naturalHeight) return;
        loadedLogo = {
          imgW: probe.naturalWidth, imgH: probe.naturalHeight,
          src: src, logoX: latest.logoX, logoY: latest.logoY
        };
        paintMark();
      };
      probe.onerror = function(){ /* 사진을 못 불러오면 책등은 비워둠 */ };
      probe.src = src;
    })
    .catch(function(){ /* posts.json이 아직 없으면 책등은 비워둠 */ });

  var markResizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(markResizeTimer);
    markResizeTimer = setTimeout(paintMark, 120);
  });

  // ---- 안내문구 ----
  hintText.innerHTML =
    '당겨서 꺼내기 · 또는 클릭해서 열기<br>' +
    'Drag to pull it out · or click to open<br>' +
    '引いて取り出す · またはクリックで開く';

  var hideTimer = setTimeout(function(){ hint.style.opacity = '0'; }, 6000);
  function wakeHint(){
    clearTimeout(hideTimer);
    hint.style.opacity = '1';
    hideTimer = setTimeout(function(){ hint.style.opacity = '0'; }, 4000);
  }

  // ---- 드래그로 책 꺼내기 ----
  var TILT_DEG   = 7;
  var OPEN_PX    = 90;   // 이만큼 위로 당기면 완전히 빠져나옴
  var TAP_PX     = 8;    // 이보다 적게 움직이면 '클릭'으로 간주

  var dragging = false;
  var activePointerId = null;
  var startX = 0, startY = 0;
  var maxMove = 0;
  var currentDy = 0;
  var opened = false;
  var suppressNextClick = false; // 포인터 제스처가 이미 처리한 뒤 이어지는 합성 click 무시용

  function setShadow(dy){
    var lift = Math.max(0, dy);
    var t = Math.min(lift / 140, 1);
    var scaleX = 1 + t * 0.15;
    var scaleY = 1 - t * 0.55;
    var ty = Math.min(lift * 0.22, 16);
    var opacity = 0.6 - t * 0.42;
    shadowEl.style.transform = 'translate(-50%, calc(-50% + ' + ty + 'px)) scale(' + scaleX + ',' + scaleY + ')';
    shadowEl.style.opacity = String(Math.max(0.12, opacity));
  }

  function applyDrag(dy, dx){
    var clampedDy = Math.max(-14, Math.min(dy, 220));
    var lift = Math.max(0, clampedDy) * 0.92;
    var tiltProgress = Math.min(Math.max(clampedDy, 0), 150) / 150;
    var tilt = TILT_DEG - tiltProgress * (TILT_DEG + 2.5);
    if (clampedDy < 0) tilt = TILT_DEG - clampedDy * 0.12; // 살짝 눌렀을 때 미세한 저항감
    var scale = 1 + Math.min(Math.max(clampedDy, 0), 220) * 0.0007;
    var sway = Math.max(-6, Math.min(dx * 0.06, 6));
    book.style.transform =
      'translate(calc(-50% + ' + sway + 'px), calc(-100% - ' + lift + 'px)) ' +
      'rotate(' + tilt + 'deg) scale(' + scale + ')';
    setShadow(clampedDy);
  }

  function resetInlineStyles(){
    book.style.transform = '';
  }

  function springBack(){
    book.classList.remove('dragging');
    book.classList.add('settling');
    resetInlineStyles();
    shadowEl.style.transform = '';
    shadowEl.style.opacity = '';
    var done = function(){
      book.classList.remove('settling');
      book.removeEventListener('transitionend', done);
    };
    book.addEventListener('transitionend', done);
  }

  function commitOpen(){
    if (opened) return;
    opened = true;
    book.classList.remove('dragging');
    book.classList.add('opening');
    book.setAttribute('aria-disabled', 'true');

    if (reduceMotion){
      veil.classList.add('show');
      setTimeout(function(){ window.location.href = NEXT_URL; }, 200);
      return;
    }

    book.style.transform = 'translate(-50%, calc(-100% - 210px)) rotate(-2deg) scale(1.08)';
    shadowEl.style.opacity = '0';
    setTimeout(function(){ veil.classList.add('show'); }, 190);
    setTimeout(function(){ window.location.href = NEXT_URL; }, 560);
  }

  function onPointerDown(e){
    if (opened) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    activePointerId = e.pointerId;
    try { book.setPointerCapture(e.pointerId); } catch(err){}
    startX = e.clientX; startY = e.clientY;
    maxMove = 0; currentDy = 0;
    book.classList.add('dragging');
    wakeHint();
  }

  function onPointerMove(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    var dx = e.clientX - startX;
    var dy = startY - e.clientY; // 위로 당기면 양수
    currentDy = dy;
    maxMove = Math.max(maxMove, Math.abs(dx), Math.abs(dy));
    applyDrag(dy, dx);
  }

  function onPointerUp(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    book.classList.remove('dragging');

    if (maxMove < TAP_PX || currentDy >= OPEN_PX){
      commitOpen();
    } else {
      springBack();
    }
    suppressNextClick = true; // 곧이어 브라우저가 합성 발생시킬 click은 무시
    maxMove = 0;
  }

  function onPointerCancel(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    springBack();
  }

  book.addEventListener('pointerdown', onPointerDown);
  book.addEventListener('pointermove', onPointerMove);
  book.addEventListener('pointerup', onPointerUp);
  book.addEventListener('pointercancel', onPointerCancel);

  // 키보드(Enter/Space)로 여는 경우 — 포인터 제스처를 거치지 않은 click만 처리
  book.addEventListener('click', function(e){
    if (suppressNextClick){ suppressNextClick = false; return; } // 방금 포인터로 이미 처리됨
    commitOpen();
  });

  window.addEventListener('blur', function(){
    if (dragging){ dragging = false; activePointerId = null; springBack(); }
  });

})();
</script>

</body>
</html>
