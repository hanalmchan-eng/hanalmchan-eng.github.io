  :root{
    --paper:#ffffff;
    --ink:#141414;
    --ink-60:rgba(20,20,20,.6);
    --ink-35:rgba(20,20,20,.35);
    --ink-22:rgba(20,20,20,.22);
    --ink-16:rgba(20,20,20,.14);
    --ink-10:rgba(20,20,20,.10);
    --spine-bg-a:#ffffff;
    --spine-bg-b:#f4f3f0;
    --spine-shadow:rgba(20,20,20,.20);

    --shelf-y:calc(100% - 48px);
    --book-left:calc(100% - (var(--spine-w) / 2) - (var(--spine-h) * 0.122) - 3px);
    --spine-w:clamp(30px,3.8vw,48px);
    /* 책 상단이 화면 세로의 4/5 지점(위에서 20% 아래)에 오도록: 높이를 화면의 80%로 */
    --spine-h:clamp(320px,80vh,900px);
    --tilt:7deg;

    /* 실제 태양의 고도/방위각으로 갱신되는 그림자 값 — JS가 없거나 로딩 전에도
       어색하지 않도록 기본값을 둔다 */
    --shadow-angle:0deg;
    --shadow-length:56px;
    --shadow-opacity:.4;
  }

  /* ── 다크모드: 시스템 설정을 그대로 따름 ── */
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111113;
      --ink:#ececeb;
      --ink-60:rgba(236,236,235,.62);
      --ink-35:rgba(236,236,235,.35);
      --ink-22:rgba(236,236,235,.20);
      --ink-16:rgba(236,236,235,.14);
      --ink-10:rgba(236,236,235,.09);
      --spine-bg-a:#1c1c1e;
      --spine-bg-b:#141416;
      --spine-shadow:rgba(0,0,0,.55);
    }
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%; overflow:hidden;
    background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
    transition:background-color .3s ease, color .3s ease;
  }

  #scene{ position:fixed; inset:0; overflow:hidden; }

  /* 책이 기대는 얇은 칸막이(서가의 측판) */
  .divider{
    position:absolute; top:var(--shelf-y);
    left:calc(var(--book-left) + (var(--spine-w) / 2) + (var(--spine-h) * 0.122) + 3px);
    width:1px; height:calc(var(--spine-h) * 0.97);
    transform:translate(0,-100%);
    background:linear-gradient(to top, var(--ink-22), var(--ink-10) 85%, rgba(20,20,20,0));
    pointer-events:none;
  }

  /* 아직 채워지지 않은 자리 — 앞으로 늘어날 책들의 자리를 점선으로 예고 */
  .ghost-slot{
    position:absolute; top:var(--shelf-y); transform:translate(-50%,-100%);
    border:1px dashed var(--ink-16);
    pointer-events:none;
  }
  .ghost-slot.g1{ left:45%; width:calc(var(--spine-w) * 0.92); height:calc(var(--spine-h) * 0.94); }
  .ghost-slot.g2{ left:55.5%; width:calc(var(--spine-w) * 0.84); height:calc(var(--spine-h) * 0.86); }

  /* 바닥/선반 면은 따로 그리지 않는다 — 이 그림자 하나만으로 책이 놓여 있음을
     암시한다. 길이·기울기·농도는 보고 있는 사람의 지금 이 순간, 실제 태양의
     고도와 방위각에서 계산되어 시시각각 바뀐다 */
  .sun-shadow{
    position:absolute; top:var(--shelf-y); left:var(--book-left);
    width:calc(var(--spine-w) * 1.5);
    height:var(--shadow-length);
    transform-origin:50% 0%;
    transform:translate(-50%,0) rotate(var(--shadow-angle));
    border-radius:50%;
    background:linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,0) 100%);
    mix-blend-mode:multiply;
    filter:blur(7px);
    opacity:var(--shadow-opacity);
    pointer-events:none;
    transition:height .6s ease, transform .6s ease, opacity .45s ease;
    will-change:transform,opacity,height;
  }

  .book{
    position:absolute; top:var(--shelf-y); left:var(--book-left);
    width:var(--spine-w); height:var(--spine-h);
    transform:translate(-50%,-100%) rotate(var(--tilt));
    transform-origin:bottom center;
    background:none; border:0; padding:0; -webkit-appearance:none; appearance:none;
    cursor:grab; touch-action:none; -webkit-tap-highlight-color:transparent;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    animation:idleSway 7s ease-in-out infinite;
  }
  .book:hover, .book:focus-visible{
    transform:translate(-50%, calc(-100% - 8px)) rotate(calc(var(--tilt) - 3deg));
  }
  .book:focus-visible{ outline:2px solid var(--ink); outline-offset:10px; }
  .book:hover, .book:focus-visible, .book.dragging, .book.settling, .book.opening{
    animation-play-state:paused;
  }
  .book.dragging{ transition:none; cursor:grabbing; }
  .book.settling{ transition:transform .55s cubic-bezier(.34,1.56,.64,1); }
  .book.opening{ transition:transform .55s cubic-bezier(.16,1,.3,1); }

  @keyframes idleSway{
    0%,100%{ transform:translate(-50%,-100%) rotate(var(--tilt)); }
    50%{ transform:translate(-50%,-100%) rotate(calc(var(--tilt) - .6deg)); }
  }

  /* 얇고 흰 책등 — 두께감은 헤어라인 보더와 그림자만으로 표현 */
  .spine{
    position:relative; display:block; width:100%; height:100%;
    overflow:hidden;
    background:linear-gradient(100deg, var(--spine-bg-a) 0%, var(--spine-bg-a) 90%, var(--spine-bg-b) 100%);
    border:1px solid var(--ink-16);
    box-shadow:0 16px 28px -16px var(--spine-shadow);
    transition:background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .spine-edge{
    position:absolute; top:0; right:0; width:3px; height:100%;
    background:linear-gradient(90deg, rgba(20,20,20,0), var(--ink-10));
  }

  .spine-mark{
    position:absolute; left:50%; top:22%;
    width:calc(var(--spine-h) * 0.34);
    height:calc(var(--spine-w) * 1.3);
    transform:translate(-50%,-50%) rotate(-90deg);
    display:flex; align-items:center; justify-content:center;
  }
  .spine-mark-text{
    font-family:'LMCHan', Georgia, 'Times New Roman', serif;
    font-weight:400;
    font-size:calc(var(--spine-w) * 0.58);
    letter-spacing:0;
    color:var(--ink); white-space:nowrap; text-transform:lowercase;
  }

  #site-label{
    position:fixed; top:24px; left:20px; z-index:50;
    font-size:12px; letter-spacing:.08em; color:var(--ink-60);
  }

  #hint{ position:fixed; left:20px; bottom:22px; z-index:50; pointer-events:none; transition:opacity .5s; }
  #hint-text{ font-size:10px; color:var(--ink-60); letter-spacing:.04em; line-height:1.6; white-space:nowrap; }

  #veil{ position:fixed; inset:0; background:var(--paper); opacity:0; pointer-events:none; z-index:200; transition:opacity .38s ease; }
  #veil.show{ opacity:1; }

  @media (prefers-reduced-motion:reduce){
    .book{ animation:none; }
    .book, .book.settling, .book.opening{ transition-duration:.15s; }
    .sun-shadow{ transition:none; }
  }
</style>
</head>
<body>

  <div id="site-label">서가</div>

  <div id="hint"><div id="hint-text"></div></div>

  <div id="scene">
    <div class="ghost-slot g1" aria-hidden="true"></div>
    <div class="ghost-slot g2" aria-hidden="true"></div>
    <div class="divider" aria-hidden="true"></div>
    <div class="sun-shadow" aria-hidden="true"></div>

    <button class="book" id="book" type="button" aria-label="hanalmchan — 당겨서 열기">
      <span class="spine">
        <span class="spine-mark">
          <span class="spine-mark-text">hanalmchan</span>
        </span>
        <span class="spine-edge" aria-hidden="true"></span>
      </span>
    </button>
  </div>

  <div id="veil"></div>

<script>
(function(){
  'use strict';

  // ====== 설정: 실제 배포 시 이 값만 맞춰주면 됩니다 ======
  var NEXT_URL = 'hanalmchan.html'; // 이 책을 열었을 때 이동할 갤러리 페이지
  // ===========================================================

  var book       = document.getElementById('book');
  var veil       = document.getElementById('veil');
  var hint       = document.getElementById('hint');
  var hintText   = document.getElementById('hint-text');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 안내문구 ----
  hintText.innerHTML =
    '당겨서 꺼내기 · 또는 클릭해서 열기<br>' +
    'Drag to pull it out · or click to open<br>' +
    '引いて取り出す · またはクリックで開く';

  var hideTimer = setTimeout(function(){ hint.style.opacity = '0'; }, 6000);
  function wakeHint(){
    clearTimeout(hideTimer);
    hint.style.opacity = '1';
    hideTimer = setTimeout(function(){ hint.style.opacity = '0'; }, 4000);
  }

  // ---- 태양 위치 기반 그림자 ----
  // sun.angle/length/opacity 는 실제 고도·방위각에서 계산된 "기준값"이고,
  // sun.lift 는 드래그·호버로 책이 들려 있는 정도(0~1)를 나타낸다.
  // 두 값을 곱해 최종 CSS 변수로 반영한다.
  var sun = { lat:null, lon:null, angle:0, length:56, opacity:.4, lift:0 };

  function applyShadow(){
    var t = sun.lift;
    var len = sun.length * (1 - t * 0.55);
    var op  = sun.opacity * (1 - t * 0.75);
    var root = document.documentElement.style;
    root.setProperty('--shadow-length', Math.max(16, len).toFixed(1) + 'px');
    root.setProperty('--shadow-opacity', Math.max(0, op).toFixed(2));
    root.setProperty('--shadow-angle', sun.angle.toFixed(1) + 'deg');
  }

  // NOAA 근사식 기반 태양 고도(altitude)·방위각(azimuth) 계산 (도 단위 반환)
  function solarPosition(date, lat, lon, tzHours){
    var rad = Math.PI / 180;
    var startOfYear = Date.UTC(date.getFullYear(), 0, 1);
    var dayOfYear = Math.floor((date.getTime() - startOfYear) / 86400000) + 1;
    var minutesOfDay = date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60;

    var gamma = (2 * Math.PI / 365) * (dayOfYear - 1 + (date.getHours() - 12) / 24);

    var eqtime = 229.18 * (
      0.000075
      + 0.001868 * Math.cos(gamma)
      - 0.032077 * Math.sin(gamma)
      - 0.014615 * Math.cos(2 * gamma)
      - 0.040849 * Math.sin(2 * gamma)
    );

    var decl = 0.006918
      - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
      - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma)
      - 0.002697 * Math.cos(3 * gamma) + 0.001480 * Math.sin(3 * gamma);

    var timeOffset = eqtime + 4 * lon - 60 * tzHours;
    var tst = minutesOfDay + timeOffset;
    var ha = (tst / 4) - 180;
    var haRad = ha * rad;
    var latRad = lat * rad;

    var cosZenith = Math.sin(latRad) * Math.sin(decl) + Math.cos(latRad) * Math.cos(decl) * Math.cos(haRad);
    cosZenith = Math.max(-1, Math.min(1, cosZenith));
    var zenithRad = Math.acos(cosZenith);
    var altitude = 90 - zenithRad / rad;

    var denom = Math.cos(latRad) * Math.sin(zenithRad);
    var azimuth;
    if (Math.abs(denom) < 1e-6){
      azimuth = 180;
    } else {
      var cosAz = -(Math.sin(latRad) * Math.cos(zenithRad) - Math.sin(decl)) / denom;
      cosAz = Math.max(-1, Math.min(1, cosAz));
      var azRad = Math.acos(cosAz);
      azimuth = (ha > 0) ? (azRad / rad + 180) % 360 : (540 - azRad / rad) % 360;
    }

    return { altitude: altitude, azimuth: azimuth };
  }

  function updateSunShadow(){
    if (sun.lat === null || sun.lon === null) return;

    var now = new Date();
    var tzHours = -now.getTimezoneOffset() / 60;
    var pos = solarPosition(now, sun.lat, sun.lon, tzHours);

    if (pos.altitude <= 0){
      // 해가 진 시간 — 방향은 마지막 값을 유지한 채, 그림자를 옅고 짧게
      sun.length = 40;
      sun.opacity = 0.16;
      applyShadow();
      return;
    }

    var altRad = Math.max(pos.altitude, 3) * Math.PI / 180; // 지평선 근처에서 과도하게 길어지지 않도록 하한
    var azRad  = pos.azimuth * Math.PI / 180;

    var rawLength = 42 / Math.tan(altRad);
    sun.length  = Math.max(30, Math.min(rawLength, 260));
    sun.angle   = Math.sin(azRad) * 34; // 태양의 방위에 따른 좌우 기울기
    sun.opacity = Math.max(0.18, Math.min(0.48, 0.52 - pos.altitude / 180));

    applyShadow();
  }

  function initSun(){
    // 위치 권한을 허용하지 않아도 그림자가 뜨도록 서울 좌표를 기본값으로 사용
    sun.lat = 37.5665;
    sun.lon = 126.9780;
    updateSunShadow();

    if ('geolocation' in navigator){
      navigator.geolocation.getCurrentPosition(function(pos){
        sun.lat = pos.coords.latitude;
        sun.lon = pos.coords.longitude;
        updateSunShadow();
      }, function(){ /* 권한 거부 시 기본 좌표 유지 */ }, { timeout: 4000, maximumAge: 600000 });
    }

    setInterval(updateSunShadow, 5 * 60 * 1000);
  }

  // ---- 드래그로 책 꺼내기 ----
  var TILT_DEG   = 7;
  var OPEN_PX    = 90;   // 이만큼 위로 당기면 (또는 밀어서 살피면) 곧바로 열림
  var TAP_PX     = 8;    // 이보다 적게 움직이면 '클릭'으로 간주

  var dragging = false;
  var activePointerId = null;
  var startX = 0, startY = 0;
  var maxMove = 0;
  var currentDy = 0;
  var opened = false;
  var suppressNextClick = false; // 포인터 제스처가 이미 처리한 뒤 이어지는 합성 click 무시용

  function setShadow(dy){
    var lift = Math.max(0, dy);
    sun.lift = Math.min(lift / 140, 1);
    applyShadow();
  }

  function applyDrag(dy, dx){
    var clampedDy = Math.max(-14, Math.min(dy, 220));
    var lift = Math.max(0, clampedDy) * 0.92;
    var tiltProgress = Math.min(Math.max(clampedDy, 0), 150) / 150;
    var tilt = TILT_DEG - tiltProgress * (TILT_DEG + 2.5);
    if (clampedDy < 0) tilt = TILT_DEG - clampedDy * 0.12;
    var scale = 1 + Math.min(Math.max(clampedDy, 0), 220) * 0.0007;
    var sway = Math.max(-6, Math.min(dx * 0.06, 6));
    book.style.transform =
      'translate(calc(-50% + ' + sway + 'px), calc(-100% - ' + lift + 'px)) ' +
      'rotate(' + tilt + 'deg) scale(' + scale + ')';
    setShadow(clampedDy);
  }

  function resetInlineStyles(){
    book.style.transform = '';
  }

  function springBack(){
    book.classList.remove('dragging');
    book.classList.add('settling');
    resetInlineStyles();
    sun.lift = 0;
    applyShadow();
    var done = function(){
      book.classList.remove('settling');
      book.removeEventListener('transitionend', done);
    };
    book.addEventListener('transitionend', done);
  }

  function commitOpen(){
    if (opened) return;
    opened = true;
    book.classList.remove('dragging');
    book.classList.add('opening');
    book.setAttribute('aria-disabled', 'true');

    if (reduceMotion){
      veil.classList.add('show');
      setTimeout(function(){ window.location.href = NEXT_URL; }, 200);
      return;
    }

    book.style.transform = 'translate(-50%, calc(-100% - 210px)) rotate(-2deg) scale(1.08)';
    document.documentElement.style.setProperty('--shadow-opacity', '0');
    setTimeout(function(){ veil.classList.add('show'); }, 190);
    setTimeout(function(){ window.location.href = NEXT_URL; }, 560);
  }

  function onPointerDown(e){
    if (opened) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    activePointerId = e.pointerId;
    try { book.setPointerCapture(e.pointerId); } catch(err){}
    startX = e.clientX; startY = e.clientY;
    maxMove = 0; currentDy = 0;
    book.classList.add('dragging');
    wakeHint();
  }

  function onPointerMove(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    var dx = e.clientX - startX;
    var dy = startY - e.clientY; // 위로 당기면 양수
    currentDy = dy;
    maxMove = Math.max(maxMove, Math.abs(dx), Math.abs(dy));
    applyDrag(dy, dx);

    // 밀어서(당겨서) 살피는 도중, 기준선을 넘으면 놓기를 기다리지 않고 그 자리에서 바로 열림
    if (dy >= OPEN_PX && !opened){
      dragging = false;
      try { book.releasePointerCapture(e.pointerId); } catch(err){}
      activePointerId = null;
      suppressNextClick = true;
      commitOpen();
    }
  }

  function onPointerUp(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    book.classList.remove('dragging');

    if (maxMove < TAP_PX){
      commitOpen(); // 짧게 눌렀다 뗀 경우 — 클릭으로 간주해 바로 열림
    } else {
      springBack(); // 기준선(OPEN_PX)에 못 미치고 손을 뗀 경우만 제자리로
    }
    suppressNextClick = true; // 곧이어 브라우저가 합성 발생시킬 click은 무시
    maxMove = 0;
  }

  function onPointerCancel(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    springBack();
  }

  book.addEventListener('pointerdown', onPointerDown);
  book.addEventListener('pointermove', onPointerMove);
  book.addEventListener('pointerup', onPointerUp);
  book.addEventListener('pointercancel', onPointerCancel);

  book.addEventListener('mouseenter', function(){
    if (!dragging){ sun.lift = 0.4; applyShadow(); }
  });
  book.addEventListener('mouseleave', function(){
    if (!dragging){ sun.lift = 0; applyShadow(); }
  });

  // 키보드(Enter/Space) 또는 트랙패드 등 포인터 제스처 없이 들어오는 click만 처리
  book.addEventListener('click', function(e){
    if (suppressNextClick){ suppressNextClick = false; return; } // 방금 포인터로 이미 처리됨
    commitOpen();
  });

  window.addEventListener('blur', function(){
    if (dragging){ dragging = false; activePointerId = null; springBack(); }
  });

  initSun();

})();
</script>

</body>
</html>
