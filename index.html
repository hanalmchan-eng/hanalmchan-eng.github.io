<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>photos by HAN ALEUM — 원본 구매</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo_mask.png">
<link rel="apple-touch-icon" href="logo_mask.png">
<style>
  @font-face{
    font-family:'LMCHan';
    src:url('fonts/LMCHan.woff2') format('woff2'), url('LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'), url('LMCHan.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --paper:#ffffff; --ink:#141414;
    --ink-60:rgba(20,20,20,.6); --ink-35:rgba(20,20,20,.35);
    --ink-16:rgba(20,20,20,.14); --ink-08:rgba(20,20,20,.07);
    --kakao:#FEE500; --kakao-ink:#191600;
    --toss:#0064FF; --toss-ink:#ffffff;
    --price-bg:#141414;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111113; --ink:#ececeb;
      --ink-60:rgba(236,236,235,.62); --ink-35:rgba(236,236,235,.35);
      --ink-16:rgba(236,236,235,.16); --ink-08:rgba(236,236,235,.08);
      --price-bg:#2a2a2c;
    }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    min-height:100%; background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;
  }
  body{ padding:32px 20px 80px; display:flex; flex-direction:column; align-items:center; }
  .wrap{ width:100%; max-width:460px; }
  /* 전체 언어 전환 스위처: 페이지 맨 위 */
  .lang-switch-top{ display:flex; justify-content:center; gap:6px; margin-bottom:26px; }
  .lang-btn{
    font-size:10px; letter-spacing:.04em; padding:4px 11px; border-radius:20px;
    border:1px solid var(--ink-16); background:transparent; color:var(--ink-35);
    cursor:pointer; font-family:inherit;
  }
  .lang-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .brand{
    font-family:'LMCHan', Georgia, serif; font-size:19px; letter-spacing:.07em;
    text-align:center; margin-bottom:6px; -webkit-text-stroke:.3px currentColor;
  }
  .sub{
    font-size:10px; color:var(--ink-35); letter-spacing:.06em; text-align:center;
    line-height:1.9; margin-bottom:30px;
  }
  .photo{
    width:100%; border-radius:3px; overflow:hidden; background:var(--ink-08);
    margin-bottom:22px; line-height:0;
  }
  .photo img{ width:100%; height:auto; display:block; }
  .title{ font-size:16px; letter-spacing:.03em; text-align:center; margin-bottom:6px; }
  /* 제공 파일 목록: 작고 흐린 회색 */
  .desc{
    font-size:11px; color:var(--ink-35); letter-spacing:.04em; text-align:center;
    line-height:1.9; margin-bottom:10px; min-height:1px;
  }
  /* 구매방식 / 배포 여부 배지 — O/X 로 간단히 표시 */
  .flags{
    font-size:10px; color:var(--ink-60); letter-spacing:.05em; text-align:center;
    line-height:1.8; margin-bottom:18px; font-variant-numeric:tabular-nums;
  }
  .flags[hidden]{ display:none; }
  .flags b{ color:var(--ink); font-weight:700; }
  /* 가격: 어두운 배지 위에 항상 흰 텍스트 (라이트/다크 모드 무관) */
  .price-wrap{ text-align:center; margin-bottom:22px; }
  .price-wrap[hidden]{ display:none; }
  .price{
    display:inline-block;
    background:var(--price-bg); color:#ffffff;
    font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:.02em;
    padding:10px 22px; border-radius:6px;
  }
  /* 구매 전 유의사항: 페이지 맨 마지막 */
  .notice{
    text-align:center; font-size:11px; color:var(--ink-60);
    letter-spacing:.03em; line-height:1.9; margin-top:28px;
  }
  .notice b{ color:var(--ink); font-weight:600; }
  .steps[hidden]{ display:none; }
  /* 송금 버튼 */
  .btn{
    display:block; width:100%; padding:15px; border:none; border-radius:4px;
    text-align:center; font-size:15px; letter-spacing:.03em; text-decoration:none;
    cursor:pointer; margin-bottom:10px; transition:opacity .2s ease;
  }
  .btn:hover{ opacity:.88; }
  .btn.kakao{ background:var(--kakao); color:var(--kakao-ink); }
  .btn.toss{ background:var(--toss); color:var(--toss-ink); }
  .btn[hidden]{ display:none; }
  /* 송금 QR */
  .qr-box{ display:flex; flex-direction:column; align-items:center; margin-bottom:4px; }
  .qr-box a{
    display:block; width:100%; text-decoration:none;
    border-radius:16px; overflow:hidden; border:1px solid var(--ink-16);
  }
  .qr-box img{
    width:100%; max-width:100%; height:auto; display:block;
    background:#fff;
    transition:filter .2s ease;
  }
  @media (prefers-color-scheme: dark){
    .qr-box img{ filter:invert(1); }
  }
  .qr-cap{ font-size:11px; color:var(--ink-35); letter-spacing:.05em; line-height:1.7; margin-top:12px; }
  .steps{
    border:1px solid var(--ink-16); border-radius:4px; padding:16px 18px;
    margin-top:22px; font-size:11px; color:var(--ink-60); line-height:2; letter-spacing:.02em;
  }
  .steps b{ color:var(--ink); font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- 언어 전환: 페이지 맨 위, 전체 문구에 적용됨 -->
    <div class="lang-switch-top" id="langSwitchTop">
      <button type="button" class="lang-btn active" data-lang="ko">한국어</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="ja">日本語</button>
    </div>
    <div class="brand">photos by HAN ALEUM</div>
    <div class="sub" id="sub"></div>
    <div class="photo"><img id="photo" alt=""></div>
    <div class="title" id="title" hidden></div>
    <!-- 제공 파일 목록. 판매중이면 실제 구성(원문 그대로), 아니면 언어별 안내 문구 -->
    <div class="desc" id="desc"></div>
    <!-- 직접구매/대행구매, 배포허용/배포금지를 O·X 로 표시. 판매중일 때만 노출 -->
    <div class="flags" id="flags" hidden></div>
    <!-- 가격: 선택된 언어에 따라 원/달러/엔 중 하나로 표시. 판매 여부와 무관하게 항상 노출 -->
    <div class="price-wrap">
      <div class="price" id="price"></div>
    </div>
    <!-- 구매 문의 QR: 판매 여부와 무관하게 항상 표시 -->
    <div class="qr-box">
      <a id="qr-link"><img id="qr" alt="문의 QR 코드"></a>
      <div class="qr-cap" id="qr-cap"></div>
    </div>
    <!-- 판매중일 때만: 결제 진행 안내 (선택된 언어로, 구매방식에 맞게 표시) -->
    <div class="steps" id="steps" hidden></div>
    <!-- 구매 전 유의사항: 항상 노출, 선택된 언어와 구매방식/배포여부에 맞게 표시 -->
    <div class="notice" id="notice"></div>
<script>
(function(){
  'use strict';
  // ==================== 설정 (여기만 바꾸면 됩니다) ====================
  var CONFIG = {
    QR_IMAGE: 'https://hanalmchan-eng.github.io/pay-qr.png',
    PAY_LINK: 'https://open.kakao.com/me/HANALMCHAN',
    R2_BASE:    'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev',
    PHOTO_FILE: '2F9A6950.jpeg',
    TITLE:      '',
    // ▶ 환율 (필요할 때 이 두 값만 바꾸면 전체 페이지의 환산가가 자동으로 갱신됩니다)
    //   USD_PER_UNIT: $1 = 이 원화 금액
    //   JPY_PER_100:  ¥100 = 이 원화 금액
    USD_PER_UNIT: 1500,
    JPY_PER_100:  1000
  };
  // ===================================================================
  var qp = new URLSearchParams(location.search);
  if (qp.get('file'))  CONFIG.PHOTO_FILE = qp.get('file');
  var rawTitle = qp.get('title');
  var looksLikeFilename = !!(rawTitle && /^(img|dsc|dscf|pxl|photo|p)[-_]?\d{3,}/i.test(rawTitle.trim()));
  var titleFromQuery = (rawTitle && !looksLikeFilename) ? rawTitle : null;
  if (titleFromQuery) CONFIG.TITLE = titleFromQuery;
  var $ = function(id){ return document.getElementById(id); };
  function assetUrl(f){
    return /^https?:/.test(f) ? f : (CONFIG.R2_BASE + '/' + encodeURIComponent(f));
  }
  // posts.json 의 product 에 아래 두 필드를 넣으면 이 페이지가 자동으로 반영합니다.
  // "directPurchase": "O"  → 구매자가 작가(HAN ALEUM)에게 직접 결제
  // "directPurchase": "X"  → 구매자가 모델에게 직접 송금 (대행), 값이 없으면 기본 X
  // "distribution":   "O"  → 배포 허용
  // "distribution":   "X"  → 배포 금지, 값이 없으면 기본 X
  function flagVal(v){
    return v === true || v === 'O' || v === 'o' || v === '○' || v === 1;
  }
  // ===== 다국어 문구 =====
  var I18N = {
    ko: {
      sub: '워터마크 없는 보정본 · 추가 원본 · 촬영 영상 구매',
      notForSale: '전량 판매 완료되었습니다.',
      qrCapDefault: '스캔해서 오픈채팅으로 문의',
      qrCapWithLink: 'QR 스캔 · 또는 눌러서 오픈채팅 문의',
      flagPurchase: '직접구매',
      flagDistribution: '배포',
      flagLimit: '한정수량',
      noticeTitle: '구매 전 유의사항',
      noticeLimited: '· 모델의 요청에 따라 수량 한정 판매로 진행됩니다.',
      noticeDirect: '· 구매자가 작가(HAN ALEUM)에게 직접 결제하는 방식입니다.',
      noticeAgency: '· 구매자가 모델에게 직접 송금하는 방식입니다.',
      noticeDistAllow: '· 배포가 허용된 사진입니다.',
      noticeDistBan: '· 모델의 요청에 따라 배포 금지를 요청했습니다.',
      noticeNoRefund: '· 이메일 전송이 완료되면 환불은 되지 않습니다.',
      stepsHead: '<b>결제는 카카오톡 오픈채팅에서 진행됩니다.</b><br><br><b>진행 순서</b><br>',
      steps1: '1. 위 QR로 오픈채팅 1:1 대화를 시작해요.<br>',
      steps2: '2. 사진을 받으실 이메일 주소를 알려주세요.<br>',
      stepsDirect3: '3. 안내해드리는 계좌로 결제해주세요.<br>',
      stepsDirect4: '4. 결제가 확인되면 알려주신 이메일로 원본 파일을 보내드려요.',
      stepsAgency3: '3. 모델님을 초대해 직접 송금을 요청드려요.<br>',
      stepsAgency4: '4. 송금이 확인되면 알려주신 이메일로 원본 파일을 보내드려요.'
    },
    en: {
      sub: 'Watermark-free retouched photos, extra originals & footage',
      notForSale: 'Sold out — all copies have been sold.',
      qrCapDefault: 'Scan to open chat and inquire',
      qrCapWithLink: 'Scan the QR, or tap to open chat',
      flagPurchase: 'Direct purchase',
      flagDistribution: 'Distribution',
      flagLimit: 'Limited to',
      noticeTitle: 'Before you buy',
      noticeLimited: '· Per the model\'s request, this is offered as a limited-quantity sale.',
      noticeDirect: '· Buyers pay the photographer (HAN ALEUM) directly.',
      noticeAgency: '· Buyers transfer payment directly to the model.',
      noticeDistAllow: '· Distribution of this photo is permitted.',
      noticeDistBan: "· Distribution is prohibited at the model's request.",
      noticeNoRefund: '· No refunds once the file has been emailed.',
      stepsHead: '<b>Payment is handled via KakaoTalk Open Chat.</b><br><br><b>How it works</b><br>',
      steps1: '1. Start a 1:1 chat using the QR above.<br>',
      steps2: "2. Share the email address you'd like the photos sent to.<br>",
      stepsDirect3: '3. Pay using the account details we provide.<br>',
      stepsDirect4: "4. Once payment is confirmed, we'll send the original files to that email.",
      stepsAgency3: "3. We'll invite the model and request a direct transfer.<br>",
      stepsAgency4: "4. Once the transfer is confirmed, we'll send the original files to that email."
    },
    ja: {
      sub: '透かしなしの補正済み写真・追加オリジナル・撮影映像の購入',
      notForSale: '完売しました。',
      qrCapDefault: 'スキャンしてオープンチャットへ',
      qrCapWithLink: 'QRをスキャン、またはタップでチャット',
      flagPurchase: '直接購入',
      flagDistribution: '配布',
      flagLimit: '数量限定',
      noticeTitle: 'ご購入前に',
      noticeLimited: '· モデルの要望により数量限定販売として行っております。',
      noticeDirect: '· 購入者が撮影者(HAN ALEUM)に直接お支払いする方式です。',
      noticeAgency: '· 購入者がモデルに直接送金する方式です。',
      noticeDistAllow: '· この写真は配布が許可されています。',
      noticeDistBan: '· モデルの要望により配布を禁止しています。',
      noticeNoRefund: '· メール送信完了後は返金できません。',
      stepsHead: '<b>決済はカカオトークのオープンチャットで行います。</b><br><br><b>進め方</b><br>',
      steps1: '1. 上のQRからオープンチャットで1:1トークを始めてください。<br>',
      steps2: '2. 写真を受け取るメールアドレスを教えてください。<br>',
      stepsDirect3: '3. ご案内する口座へお支払いください。<br>',
      stepsDirect4: '4. お支払いが確認できましたら、そのメールに元データをお送りします。',
      stepsAgency3: '3. モデルを招待して直接送金をお願いします。<br>',
      stepsAgency4: '4. 送金が確認できましたら、そのメールに元データをお送りします。'
    }
  };
  var currentLang = 'ko';
  var lastProduct = null; // applyLang() 재실행 시(언어 전환) 최신 상품 정보를 다시 그리기 위해 캐시
  // 언어에 따라 표시 통화가 달라짐: 한국어→원, EN→달러, 日本語→엔
  function fmtPrice(krw, lang){
    if (lang === 'en'){
      return '$' + (krw / CONFIG.USD_PER_UNIT).toFixed(2);
    }
    if (lang === 'ja'){
      var jpy = krw / (CONFIG.JPY_PER_100 / 100);
      return '¥' + Math.round(jpy).toLocaleString('ja-JP');
    }
    return '₩' + Math.round(krw).toLocaleString('ko-KR');
  }
  function buildNotice(t, direct, dist){
    return '<b>' + t.noticeTitle + '</b><br><br>' +
      t.noticeLimited + '<br><br>' +
      (direct ? t.noticeDirect : t.noticeAgency) + '<br><br>' +
      (dist ? t.noticeDistAllow : t.noticeDistBan) + '<br><br>' +
      t.noticeNoRefund;
  }
  function buildSteps(t, direct){
    return t.stepsHead + t.steps1 + t.steps2 +
      (direct ? (t.stepsDirect3 + t.stepsDirect4) : (t.stepsAgency3 + t.stepsAgency4));
  }
  // 언어에 따라 한정 수량 단위를 다르게 표기 (개 / 点 / 숫자만)
  function fmtLimit(n, lang){
    if (lang === 'en') return String(n);
    if (lang === 'ja') return n + '点';
    return n + '개';
  }
  // limit 이 0(또는 값 없음)이면 수량 제한이 없는 것으로 보고 배지를 표시하지 않는다.
  function buildFlags(t, direct, dist, limit, lang){
    var s = t.flagPurchase + ' <b>' + (direct ? 'O' : 'X') + '</b>' +
      '&nbsp;&nbsp;·&nbsp;&nbsp;' +
      t.flagDistribution + ' <b>' + (dist ? 'O' : 'X') + '</b>';
    if (limit > 0){
      s += '&nbsp;&nbsp;·&nbsp;&nbsp;' + t.flagLimit + ' <b>' + fmtLimit(limit, lang) + '</b>';
    }
    return s;
  }
  function applyLang(lang){
    currentLang = lang;
    var t = I18N[lang];
    var btns = document.querySelectorAll('.lang-btn');
    for (var i = 0; i < btns.length; i++){
      btns[i].classList.toggle('active', btns[i].getAttribute('data-lang') === lang);
    }
    $('sub').textContent = t.sub;
    $('qr-cap').textContent = CONFIG.PAY_LINK ? t.qrCapWithLink : t.qrCapDefault;
    renderProduct(lastProduct); // 언어에 따라 "판매중 아님" 문구 등을 다시 그림
  }
  $('photo').src = assetUrl(CONFIG.PHOTO_FILE);
  if (CONFIG.TITLE) {
    $('title').textContent = CONFIG.TITLE;
    $('title').hidden = false;
  }
  var langBtns = document.querySelectorAll('.lang-btn');
  for (var li = 0; li < langBtns.length; li++){
    langBtns[li].addEventListener('click', function(){
      applyLang(this.getAttribute('data-lang'));
    });
  }
  var qr = $('qr');
  qr.src = assetUrl(CONFIG.QR_IMAGE) + '?v=' + Date.now();
  qr.onerror = function(){
    $('qr-cap').textContent = 'QR 이미지를 불러오지 못했습니다 (' + CONFIG.QR_IMAGE + ').';
  };
  var qrLink = $('qr-link');
  if (CONFIG.PAY_LINK){
    qrLink.href = CONFIG.PAY_LINK;
    qrLink.target = '_blank';
    qrLink.rel = 'noopener';
    qrLink.style.cursor = 'pointer';
  }
  // ===== 제공 파일 / 가격 / 구매방식 / 배포여부 =====
  // posts.json 의 각 항목에 아래와 같은 "product" 필드를 넣어두면 자동으로 반영됩니다:
  // "product": {
  //   "desc": "...", "price": 95000,
  //   "directPurchase": "O" | "X",   // O = 작가에게 직접 결제, X(기본) = 모델에게 대행 송금
  //   "distribution": "O" | "X",     // O = 배포 허용, X(기본) = 배포 금지
  //   "limit": 3                     // 판매 제한 수량. 0 이거나 생략하면 수량 제한 없음
  // }
  // desc는 원문(한국어) 그대로 노출되고, 가격만 원/달러/엔으로 자동 환산됩니다.
  // price 가 0(또는 없음)이면 판매중이 아닌 것으로 보고 "전량 판매 완료" 문구를 보여줍니다.
  function renderProduct(product){
    lastProduct = product;
    var t = I18N[currentLang];
    var desc = (product && product.desc) ? String(product.desc).trim() : '';
    var priceNum = product ? (Number(product.price) || 0) : 0;
    var forSale = !!(priceNum > 0 && desc.length > 0);
    var direct = flagVal(product && product.directPurchase);
    var dist   = flagVal(product && product.distribution);
    // limit: 0 이거나 값이 없으면 수량 제한 없음
    var limit  = product ? (Number(product.limit) || 0) : 0;
    $('desc').innerHTML = forSale ? desc.replace(/\n/g, '<br>') : t.notForSale;
    $('price').textContent = fmtPrice(priceNum, currentLang);
    $('flags').innerHTML = buildFlags(t, direct, dist, limit, currentLang);
    $('flags').hidden = !forSale;
    $('steps').innerHTML = buildSteps(t, direct);
    $('steps').hidden = !forSale;
    $('notice').innerHTML = buildNotice(t, direct, dist);
  }
  applyLang('ko');
  fetch('posts.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(posts){
      var match = null;
      for (var i = 0; i < posts.length; i++){
        if (posts[i] && posts[i].file === CONFIG.PHOTO_FILE){ match = posts[i]; break; }
      }
      if (match && match.caption && !titleFromQuery) {
        $('title').textContent = match.caption;
        $('title').hidden = false;
      }
      renderProduct(match ? match.product : null);
    })
    .catch(function(){
      renderProduct(null);
    });
})();
