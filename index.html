<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LMCHAN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  @font-face{
    font-family:'LMCHan';
    src:url('fonts/LMCHan.woff2') format('woff2'),
        url('LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'),
        url('LMCHan.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; min-height:100%;
    background:#0c0c0d; color:#f2f2f0;
    font-family:Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{ padding:64px 0 120px; }
  #brand{
    position:fixed; top:20px; left:22px; z-index:50;
    font-family:'LMCHan', Georgia, serif;
    font-size:22px; letter-spacing:.14em;
    color:#f2f2f0; opacity:.7;
  }
  /* ── 포스트: 글귀 → 날짜와 주소 → 사진 → 좌표 → 지도 ── */
  .post{ margin:0 0 140px; }
  .post:last-child{ margin-bottom:0; }
  .phrase{
    display:block; margin:0 auto 26px;
    max-width:min(560px, 82vw); height:auto;
  }
  .addr{
    text-align:center; margin:0 0 22px;
    font-size:15px; letter-spacing:.06em;
    color:rgba(242,242,240,.85);
    font-variant-numeric:tabular-nums;
    padding:0 24px;
  }
  .photo{ width:100%; line-height:0; cursor:pointer; }
  .photo img, .photo video{
    width:100%; height:auto; display:block;
    background:rgba(242,242,240,.05);
  }
  .coord{
    text-align:center; margin:14px 0 26px;
    font-size:11px; letter-spacing:.08em;
    color:rgba(242,242,240,.55);
    font-variant-numeric:tabular-nums;
  }
  .map{
    width:100%; aspect-ratio:16 / 9; max-height:70vh;
    background:#0c0c0d;
  }
  @media (max-width:669px){
    .map{ aspect-ratio:4 / 5; }
    .post{ margin-bottom:100px; }
  }
  /* 컬러 랜드커버 타일을 어둡게 눌러 페이지 톤에 맞춘다 */
  .base-tiles, .leaflet-tile-pane .base-tiles{
    filter:saturate(2.8) brightness(.55) contrast(1.35) !important;
  }
  .leaflet-container{ background:#0c0c0d; }
  .pin{ background:none !important; border:none !important; }
  .pin span{
    display:block; width:12px; height:12px; border-radius:50%;
    background:#f2f2f0; border:2px solid #0c0c0d;
    box-shadow:0 0 0 1px rgba(242,242,240,.4);
  }
  #loading, #none{
    text-align:center; padding:60px 24px;
    font-size:12px; letter-spacing:.08em; color:rgba(242,242,240,.5);
    line-height:2;
  }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <div id="brand">LMCHAN</div>
  <main id="posts">
    <div id="loading">불러오는 중...</div>
    <div id="none" hidden>표시할 포스트가 없습니다.</div>
  </main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  'use strict';
  var R2_BASE     = 'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev';
  var PLACES_JSON = 'places.json';
  var CONTACT     = 'hanalmchan@gmail.com';   // 인물 사진 원본 구매 문의처
  var MAP_ZOOM    = 11;                       // 포스트 지도의 축척
  var posts   = document.getElementById('posts');
  var loading = document.getElementById('loading');
  var noneEl  = document.getElementById('none');
  function buildUrl(name){ return R2_BASE + '/' + encodeURIComponent(name); }
  function isVideo(name){
    return /\.(mp4|mov|m4v|webm)(\?|$)/i.test(String(name || ''));
  }
  function stem(name){ return String(name || '').replace(/\.[^.]+$/, ''); }
  // 파일명 규칙: 사진이 2F9A6950.jpeg 면
  //   글귀 = 2F9A6950.phrase.png / 폰트 = 2F9A6950.font.woff2
  // phrase / font 필드가 있으면 그것을 우선한다.
  function phraseUrl(p){
    if (p.phrase) return /^https?:/.test(p.phrase) ? p.phrase : buildUrl(p.phrase);
    return p.file ? buildUrl(stem(p.file) + '.phrase.png') : '';
  }
  function fontUrl(p){
    if (p.font) return /^https?:/.test(p.font) ? p.font : buildUrl(p.font);
    return p.file ? buildUrl(stem(p.file) + '.font.woff2') : '';
  }
  function dateOf(p){
    var m = String(p.date || '').match(/(\d{4})\D?(\d{2})\D?(\d{2})/);
    return m ? (m[1] + '.' + m[2] + '.' + m[3]) : '';
  }
  // places.json: 날짜 상위 구조를 평평하게 편다 (평평한 배열도 그대로 인식)
  function flattenPlaces(raw){
    var out = [];
    (raw || []).forEach(function(entry){
      if (!entry) return;
      var list = entry.items || entry.photos;
      if (Array.isArray(list)){
        list.forEach(function(it){
          if (!it) return;
          var o = (typeof it === 'string') ? { file: it } : it;
          if (!o.date) o.date = entry.date;
          if (o.file || o.url) out.push(o);
        });
      } else if (entry.file || entry.url){
        out.push(entry);
      }
    });
    return out;
  }
  // 좌표 해석: "북 33.55007°, 동 126.69116°" / "33.55, 126.69" / "N 33.55, E 126.69"
  function parseCoordString(s){
    if (typeof s !== 'string') return null;
    var re = /([북남동서NSEWnsew])?\s*(-?\d+(?:\.\d+)?)\s*°?/g;
    var lat = null, lng = null, loose = [], m;
    while ((m = re.exec(s)) !== null){
      var tag = (m[1] || '').toUpperCase();
      var v = parseFloat(m[2]);
      if (!isFinite(v)) continue;
      if (tag === '북' || tag === 'N')      lat = v;
      else if (tag === '남' || tag === 'S') lat = -v;
      else if (tag === '동' || tag === 'E') lng = v;
      else if (tag === '서' || tag === 'W') lng = -v;
      else loose.push(v);
    }
    if (lat === null && loose.length) lat = loose.shift();
    if (lng === null && loose.length) lng = loose.shift();
    if (lat === null || lng === null) return null;
    return { lat: lat, lng: lng };
  }
  function coordsOf(p){
    if (typeof p.lat === 'number' && typeof p.lng === 'number')
      return { lat: p.lat, lng: p.lng };
    return parseCoordString(p.coord || p.coords || p.latlng || '');
  }
  function coordText(p){
    if (p.coord) return p.coord;
    var c = coordsOf(p);
    return c ? (c.lat.toFixed(5) + ', ' + c.lng.toFixed(5)) : '';
  }
  // 포스트 전용 폰트 — 없으면 조용히 기본체
  var fontSeq = 0;
  function applyFont(p, el){
    var url = fontUrl(p);
    if (!url || !window.FontFace) return;
    var name = 'PF' + (++fontSeq);
    var ff = new FontFace(name, 'url("' + url + '")');
    ff.load().then(function(f){
      document.fonts.add(f);
      el.style.fontFamily = "'" + name + "', 'LMCHan', Georgia, serif";
    }).catch(function(){});
  }
  // 원본 다운로드 — 일반적인 확인창(confirm) 그대로
  function askDownload(p){
    if (p.kind === 'person'){
      if (window.confirm('인물 사진의 원본은 구매 문의로 제공됩니다.\n문의 메일을 작성하시겠습니까?')){
        location.href = 'mailto:' + (p.buy || CONTACT) +
          '?subject=' + encodeURIComponent('[LMCHAN] 원본 구매 문의 — ' + (p.file || ''));
      }
      return;
    }
    if (!window.confirm('다운로드 하시겠습니까?')) return;
    var url = p.file ? buildUrl(p.file) : (p.url || '');
    if (!url) return;
    fetch(url)
      .then(function(r){
        if (!r.ok) throw new Error(r.status);
        return r.blob();
      })
      .then(function(blob){
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = p.file || 'LMCHAN';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      })
      .catch(function(){
        window.open(url, '_blank', 'noopener');   // 막히면 새 탭으로라도 원본을 연다
      });
  }
  var pin = L.divIcon ? L.divIcon({
    className: 'pin', html: '<span></span>',
    iconSize: [16, 16], iconAnchor: [8, 8]
  }) : null;
  var maps = [];
  function makeMap(el, c){
    var map = L.map(el, {
      attributionControl:false, zoomControl:false,
      dragging:false, scrollWheelZoom:false, doubleClickZoom:false,
      touchZoom:false, boxZoom:false, keyboard:false
    });
    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',
      { maxZoom: 20, className: 'base-tiles' }
    ).addTo(map);
    L.marker([c.lat, c.lng], { icon: pin }).addTo(map);
    map.setView([c.lat, c.lng], MAP_ZOOM);
    maps.push({ map: map, c: c });
    return map;
  }
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      maps.forEach(function(o){
        o.map.invalidateSize(false);
        o.map.setView([o.c.lat, o.c.lng], MAP_ZOOM);
      });
    }, 120);
  });
  // ── 포스트: 글귀 → 날짜와 주소 → 사진 → 좌표 → 지도 ──
  function makePost(p){
    var sec = document.createElement('section');
    sec.className = 'post';
    // 글귀 (파일이 없으면 자리 없이 조용히 넘어간다)
    var ph = phraseUrl(p);
    if (ph){
      var pimg = document.createElement('img');
      pimg.className = 'phrase';
      pimg.alt = '';
      pimg.decoding = 'async';
      pimg.src = ph;
      pimg.onerror = function(){ pimg.remove(); };
      sec.appendChild(pimg);
    }
    // 날짜와 주소 — 포스트 전용 폰트
    var addr = document.createElement('div');
    addr.className = 'addr';
    addr.textContent = [dateOf(p), p.address || ''].filter(Boolean).join(' · ');
    if (addr.textContent){
      applyFont(p, addr);
      sec.appendChild(addr);
    }
    // 사진 (누르면 다운로드 확인창)
    var wrap = document.createElement('div');
    wrap.className = 'photo';
    var src = p.file ? buildUrl(p.file) : (p.url || '');
    var media;
    if (isVideo(p.file || p.url)){
      media = document.createElement('video');
      media.muted = true; media.loop = true; media.autoplay = true;
      media.playsInline = true; media.setAttribute('playsinline', '');
      media.preload = 'metadata';
      media.src = src;
    } else {
      media = document.createElement('img');
      media.alt = p.address || '';
      media.loading = 'lazy';
      media.decoding = 'async';
      media.src = src;
    }
    wrap.appendChild(media);
    wrap.addEventListener('click', function(){ askDownload(p); });
    sec.appendChild(wrap);
    // 좌표
    var co = document.createElement('div');
    co.className = 'coord';
    co.textContent = coordText(p);
    if (co.textContent) sec.appendChild(co);
    // 지도
    var c = coordsOf(p);
    if (c && typeof L !== 'undefined'){
      var mapEl = document.createElement('div');
      mapEl.className = 'map';
      sec.appendChild(mapEl);
      // 크기가 잡힌 뒤 지도를 만든다
      setTimeout(function(){ makeMap(mapEl, c); }, 0);
    }
    return sec;
  }
  fetch(PLACES_JSON + '?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(raw){
      var items = flattenPlaces(raw);
      loading.hidden = true;
      if (!items.length){ noneEl.hidden = false; return; }
      var frag = document.createDocumentFragment();
      items.forEach(function(p){ frag.appendChild(makePost(p)); });
      posts.appendChild(frag);
    })
    .catch(function(){
      loading.hidden = true;
      noneEl.hidden = false;
    });
})();
</script>
</body>
</html>
