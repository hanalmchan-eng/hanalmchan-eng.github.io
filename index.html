<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hanalmchan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

<style>
  :root{
    --paper:#ffffff;
    --ink:#141414;
    --ink-60:rgba(20,20,20,.6);
    --ink-35:rgba(20,20,20,.35);
    --ink-16:rgba(20,20,20,.14);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%; overflow:hidden;
    background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }

  #scene{
    position:fixed; inset:0;
    cursor:grab; touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  #scene.dragging{ cursor:grabbing; }
  #scene:focus-visible{ outline:2px solid var(--ink); outline-offset:-10px; }

  .stage{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    will-change:transform, opacity;
  }
  .stage.settling{ transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .5s ease; }
  .stage.opening{ transition:transform .6s cubic-bezier(.16,1,.3,1), opacity .6s ease; }

  .top-bar{
    padding:clamp(20px,4vh,32px) 24px 0;
    display:flex; justify-content:flex-end;
  }
  .vol{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-60);
  }

  .hero{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:0 24px;
  }

  .wordmark{
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform:translateY(12px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .wordmark img{
    display:block; max-width:min(70vw,440px); height:auto;
  }
  .wordmark img:not([src]), .wordmark img[src=""]{ display:none; }
  .wordmark-fallback{
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic; font-weight:400;
    font-size:clamp(42px,11vw,96px);
    line-height:1;
    text-transform:lowercase;
    color:var(--ink);
  }

  .rule-wrap{
    margin-top:clamp(26px,6vh,52px);
    display:flex; flex-direction:column; align-items:center;
  }
  .rule{
    width:1px; height:clamp(72px,16vh,160px);
    background:var(--ink-16);
    transform:scaleY(0); transform-origin:top;
    transition:transform .8s cubic-bezier(.16,1,.3,1) .15s;
  }
  .chevron{ margin-top:12px; color:var(--ink-35); opacity:0; }

  #scene.ready .wordmark{ opacity:1; transform:translateY(0); }
  #scene.ready .rule{ transform:scaleY(1); }
  #scene.ready .chevron{
    animation:chevFadeIn .5s ease forwards .8s, chevPulse 3.2s ease-in-out infinite 1.3s;
  }
  #scene.dragging .chevron{ animation-play-state:paused; }

  @keyframes chevFadeIn{ from{ opacity:0; } to{ opacity:.4; } }
  @keyframes chevPulse{ 0%,100%{ opacity:.35; } 50%{ opacity:.85; } }

  #hint{ padding:0 24px clamp(26px,6vh,44px); text-align:center; }
  #hint-text{
    font-size:10px; letter-spacing:.04em; line-height:1.7;
    color:var(--ink-60);
  }

  #veil{
    position:fixed; inset:0; background:var(--paper);
    opacity:0; pointer-events:none; z-index:200;
    transition:opacity .4s ease;
  }
  #veil.show{ opacity:1; }

  @media (prefers-reduced-motion:reduce){
    .wordmark, .rule{ transition-duration:.01s !important; }
    .chevron{ animation:none !important; opacity:.4; }
    .stage.settling, .stage.opening{ transition-duration:.15s; }
  }
</style>
</head>
<body>

  <div id="scene" role="button" tabindex="0" aria-label="hanalmchan — 위로 밀거나 클릭하여 입장">
    <div class="stage">
      <div class="top-bar">
        <span class="vol">Vol. 01</span>
      </div>

      <div class="hero">
        <div class="wordmark">
          <img id="mark-img" alt="" draggable="false">
          <span class="wordmark-fallback" id="mark-fallback">hanalmchan</span>
        </div>
        <div class="rule-wrap">
          <div class="rule" aria-hidden="true"></div>
          <svg class="chevron" width="14" height="8" viewBox="0 0 14 8" aria-hidden="true">
            <path d="M1 7L7 1L13 7" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div id="hint"><div id="hint-text"></div></div>
    </div>
  </div>

  <div id="veil"></div>

<script>
(function(){
  'use strict';

  // ====== 설정: 실제 배포 시 이 두 값만 맞춰주면 됩니다 ======
  var LOGO_SRC = 'logo.png';        // 워드마크 이미지 경로 (없으면 텍스트로 대체)
  var NEXT_URL = 'hanalmchan.html'; // 입장 시 이동할 갤러리 페이지
  // ===========================================================

  var scene    = document.getElementById('scene');
  var stage    = document.querySelector('.stage');
  var veil     = document.getElementById('veil');
  var hintText = document.getElementById('hint-text');
  var markImg  = document.getElementById('mark-img');
  var fallback = document.getElementById('mark-fallback');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 워드마크 로고 로드 시도, 실패하면 텍스트로 대체 ----
  (function loadMark(){
    var probe = new Image();
    probe.onload = function(){
      if (probe.naturalWidth === 0) return;
      markImg.src = LOGO_SRC;
      fallback.style.display = 'none';
    };
    probe.src = LOGO_SRC;
  })();

  hintText.innerHTML =
    '위로 밀어서 살펴보기 · 또는 클릭<br>' +
    'Swipe up to enter · or click<br>' +
    '上にスワイプ · またはクリック';

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ scene.classList.add('ready'); });
  });

  // ---- 위로 밀어서(또는 클릭해서) 입장 ----
  var OPEN_PX = 64;
  var TAP_PX  = 8;

  var dragging = false;
  var activePointerId = null;
  var startY = 0, maxMove = 0, currentDy = 0;
  var opened = false;
  var suppressNextClick = false;

  function applyDrag(dy){
    var lift = Math.max(0, Math.min(dy, 260));
    var opacity = 1 - Math.min(lift / 220, 1) * 0.55;
    stage.style.transform = 'translateY(' + (-lift) + 'px)';
    stage.style.opacity = String(opacity);
    veil.style.opacity = String(Math.min(lift / 220, 1) * 0.85);
  }

  function resetInline(){
    stage.style.transform = '';
    stage.style.opacity = '';
    veil.style.opacity = '';
  }

  function springBack(){
    scene.classList.remove('dragging');
    stage.classList.add('settling');
    resetInline();
    var done = function(){
      stage.classList.remove('settling');
      stage.removeEventListener('transitionend', done);
    };
    stage.addEventListener('transitionend', done);
  }

  function commitOpen(){
    if (opened) return;
    opened = true;
    scene.classList.remove('dragging');
    scene.setAttribute('aria-disabled', 'true');

    if (reduceMotion){
      veil.classList.add('show');
      setTimeout(function(){ window.location.href = NEXT_URL; }, 180);
      return;
    }

    stage.classList.add('opening');
    stage.style.transform = 'translateY(-56px)';
    stage.style.opacity = '0';
    setTimeout(function(){ veil.classList.add('show'); }, 160);
    setTimeout(function(){ window.location.href = NEXT_URL; }, 520);
  }

  function onPointerDown(e){
    if (opened) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    activePointerId = e.pointerId;
    try { scene.setPointerCapture(e.pointerId); } catch(err){}
    startY = e.clientY;
    maxMove = 0; currentDy = 0;
    scene.classList.add('dragging');
  }

  function onPointerMove(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    var dy = startY - e.clientY;
    currentDy = dy;
    maxMove = Math.max(maxMove, Math.abs(dy));
    applyDrag(dy);
  }

  function onPointerUp(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    scene.classList.remove('dragging');

    if (maxMove < TAP_PX || currentDy >= OPEN_PX){
      commitOpen();
    } else {
      springBack();
    }
    suppressNextClick = true;
    maxMove = 0;
  }

  function onPointerCancel(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    springBack();
  }

  scene.addEventListener('pointerdown', onPointerDown);
  scene.addEventListener('pointermove', onPointerMove);
  scene.addEventListener('pointerup', onPointerUp);
  scene.addEventListener('pointercancel', onPointerCancel);

  scene.addEventListener('click', function(){
    if (suppressNextClick){ suppressNextClick = false; return; }
    commitOpen();
  });

  scene.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      commitOpen();
    }
  });

  window.addEventListener('blur', function(){
    if (dragging){ dragging = false; activePointerId = null; springBack(); }
  });

})();
</script>

</body>
</html>
