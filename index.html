  :root{
    --paper:#ffffff;
    --ink:#141414;
    --ink-60:rgba(20,20,20,.6);
    --ink-35:rgba(20,20,20,.35);
    --ink-16:rgba(20,20,20,.14);
    --ink-08:rgba(20,20,20,.07);
    --cell:112px;   /* 아이콘 한 칸의 너비 */
    --gap:34px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111113;
      --ink:#ececeb;
      --ink-60:rgba(236,236,235,.62);
      --ink-35:rgba(236,236,235,.35);
      --ink-16:rgba(236,236,235,.16);
      --ink-08:rgba(236,236,235,.08);
    }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    min-height:100%;
    background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease, color .3s ease;
  }
  body{
    padding:88px 24px 72px;
    display:flex; flex-direction:column; align-items:center;
  }
  #site-label{
    position:fixed; top:24px; left:20px; z-index:50;
    font-size:12px; letter-spacing:.08em; color:var(--ink-60);
  }
  #wordmark{
    font-family:'LMCHan', Georgia, serif;
    font-size:22px; letter-spacing:.02em; text-transform:lowercase;
    margin-bottom:8px;
  }
  #hint-text{
    font-size:10px; color:var(--ink-35); letter-spacing:.04em; line-height:1.7;
    text-align:center; margin-bottom:56px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(var(--cell), 1fr));
    gap:var(--gap);
    width:100%; max-width:calc(var(--cell) * 6 + var(--gap) * 5);
  }
  .icon{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-decoration:none; color:inherit;
    padding:14px 6px;
    border-radius:10px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .28s cubic-bezier(.22,1,.36,1), background-color .28s ease;
  }
  .icon:hover, .icon:focus-visible{
    transform:translateY(-4px);
    background:var(--ink-08);
  }
  .icon:focus-visible{ outline:1px solid var(--ink-35); outline-offset:2px; }
  /* 로고 마크가 들어갈 크롭 창 — 실제 크기는 JS가 사진 비율에 맞춰 지정 */
  .mark{
    position:relative; overflow:hidden;
    width:100%; height:34px;
    display:flex; align-items:center; justify-content:center;
  }
  .mark img{
    position:absolute; top:0; left:0; max-width:none;
    opacity:0; transition:opacity .5s ease;
  }
  .mark img.is-ready{ opacity:1; }
  /* 로고를 못 읽어온 경우의 대체 표시 */
  .mark-fallback{
    font-family:'LMCHan', Georgia, serif;
    font-size:11px; letter-spacing:.02em; text-transform:lowercase;
    color:var(--ink); white-space:nowrap;
  }
  .mark.has-photo .mark-fallback{ display:none; }
  .cap{
    font-size:9.5px; letter-spacing:.06em; color:var(--ink-35);
    font-variant-numeric:tabular-nums;
  }
  #empty{ font-size:11px; color:var(--ink-35); margin-top:40px; }
  @media (max-width:520px){
    :root{ --cell:88px; --gap:22px; }
    body{ padding:64px 18px 56px; }
  }
  @media (prefers-reduced-motion:reduce){
    .icon{ transition:none; }
    .icon:hover{ transform:none; }
  }
</style>
</head>
<body>
  <div id="site-label">서가</div>
  <div id="wordmark">hanalmchan</div>
  <div id="hint-text">
    아이콘을 눌러 해당 사진으로<br>
    Tap an icon to open that photo
  </div>
  <div id="grid" role="list"></div>
  <div id="empty" hidden>불러올 사진이 없습니다.</div>

<script>
(function(){
  'use strict';
  // ====== 설정 ======
  var GALLERY_URL = 'hanalmchan.html';  // 갤러리 페이지
  var R2_BASE     = 'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev';
  var POSTS_JSON  = 'posts.json';
  var LOGO_W_RATIO  = 0.0936;      // 로고 너비 / 사진 너비
  var LOGO_HW_RATIO = 801 / 1429;  // 로고 높이 / 로고 너비
  // 로고 마크만 타이트하게 보이도록 원본 로고 박스에서 더 잘라내는 비율
  var CROP_TOP = 0.2, CROP_BOTTOM = 0.2, CROP_SIDE = 0.1;
  var MARK_H = 34;                 // 아이콘 로고 높이(px) — CSS .mark height와 맞출 것
  // 갤러리 앵커 규칙. 갤러리 쪽 요소 id가 다르면 이 함수 한 줄만 고치면 됩니다.
  function anchorFor(post, index){
    if (post.id)   return String(post.id);
    if (post.slug) return String(post.slug);
    if (post.file) return String(post.file).replace(/\.[^.]+$/, '');
    return 'p' + index;
  }
  // ==================

  var grid  = document.getElementById('grid');
  var empty = document.getElementById('empty');

  function buildImageUrl(filename){
    return R2_BASE + '/' + encodeURIComponent(filename);
  }
  function srcOf(post){
    if (post.thumb) return /^https?:/.test(post.thumb) ? post.thumb : buildImageUrl(post.thumb);
    if (post.file)  return buildImageUrl(post.file);
    return post.url || '';
  }
  function captionOf(post, index){
    var d = post.date || post.taken || post.createdAt || '';
    if (d){
      var m = String(d).match(/(\d{4})\D?(\d{2})\D?(\d{2})/);
      if (m) return m[1].slice(2) + '.' + m[2] + '.' + m[3];
      return String(d).slice(0, 10);
    }
    return String(index + 1).padStart(2, '0');
  }

  function makeIcon(post, index){
    var a = document.createElement('a');
    a.className = 'icon';
    a.setAttribute('role', 'listitem');
    a.href = GALLERY_URL + '#' + encodeURIComponent(anchorFor(post, index));
    a.setAttribute('aria-label', (post.title || 'hanalmchan') + ' — 사진 열기');

    var mark = document.createElement('span');
    mark.className = 'mark';
    var fb = document.createElement('span');
    fb.className = 'mark-fallback';
    fb.textContent = 'hanalmchan';
    mark.appendChild(fb);

    var cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = captionOf(post, index);

    a.appendChild(mark);
    a.appendChild(cap);

    // 로고 크롭: 사진 안에 이미 합성돼 있는 로고 부분만 잘라 보여준다
    var src = srcOf(post);
    if (src && typeof post.logoX === 'number' && typeof post.logoY === 'number'){
      var img = new Image();
      img.decoding = 'async';
      img.loading = 'lazy';
      img.alt = '';
      img.onload = function(){
        var iw = img.naturalWidth, ih = img.naturalHeight;
        if (!iw || !ih) return;
        // posts.json의 logoX/logoY는 원본 픽셀 기준 → 비율로 환산해 썸네일에도 그대로 적용
        var refW  = post.width || iw;              // 좌표 기준이 되는 원본 너비
        var logoW = refW * LOGO_W_RATIO;
        var logoH = logoW * LOGO_HW_RATIO;
        var refH  = post.height || (ih * (refW / iw));
        var fx = (post.logoX + logoW * CROP_SIDE) / refW;
        var fy = (post.logoY + logoH * CROP_TOP)  / refH;
        var fw = (logoW * (1 - CROP_SIDE * 2)) / refW;
        var fh = (logoH * (1 - CROP_TOP - CROP_BOTTOM)) / refH;
        if (fw <= 0 || fh <= 0) return;
        // 크롭 높이가 MARK_H가 되도록 이미지를 확대/축소
        var dispH = MARK_H / fh;
        var dispW = dispH * (iw / ih);
        var cropW = fw * dispW;
        img.style.width  = dispW + 'px';
        img.style.height = dispH + 'px';
        img.style.left   = 'calc(50% - ' + (cropW / 2) + 'px - ' + (fx * dispW) + 'px)';
        img.style.top    = (-fy * dispH) + 'px';
        img.classList.add('is-ready');
        mark.classList.add('has-photo');
      };
      img.onerror = function(){ /* 실패 시 텍스트 로고 유지 */ };
      img.src = src;
      mark.appendChild(img);
    }
    return a;
  }

  fetch(POSTS_JSON + '?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(posts){
      posts = (posts || []).filter(function(p){ return p && (p.file || p.url); });
      if (!posts.length){ empty.hidden = false; return; }
      var frag = document.createDocumentFragment();
      posts.forEach(function(p, i){ frag.appendChild(makeIcon(p, i)); });
      grid.appendChild(frag);
    })
    .catch(function(){ empty.hidden = false; });
})();
</script>
</body>
</html>
