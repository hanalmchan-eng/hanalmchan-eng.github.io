<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LMCHAN — ORIGINALS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo_mask.png">
<link rel="apple-touch-icon" href="logo_mask.png">
<style>
  @font-face{
    font-family:'LMCHan';
    src:url('fonts/LMCHan.woff2') format('woff2'),
        url('LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'),
        url('LMCHan.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --paper:#ffffff;
    --ink:#141414;
    --ink-60:rgba(20,20,20,.6);
    --ink-35:rgba(20,20,20,.35);
    --ink-16:rgba(20,20,20,.14);
    --ink-08:rgba(20,20,20,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111113;
      --ink:#ececeb;
      --ink-60:rgba(236,236,235,.62);
      --ink-35:rgba(236,236,235,.35);
      --ink-16:rgba(236,236,235,.16);
      --ink-08:rgba(236,236,235,.08);
    }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    min-height:100%;
    background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    padding:20px 24px 96px;
    display:flex; flex-direction:column; align-items:center;
  }
  .section-label{
    align-self:flex-start;
    font-family:'LMCHan', Georgia, serif;
    font-size:26px; letter-spacing:.12em; white-space:nowrap;
    margin-bottom:44px;
    color:#ffffff; mix-blend-mode:difference;
    -webkit-text-stroke:0.4px currentColor;
  }
  #away{
    position:fixed; top:20px; right:22px; z-index:50;
    font-family:'LMCHan', Georgia, serif;
    font-size:22px; letter-spacing:.14em;
    color:var(--ink); text-decoration:none; opacity:.7;
    transition:opacity .3s ease;
  }
  #away:hover{ opacity:1; }
  #sheet{
    width:100%; max-width:560px;
    display:flex; flex-direction:column; align-items:center;
    margin-top:24px;
  }
  #preview{
    width:100%; height:auto; display:block;
    background:var(--ink-08);
  }
  #p-meta{
    text-align:center; margin:18px 0 6px;
    font-size:13px; letter-spacing:.05em; color:var(--ink-60);
    font-variant-numeric:tabular-nums;
  }
  #p-coord{
    text-align:center; margin:0 0 26px;
    font-size:11px; letter-spacing:.08em; color:var(--ink-35);
    font-variant-numeric:tabular-nums;
  }
  #p-price{
    text-align:center; margin:0 0 30px;
    font-size:24px; letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
  }
  .pay-btn{
    display:block; width:100%;
    margin:0 0 12px; padding:15px 20px;
    text-align:center; text-decoration:none; cursor:pointer;
    font-family:inherit; font-size:14px; letter-spacing:.06em;
    color:var(--ink); background:none;
    border:1px solid var(--ink-35); border-radius:2px;
    transition:border-color .25s ease, background-color .25s ease;
  }
  .pay-btn:hover{ border-color:var(--ink); background:var(--ink-08); }
  .pay-note{
    margin-top:18px;
    font-size:11px; letter-spacing:.04em; line-height:1.9;
    color:var(--ink-35); text-align:center; word-break:keep-all;
  }
  #loading, #error{
    margin-top:60px;
    font-size:12px; letter-spacing:.06em; color:var(--ink-35);
    text-align:center; line-height:2;
  }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <div class="section-label">ORIGINALS</div>
  <a id="away" href="index.html">AWAY</a>
  <div id="loading">불러오는 중...</div>
  <div id="error" hidden>해당 사진을 찾을 수 없습니다.</div>
  <div id="sheet" hidden>
    <img id="preview" alt="">
    <div id="p-meta"></div>
    <div id="p-coord"></div>
    <div id="p-price"></div>
    <a id="btn-toss" class="pay-btn" hidden>토스로 송금하기</a>
    <button id="btn-card" class="pay-btn" hidden>카드로 결제하기</button>
    <a id="btn-mail" class="pay-btn" hidden>메일로 문의하기</a>
    <div class="pay-note">
      송금 후 아래 메일로 사진 이름과 입금자명을 보내주시면<br>
      확인 즉시 원본 파일을 보내드립니다.<br>
      <span id="contact-line"></span>
    </div>
  </div>
<script>
(function(){
  'use strict';
  // ====== 설정 — 이 세 값만 채우면 된다 ======
  // 1) 토스 익명 송금 링크 (토스 앱 → 송금 → 링크 만들기, 예: 'https://toss.me/아이디')
  //    비워두면 토스 버튼이 숨겨진다.
  var TOSS_ME = '';
  // 2) 토스페이먼츠 클라이언트 키 (사업자·PG 계약 후 발급, 예: 'live_ck_...')
  //    비워두면 카드 버튼이 숨겨진다. 결제 승인용 서버(Cloudflare Worker)도 필요하다.
  var TOSSPAYMENTS_CLIENT_KEY = '';
  // 3) 문의 메일
  var CONTACT = 'hanalmchan@gmail.com';
  // ==========================================
  var R2_BASE     = 'https://pub-ceb9b80b378a402f8e6967b241cf9128.r2.dev';
  var PLACES_JSON = 'places.json';
  var loading = document.getElementById('loading');
  var errorEl = document.getElementById('error');
  var sheet   = document.getElementById('sheet');
  function buildUrl(name){ return R2_BASE + '/' + encodeURIComponent(name); }
  function param(k){
    var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  function flattenPlaces(raw){
    var out = [];
    (raw || []).forEach(function(entry){
      if (!entry) return;
      var list = entry.items || entry.photos;
      if (Array.isArray(list)){
        list.forEach(function(it){
          if (!it) return;
          var o = (typeof it === 'string') ? { file: it } : it;
          if (!o.date) o.date = entry.date;
          if (o.file || o.url) out.push(o);
        });
      } else if (entry.file || entry.url){
        out.push(entry);
      }
    });
    return out;
  }
  function dateTextOf(p){
    var m = String(p.date || '').match(/(\d{4})\D?(\d{2})\D?(\d{2})/);
    return m ? (m[1] + '.' + m[2] + '.' + m[3]) : '';
  }
  function won(n){
    return '₩ ' + Number(n).toLocaleString('ko-KR');
  }
  var want = param('f');
  fetch(PLACES_JSON + '?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(raw){
      var places = flattenPlaces(raw);
      var post = null;
      for (var i = 0; i < places.length; i++){
        var f = String(places[i].file || '');
        if (f === want || f.replace(/\.[^.]+$/, '') === want){ post = places[i]; break; }
      }
      loading.hidden = true;
      if (!post){ errorEl.hidden = false; return; }
      // 미리보기 (원본이 아니라 축소본 — wsrv 프록시)
      var src = post.file ? buildUrl(post.file) : (post.url || '');
      var prev = document.getElementById('preview');
      prev.src = 'https://wsrv.nl/?url=' + src + '&w=1120&output=webp&q=80';
      prev.onerror = function(){ prev.onerror = null; prev.src = src; };
      prev.alt = post.address || '';
      document.getElementById('p-meta').textContent =
        [dateTextOf(post), post.address || ''].filter(Boolean).join(' · ');
      document.getElementById('p-coord').textContent = post.coord || '';
      // 가격 — places.json 항목의 "price": 50000 (숫자, 원 단위)
      var priceEl = document.getElementById('p-price');
      var hasPrice = typeof post.price === 'number' && post.price > 0;
      priceEl.textContent = hasPrice ? won(post.price) : '가격 문의';
      // ── 버튼들 ──
      // 토스 송금: 링크가 설정된 경우에만. 금액이 있으면 링크 뒤에 금액을 붙인다.
      if (TOSS_ME){
        var bt = document.getElementById('btn-toss');
        bt.href = hasPrice ? (TOSS_ME.replace(/\/$/, '') + '/' + post.price) : TOSS_ME;
        bt.target = '_blank'; bt.rel = 'noopener';
        bt.hidden = false;
      }
      // 카드 결제: 토스페이먼츠 키가 설정된 경우에만.
      // ※ 결제 승인은 서버(Cloudflare Worker)가 필요하다 — successUrl 을 그 주소로 바꿀 것.
      if (TOSSPAYMENTS_CLIENT_KEY && hasPrice){
        var bc = document.getElementById('btn-card');
        bc.hidden = false;
        bc.addEventListener('click', function(){
          var s = document.createElement('script');
          s.src = 'https://js.tosspayments.com/v1/payment';
          s.onload = function(){
            var tp = window.TossPayments(TOSSPAYMENTS_CLIENT_KEY);
            tp.requestPayment('카드', {
              amount: post.price,
              orderId: 'LMCHAN-' + Date.now(),
              orderName: post.file,
              successUrl: location.origin + '/paid.html?f=' + encodeURIComponent(post.file),
              failUrl: location.href
            });
          };
          document.body.appendChild(s);
        });
      }
      // 메일 문의: 항상 표시
      var bm = document.getElementById('btn-mail');
      bm.href = 'mailto:' + CONTACT +
        '?subject=' + encodeURIComponent('[LMCHAN] 원본 구매 — ' + (post.file || ''));
      bm.hidden = false;
      document.getElementById('contact-line').textContent = CONTACT;
      sheet.hidden = false;
      document.title = 'LMCHAN — ORIGINALS · ' + (post.address || post.file || '');
    })
    .catch(function(){
      loading.hidden = true;
      errorEl.hidden = false;
    });
})();
</script>
</body>
</html>
