<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LMCHAN — 결제 결과</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo_mask.png">
<style>
  @font-face{
    font-family:'LMCHan';
    src:url('fonts/LMCHan.woff2') format('woff2'), url('LMCHan.woff2') format('woff2'),
        url('fonts/LMCHan.otf') format('opentype'), url('LMCHan.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --paper:#ffffff; --ink:#141414;
    --ink-60:rgba(20,20,20,.6); --ink-35:rgba(20,20,20,.35);
    --ink-16:rgba(20,20,20,.14); --ink-08:rgba(20,20,20,.07);
    --ok:#1f7a4d; --bad:#a13b3b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111113; --ink:#ececeb;
      --ink-60:rgba(236,236,235,.62); --ink-35:rgba(236,236,235,.35);
      --ink-16:rgba(236,236,235,.16); --ink-08:rgba(236,236,235,.08);
      --ok:#5ec48c; --bad:#e07a7a;
    }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    min-height:100%; background:var(--paper); color:var(--ink);
    font-family:Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;
  }
  body{ padding:60px 22px; display:flex; flex-direction:column; align-items:center; }
  .wrap{ width:100%; max-width:460px; text-align:center; }
  .brand{
    font-family:'LMCHan', Georgia, serif; font-size:22px; letter-spacing:.12em;
    margin-bottom:40px; -webkit-text-stroke:.3px currentColor;
  }
  .status{ font-size:26px; letter-spacing:.04em; margin-bottom:14px; }
  .status.ok{ color:var(--ok); }
  .status.bad{ color:var(--bad); }
  .lead{ font-size:13px; color:var(--ink-60); line-height:1.9; letter-spacing:.03em; margin-bottom:32px; }
  .box{
    text-align:left; border:1px solid var(--ink-16); border-radius:4px;
    padding:18px 20px; margin-bottom:28px;
  }
  .row{ display:flex; justify-content:space-between; gap:14px; padding:7px 0; font-size:13px; }
  .row + .row{ border-top:1px solid var(--ink-08); }
  .row .k{ color:var(--ink-35); letter-spacing:.04em; white-space:nowrap; }
  .row .v{ text-align:right; word-break:break-all; font-variant-numeric:tabular-nums; }
  .back{
    display:inline-block; padding:13px 26px; border:1px solid var(--ink-16);
    border-radius:4px; color:var(--ink); text-decoration:none; font-size:13px; letter-spacing:.06em;
  }
  .back:hover{ background:var(--ink-08); }
  .note{ font-size:10px; color:var(--ink-35); line-height:1.9; margin-top:26px; letter-spacing:.03em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">LMCHAN</div>
    <div id="status" class="status">확인 중…</div>
    <div id="lead" class="lead"></div>
    <div id="box" class="box" hidden></div>
    <a class="back" href="pay.html">← 돌아가기 · Back</a>
    <div id="note" class="note"></div>
  </div>

<script>
(function(){
  'use strict';
  var CONTACT = 'hanalmchan@gmail.com';

  var q = new URLSearchParams(location.search);
  var statusEl = document.getElementById('status');
  var leadEl   = document.getElementById('lead');
  var boxEl    = document.getElementById('box');
  var noteEl   = document.getElementById('note');

  function row(k, v){
    if (!v) return '';
    return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  }

  // 실패: failUrl 에는 code, message 가 붙습니다.
  if (q.get('code')){
    statusEl.textContent = '결제 실패';
    statusEl.className = 'status bad';
    leadEl.innerHTML = '결제가 완료되지 않았습니다.<br>Payment was not completed.';
    boxEl.hidden = false;
    boxEl.innerHTML =
      row('사유 · Reason', q.get('message') || '-') +
      row('코드 · Code', q.get('code'));
    noteEl.innerHTML = '문제가 계속되면 ' +
      '<a href="mailto:'+CONTACT+'">'+CONTACT+'</a> 로 문의해주세요.';
    return;
  }

  // 성공: successUrl 에는 paymentKey, orderId, amount 가 붙습니다.
  var paymentKey = q.get('paymentKey');
  var orderId    = q.get('orderId');
  var amount     = q.get('amount');

  if (paymentKey && orderId && amount){
    statusEl.textContent = '결제 완료';
    statusEl.className = 'status ok';
    leadEl.innerHTML =
      '입력하신 이메일로 원본 파일을 곧 보내드립니다.<br>' +
      'The original file will be sent to your email shortly.<br>' +
      'オリジナルはメールでお送りします。';
    boxEl.hidden = false;
    boxEl.innerHTML =
      row('주문번호 · Order', orderId) +
      row('결제금액 · Amount', '₩' + Number(amount).toLocaleString('ko-KR')) +
      row('결제키 · Key', paymentKey);

    // ── 실제 결제 완료(승인)에는 서버가 필요합니다 ──
    // 아래 fetch 는 server-example.js 의 /confirm 엔드포인트가 있을 때만 동작합니다.
    // 서버가 없으면 결제는 '승인 대기' 상태로 남고 실제로 청구되지 않습니다.
    fetch('/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: Number(amount) })
    }).then(function(r){
      if (!r.ok) throw new Error('confirm ' + r.status);
      noteEl.innerHTML = '결제가 정상 승인되었습니다.';
    }).catch(function(){
      noteEl.innerHTML =
        '※ 결제 승인 서버(/confirm)가 아직 연결되지 않아 최종 승인은 보류 상태입니다.<br>' +
        'server-example.js 를 배포하면 자동 승인됩니다.';
    });
    return;
  }

  // 파라미터가 없을 때
  statusEl.textContent = '잘못된 접근';
  statusEl.className = 'status bad';
  leadEl.innerHTML = '결제 정보를 확인할 수 없습니다.<br>No payment information found.';
})();
</script>
</body>
</html>
